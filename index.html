  const an=pushAktiv();
  modal(`<h2>🔔 Benachrichtigungen</h2>
   <div class="small mute">${!can.planen()?`Du bekommst eine Nachricht aufs Handy bei <b>neuen Terminen</b>, <b>Nachrichten</b> von JD Brüder und sobald dein <b>Bericht bestätigt</b> ist${can.sub()?" (dann kannst du die Rechnung schreiben)":""}.`:"Du bekommst eine Nachricht aufs Handy, sobald meta einen Auftrag als <b>abholbereit</b> bestätigt, jemand eine <b>Reklamation</b> erfasst, ein Bericht <b>zur Prüfung</b> kommt oder dir jemand im Auftrag <b>schreibt</b>."} Antippen öffnet den Auftrag.</div>
   ${!pushUnterstuetzt()?`<div class="banner warn" style="margin-top:10px">${ios&&!standalone?"Auf dem iPhone geht das nur aus der installierten App: In Safari auf <b>Teilen</b> → <b>Zum Home-Bildschirm</b> tippen, die App dort öffnen und hier erneut tippen.":"Dieser Browser unterstützt keine Benachrichtigungen. Bitte die App auf dem Handy öffnen (Chrome oder installierte App)."}</div>`:""}
   <div id="pst" class="small" style="margin-top:10px">${an?"✓ Auf diesem Gerät eingeschaltet.":""}</div>
   <div class="grid2" style="margin-top:12px">${an?`<button class="btn" id="pOff">Ausschalten</button><button class="btn pri" id="pTest">Test senden</button>`:`<button class="btn" data-close>Später</button><button class="btn pri" id="pOn" ${pushUnterstuetzt()?"":"disabled"}>Einschalten</button>`}</div>`,(m,close)=>{
    const st=m.querySelector("#pst");
    const test=async()=>{ st.innerHTML=`<span class="spin"></span> Test wird gesendet …`; try{ const r=await S.sync.run({pushTest:true}); st.textContent=r.gesendet?"✓ Test gesendet – die Nachricht sollte gleich erscheinen.":"Nicht gesendet: "+(r.grund||"kein Gerät gefunden"); }catch(e){ st.textContent="Nicht gesendet: "+(e.message||e.code); } };
    m.querySelector("#pOn") && (m.querySelector("#pOn").onclick=async()=>{ st.innerHTML=`<span class="spin"></span> wird eingeschaltet …`; try{ await pushEinschalten(); render(); await test(); }catch(e){ st.textContent=e.message||String(e); } });
    m.querySelector("#pTest") && (m.querySelector("#pTest").onclick=test);
    m.querySelector("#pOff") && (m.querySelector("#pOff").onclick=async()=>{ await pushAusschalten(); render(); close(); toast("Benachrichtigungen ausgeschaltet"); });
  });
}

/* ============ Bericht senden ============ */
function berichtText(o){
  const b=o.bericht||{}; const typ=o.berichtTyp||o.abschluss?.typ||"ok";
  const lf=(o.leerfahrten||[]).slice(-1)[0];
  const rk=Object.values(S.reklas).filter(r=>r.auftragId===o.id).sort((a,c)=>c.am-a.am)[0];
  const tage=[...new Set((o.zeiten||[]).map(z=>new Date(z.s).toLocaleDateString("de-DE")))].join(", ");
  const L=[];
  L.push("Guten Tag,","");
  if(typ==="leerfahrt") L.push(`Auftrag ${o.nr} (${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}): Leerfahrt – die Baustelle war nicht montagefertig, eine Montage war nicht möglich.`);
  else if(typ==="rekla") L.push(`Auftrag ${o.nr} (${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}): Montage abgeschlossen, es gibt eine Reklamation (siehe unten).`);
  else L.push(`Auftrag ${o.nr} (${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}): Baustelle erfolgreich abgeschlossen.`);
  L.push("","Montagebericht:");
  if(typ==="leerfahrt"&&lf){ L.push(`- Status: ${lf.status||"Leerfahrt"}`,`- Datum: ${new Date(lf.am).toLocaleDateString("de-DE")}`,lf.fahrzeug?`- Fahrzeug: ${fahrzeugText(lf)}${mitAnhaenger(lf)?" – Bitte beachten: Anhängerfahrt":""}`:null,`- Selbst gefahrene km: ${lf.km||"-"}`,`- Personen vor Ort: ${lf.personen||"-"}`,lf.personenMit?`- Mitgefahren: ${lf.personenMit}`:null,`- Zeit: ${Math.floor(lf.minuten/60)} Std ${lf.minuten%60} Min`,`- Grund: ${lf.grund}`,lf.schreibenAm?`- Schreiben an den Kunden gesendet am ${new Date(lf.schreibenAm).toLocaleDateString("de-DE")}${lf.schreibenAn?" an "+lf.schreibenAn:""}`:null); }
  else {
    const uebern=naechteText(b)||"-";
    if(istReklaAuftrag(o) && arbeitszeitMin(o)>0) L.push(`- Reklamation – Arbeitszeit: ${fmtHMin(arbeitszeitMin(o))} Std.${b.personen?` × ${b.personen} Personen`:""}`);
    L.push(`- Montagetag(e): ${tage||"-"}`,`- Personen vor Ort: ${b.personen||"-"}`,`- Selbst gefahrene km: ${leer(b.istKm)?"-":b.istKm}`,hotelKm(o)?`- Hotelfahrten (Baustelle ↔ Hotel): ${hotelText(o)}`:null,o.einsatz?.fahrzeug?`- Fahrzeug: ${fahrzeugText(o.einsatz)}${mitAnhaenger(o.einsatz)?" – Bitte beachten: Anhängerfahrt":""}`:null,(istReklaAuftrag(o)&&!b.geschosse?null:`- Geschosse (Material getragen): ${b.geschosse||"-"}`),`- Übernachtungen: ${uebern}`);
    const tot=summeMengen(o); const pos=Object.entries(tot).filter(([k])=>k!=="stunden").map(([k,v])=>`${fmtZahl(v)}× ${(S.lohnPos.find(p=>p.k===k)||{}).label||k}`);
    if(pos.length) L.push(`- Positionen:`,...pos.map(x=>`   • ${x.replace("× "," × ")}`));
    if(b.taetigkeit) L.push(`- Ausgeführt: ${b.taetigkeit}`);
    sonderFertig(b).forEach(s=>L.push(`- ${istReklaAuftrag(o)?"Zusatzarbeit":"Sonderarbeit"}: ${sonderZeile(s)}`));
    if(b.bemerkung) L.push(`- Bemerkungen: ${b.bemerkung}`);
    vorleistungZeilen(o).forEach(z=>L.push(`- ${z}`));
    if(o.unterschrift) L.push(`- Sichtabnahme unterschrieben von: ${o.unterschrift.name||vd(o).abnahmeName||"-"}${vd(o).firma?` (${vd(o).firma})`:""} am ${new Date(o.unterschrift.am).toLocaleDateString("de-DE")}`);
    else if(o.abnahmePapier) L.push(`- Sichtabnahme: auf Papier unterschrieben`);
    else L.push(`- Sichtabnahme: steht noch aus`);
  }
  if((typ==="rekla"||typ==="leerfahrt") && rk){ L.push("","Reklamation:",`- Ursache: ${URSACHEN[rk.ursache]||rk.ursache}`,`- Beschreibung: ${rk.text}`); }
  L.push("",typ==="leerfahrt"?"Montagebericht im Anhang.":abnahmeOk(o)?"Montagebericht und Sichtabnahmebescheinigung im Anhang.":"Montagebericht im Anhang. Die Sichtabnahme reichen wir nach.","","Mit freundlichen Grüßen","JD Brüder");
  return L.filter(x=>x!==null).join("\n");
}
async function blobToB64(blob){ return await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
function berichtDialog(id){
  const o=S.orders[id];
  const typ=o.berichtTyp||o.abschluss?.typ||"ok";
  const rk=Object.values(S.reklas).filter(r=>r.auftragId===id).sort((a,c)=>c.am-a.am)[0];
  const cands=[];
  Object.values(S.fotos).forEach(f=>{ if(/^image/.test(f.typ||"image") && f.kat!=="unterlagen") cands.push({assetId:f.assetId,label:{vorher:"Vorher",nachher:"Nachher",vordruck:"Berichtszettel",abnahme:"Sichtabnahme"}[f.kat]||(/^sonder:/.test(f.kat)?"Sonderarbeit":f.kat),def:f.kat!=="vorher"}); });
  if((typ==="rekla"||typ==="leerfahrt") && rk) (rk.fotos||[]).forEach(a=>cands.push({assetId:a,label:"Reklamation",def:true}));
  if(o.unterschrift) cands.push({assetId:o.unterschrift.assetId,label:"Unterschrift",def:true,png:true});
  const subject=`${o.nr} ${o.bauvorhaben||""}`.trim()+(typ==="leerfahrt"?" – Leerfahrt":typ==="rekla"?" – Reklamation":"");
  const to=istTest(o)?testAn():(S.settings.berichtEmail||"Montagebericht@meta.de");
  modal(`<h2>Bericht abschicken</h2>${testHinweis(o)}
   <label class="f">PDF-Vorschau Montagebericht</label>
   <div id="pv" style="min-height:60px"><span class="spin"></span> Vorschau wird erstellt …</div>
   <div class="small mute">Stimmt etwas nicht? Schließen und im Montagebericht oder unter „Montagebericht-PDF“ korrigieren.</div>
   <label class="f">An</label><input class="i" id="to" value="${esc(to)}">
   <label class="f">Betreff</label><input class="i" id="sj" value="${esc(subject)}">
   <label class="f">Text</label><textarea class="i" id="bd" style="min-height:240px">${esc(berichtText(o))}</textarea>
   <label class="row" style="margin-top:10px;gap:8px"><input type="checkbox" id="withPdf" checked style="width:20px;height:20px"><b>Montagebericht als PDF anhängen${abnahmeOk(o)?" (mit unterschriebener Sichtabnahme)":""}</b></label>
   ${abnahmeOk(o)?"":`<div class="small mute">Sichtabnahme noch nicht erfolgt – sie wird nicht mitgeschickt.</div>`}
   <label class="f">Fotos anhängen</label>
   <div class="thumbs">${cands.map((c,i)=>`<label class="t" style="cursor:pointer"><img src="_blob/${esc(c.assetId)}" alt=""><input type="checkbox" data-ci="${i}" ${c.def?"checked":""} style="position:absolute;top:5px;left:5px;width:20px;height:20px"><span style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 4px">${esc(c.label)}</span></label>`).join("")||`<span class="small mute">Keine Fotos vorhanden.</span>`}</div>
   <div id="st" class="small mute" style="margin-top:8px"></div>
   <div class="grid2" style="margin-top:14px"><button class="btn" data-close>Abbrechen</button><button class="btn pri" id="ok">✉︎ Jetzt senden</button></div>`,(m,close)=>{
    renderVordruck(o).then(cs=>{ const show=o.unterschrift?cs:cs.slice(0,1); m.querySelector("#pv").innerHTML=show.map(c=>`<img src="${c.toDataURL("image/jpeg",.8)}" alt="Vorschau" style="width:100%;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:zoom-in" data-z>`).join(""); m.querySelectorAll("#pv [data-z]").forEach(im=>im.onclick=()=>vorschauZeigen(show,`Montagebericht ${o.nr}`)); }).catch(()=>{ m.querySelector("#pv").textContent="Vorschau nicht möglich."; });
    m.querySelector("#ok").onclick=async()=>{
      const btn=m.querySelector("#ok"), st=m.querySelector("#st");
      const toV=m.querySelector("#to").value.trim(); if(!/@/.test(toV)) return toast("Empfänger fehlt");
      if(!await confirmBox("Bericht wirklich senden?",`An ${esc(toV)} – Betreff „${esc(m.querySelector("#sj").value)}“`,"Senden","pri")) return;
      btn.disabled=true; st.innerHTML=`<span class="spin"></span> Fotos werden vorbereitet …`;
      const atts=[]; let size=0, skipped=0;
      if(m.querySelector("#withPdf").checked){
        try{ st.innerHTML=`<span class="spin"></span> PDF wird erstellt …`; let pdf=await makeVordruckPdf(o); if(pdf.size>520000) pdf=await makeVordruckPdf(o,.5); const b64=await blobToB64(pdf); size+=b64.length; atts.push({content:b64,filename:`Montagebericht_${idOf(o.nr)}.pdf`,mimeType:"application/pdf"}); }
        catch(e){ btn.disabled=false; st.textContent="PDF konnte nicht erstellt werden: "+(e.message||e); return; }
      }
      if(!o.unterschrift && o.abnahmeDatei && !/^image/.test(o.abnahmeDatei.typ||"")){ try{ const raw=await (await fetch("_blob/"+o.abnahmeDatei.assetId)).blob(); const b64=await blobToB64(raw); size+=b64.length; atts.push({content:b64,filename:`Sichtabnahme_unterschrieben_${idOf(o.nr)}.pdf`,mimeType:raw.type||"application/pdf"}); }catch(e){} }
      const sel=[...m.querySelectorAll("[data-ci]:checked")].map(x=>cands[+x.dataset.ci]);
      for(const c of sel){
        try{
          const raw=await (await fetch("_blob/"+c.assetId)).blob();
          const b=c.png?raw:await shrink(raw,1280,.72);
          const b64=await blobToB64(b);
          if(size+b64.length>850000){ skipped++; continue; }
          size+=b64.length; atts.push({content:b64,filename:`${idOf(o.nr)}_${c.label}_${atts.length+1}.${c.png?"png":"jpg"}`,mimeType:c.png?"image/png":"image/jpeg"});
        }catch(e){ skipped++; }
      }
      st.innerHTML=`<span class="spin"></span> wird gesendet …`;
      try{
        const r=await S.mcp.callTool(GM,"send_message",{to:[toV],subject:m.querySelector("#sj").value.trim(),body:m.querySelector("#bd").value,attachments:atts});
        await upd(orderPath(id),{berichtStatus:"gesendet",berichtGesendetAm:Date.now(),berichtAn:toV,berichtMailId:r.payload?.id||""});
        close(); toast("Bericht gesendet ✓"+(skipped?` (${skipped} Foto(s) zu groß, nicht angehängt)`:""),4000);
      }catch(e){
        btn.disabled=false;
        st.textContent = e.code==="approval_required" ? "Du darfst noch keine Mails über die App senden – der Bericht bleibt für den Chef zum Versand bereit." : (e.code==="server_unavailable"||e.code==="upstream_error") ? "Unklar, ob die Mail raus ist – bitte im Gmail-Postausgang nachsehen, bevor du nochmal sendest." : "Nicht gesendet: "+mcpMsg(e);
      }
    };
  });
}

/* ============ Aktualisieren: neuesten Stand laden ============ */
async function jetztAktualisieren(){
  const b=$("#aktualisieren"); if(b){ b.classList.add("dreht"); b.disabled=true; }
  try{ const reg=await navigator.serviceWorker?.getRegistration(); await reg?.update(); }catch(e){}
  try{ await Promise.all(["index.html","claude-shim.js","config.js","sw.js"].map(u=>fetch(u,{cache:"reload"}).catch(()=>{}))); }catch(e){}
  location.reload();
}
// Gibt es eine neuere Version? (version.json wird beim Bauen geschrieben) → roter Punkt am Knopf
async function versionPruefen(){
  if(!window.JD_BUILD) return;
  try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return; const v=(await r.json()).build;
    if(v && v!==window.JD_BUILD){ $("#aktualisieren")?.classList.add("neu"); if(!S.versionGemeldet){ S.versionGemeldet=true; toast("Neue Version da – oben rechts auf ↻ tippen",4500); } } }catch(e){}
}
$("#aktualisieren").onclick=jetztAktualisieren;
// Fußleiste („Insel“): beim Runterscrollen und beim Tippen in Felder ausblenden, beim Hochscrollen wieder zeigen
{ let letzt=window.scrollY;
  const setze=weg=>document.body.classList.toggle("nav-weg",weg);
  window.addEventListener("scroll",()=>{ const y=window.scrollY, d=y-letzt;
    if(Math.abs(d)>6){ setze(d>0 && y>80); letzt=y; }
    if(y<40 || window.innerHeight+y>=document.body.scrollHeight-4) setze(false); },{passive:true});
  document.addEventListener("focusin",e=>{ if(e.target.matches?.("input,textarea,select")) setze(true); });
  document.addEventListener("focusout",()=>setTimeout(()=>{ if(!document.activeElement?.matches?.("input,textarea,select")) setze(false); },120));
  window.addEventListener("hashchange",()=>setze(false)); }
setTimeout(versionPruefen,8000); setInterval(versionPruefen,10*60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ versionPruefen(); setTimeout(ankunftPruefen,800); } });
setInterval(()=>{ if(S.user&&document.visibilityState==="visible") ankunftPruefen(); },45000);

boot();
</script>
