<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>JD Brüder Montage</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e4e7ec;
  --brand:#1d3a5f;--brand2:#2d5a8e;--accent:#e8a33d;
  --ok:#1f8a4c;--okbg:#e6f4ec;--warn:#b26b00;--warnbg:#fdf1dc;--bad:#c4302b;--badbg:#fbe9e8;--info:#2758a8;--infobg:#e7eefb;--grey:#5b6472;--greybg:#eef0f3;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .logo{font-weight:800;letter-spacing:.3px;font-size:17px}
header.top .logo small{display:block;font-weight:500;font-size:11.5px;opacity:.75;letter-spacing:0}
header.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--greybg);color:var(--grey)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}.chip.dark{background:rgba(255,255,255,.16);color:#fff}.chip.gold{background:#fff4dc;color:#8a5a00}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;max-width:150px;text-align:center;padding:8px 2px 9px;font-size:11.5px;color:var(--mute);text-decoration:none;font-weight:600}
nav.bottom a .ic{display:block;font-size:20px;line-height:1.2}
nav.bottom a.on{color:var(--brand)}
nav.bottom a .dot{display:inline-block;min-width:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;margin-left:2px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:12.5px}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:650;cursor:pointer;background:var(--greybg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;min-height:44px}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.warn{background:var(--accent);color:#2b1a00}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:block;font-size:12px;font-weight:650;color:var(--mute);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;min-height:44px}
textarea.i{min-height:84px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--brand2);outline-offset:-1px;border-color:transparent}
.seg{display:flex;background:var(--greybg);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:650;font-size:13px;cursor:pointer;color:var(--grey);min-height:38px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.phasen button{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;min-width:70px}
.seg.phasen{flex-wrap:nowrap}
@media(max-width:560px){.seg.phasen button{min-width:0;flex:1 1 0;padding:7px 2px;font-size:12px;hyphens:manual;overflow-wrap:normal}}
.seg.phasen .n{font-size:11px;font-weight:700;background:var(--line);color:var(--grey);border-radius:9px;padding:0 7px}
.seg.phasen button.on .n{background:var(--brand);color:#fff}
.seg.phasen button.st.on .n{background:var(--bad)}
.seg.laender button{font-size:12.5px;min-height:34px;padding:5px 6px}
.seg.laender .n{font-size:11px;font-weight:700;color:var(--grey);margin-left:2px}
.metacard.fertig{border-color:#bfe3cc;background:#f6fbf8}
.order.storno{opacity:.75}.order.storno .bv{text-decoration:line-through}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input{flex:1}
.q-w{flex:1;position:relative;display:flex;min-width:0}.q-w input{flex:1;padding-right:64px;min-width:0}
.q-w input::-webkit-search-cancel-button{display:none}
.q-tast{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--greybg,#f1f1f1);color:var(--ink);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:750;cursor:pointer;min-height:32px}
.kw{margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px}
.kw b{font-size:16px}
.kw .now{color:var(--accent);font-weight:700;font-size:12px}
.order{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.order:active{background:#fafafa}
.order .nr{font-weight:800;font-size:17px;letter-spacing:.2px}
.order .bv{font-weight:600}
.order .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.order.done{opacity:.72}
.order.hl{border-color:var(--accent);box-shadow:0 0 0 2px #f6dcae}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
@media(max-width:420px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.big{font-size:22px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;letter-spacing:.5px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.thumbs .t{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--greybg);border:1px solid var(--line);cursor:zoom-in}
.thumbs .t img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .t.pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);cursor:pointer;padding:4px;text-align:center}
.thumbs .t.pdf span{font-size:30px}.thumbs .t.pdf small{font-size:10.5px;word-break:break-all;line-height:1.2;max-height:2.4em;overflow:hidden}
.thumbs .t .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:7px;width:24px;height:24px;cursor:pointer;font-size:13px}
.thumbs .t .x.u{right:auto;left:3px}
.um-z{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.um-z .fp{justify-content:center;text-align:center}
.thumbs .add{display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px dashed var(--line);border-radius:9px;aspect-ratio:1;color:var(--mute);font-size:12px;cursor:pointer;text-align:center;padding:4px}
.thumbs .add span{font-size:22px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--brand2);font-weight:650;margin-bottom:10px;cursor:pointer;background:none;border:0;padding:6px 0}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--warnbg);color:#6b4100}.banner.bad{background:var(--badbg);color:#7a1d19}.banner.info{background:var(--infobg);color:#1b3d78}.banner.ok{background:var(--okbg);color:#14532d}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
table.pos{width:100%;border-collapse:collapse;font-size:13.5px}
table.pos td,table.pos th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.pos td:first-child,table.pos th:first-child{text-align:left}
table.pos tfoot td{font-weight:800;border-bottom:0}
.steps{display:flex;gap:4px;margin:6px 0 12px}
.steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--ok)}
.steps div.cur{background:var(--accent)}
.q{font-size:18px;font-weight:750;margin:4px 0 10px}
.choice{display:grid;gap:8px}
.choice .btn{min-height:56px;font-size:16px;justify-content:flex-start;padding-left:16px}
.choice .btn.on{background:var(--brand);color:#fff}
.miss{margin:8px 0 0;padding:0;list-style:none}
.miss li{color:var(--bad);font-size:13.5px;padding:2px 0}
.miss li.soft{color:var(--warn)}
.sonder{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.letter{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;font-size:13px;line-height:1.5;white-space:pre-wrap;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.modalbg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modalbg{align-items:center}.modal{border-radius:18px}}
.modal h2{margin:0 0 6px;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14171c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.kal-nav{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.kal-nav .t{flex:1;text-align:center;font-weight:750;font-size:16px}
.kal-nav .btn{min-width:44px;font-size:20px;line-height:1}
.kal-woche{display:grid;gap:8px}
@media(min-width:720px){.kal-woche{grid-template-columns:repeat(var(--tage),minmax(0,1fr));align-items:start}.kal-tag{min-height:140px}}
.kal-tag{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.kal-tag.heute{border:2px solid var(--brand2)}
.kal-tag.frei{padding:6px 8px}
@media(max-width:719px){.kal-tag.frei{display:flex;justify-content:space-between;align-items:center}.kal-tag.frei .kal-kopf{margin:0}}
.kal-kopf{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:750;color:var(--mute);margin-bottom:2px}
.kal-tag.heute .kal-kopf{color:var(--brand2)}
.kal-leer{font-size:12px;color:var(--mute)}
.kal-o{display:block;text-decoration:none;color:var(--ink);background:var(--greybg);border-radius:9px;padding:7px 8px;margin-top:6px;border-left:4px solid var(--brand2);font-size:13px}
.kal-o:hover{filter:brightness(.97)}
.kal-o.fertig{border-left-color:var(--ok);opacity:.75}.kal-o.laeuft{border-left-color:var(--accent);background:var(--warnbg)}.kal-o.ueber{border-left-color:var(--bad);background:var(--badbg)}
.kal-bv{font-weight:600;line-height:1.25;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kal-ort{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal-av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--brand2);color:#fff;font-size:10px;font-weight:700}
.kal-st{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--infobg);color:var(--info)}
.kal-st.ok{background:var(--okbg);color:var(--ok)}.kal-st.bad{background:var(--badbg);color:var(--bad)}.kal-st.warn{background:var(--warnbg);color:var(--warn)}
/* schlichte Listen (gleicher Stil wie der Kalender) */
.toolbar .btn{min-height:46px}
.tun{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tun-p{flex:none;border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--greybg);color:var(--grey);white-space:nowrap}
.tun-p.warn{background:var(--warnbg);color:var(--warn)}.tun-p.bad{background:var(--badbg);color:var(--bad)}.tun-p.info,.tun-p.msg{background:var(--infobg);color:var(--info)}.tun-p.ok{background:var(--okbg);color:var(--ok)}
.tun-p.on{box-shadow:inset 0 0 0 2px currentColor}
.fzeile{display:flex;gap:6px;margin-top:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.fzeile::-webkit-scrollbar{display:none}
@media (max-width:520px){ .fzeile{margin-left:-16px;margin-right:-16px;padding:0 16px} } /* bis zum Bildschirmrand: alles passt, sonst sieht man, dass es weitergeht */
.fp{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:650;color:var(--grey);cursor:pointer;white-space:nowrap;min-height:32px}
.fp .n{font-weight:700;opacity:.75;margin-left:2px}
.fp.on{background:var(--ink);border-color:var(--ink);color:#fff}
.spez-kopf{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:15px}
.spez-kopf .btn{margin-left:auto;min-width:40px}
.li-gr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.li-gr.heute{border:2px solid var(--brand2)}.li-gr.heute .kal-kopf{color:var(--brand2)}
.kal-kopf .rot{color:var(--bad)}.kal-kopf .jetzt{color:var(--accent)}
.li-grid{display:grid;gap:0 8px}
@media(min-width:720px){.li-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
.li-w{min-width:0}
.kal-o.li{font-size:13.5px}
.li-nr{font-size:14.5px;letter-spacing:.2px}
.kal-o.abh{border-left-color:var(--ok)}.kal-o.offen{border-left-color:#98a2b3}
.kal-o.storno{border-left-color:var(--bad);opacity:.7}.kal-o.storno .kal-bv{text-decoration:line-through}
.li-fuss{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;align-items:center}
.kal-st.gold{background:#fff4d6;color:#8a5a00}.kal-st.abh{background:var(--okbg);color:var(--ok)}.kal-st.msg{background:var(--info);color:#fff}
.kal-st:not(.ok):not(.bad):not(.warn):not(.info):not(.gold):not(.abh):not(.msg){background:var(--card);color:var(--grey)}
.kal-av.ok{background:var(--ok)}
.kal-av.wartet{background:var(--card);color:var(--brand2);box-shadow:inset 0 0 0 1.5px var(--brand2)}
.li-akt{display:block;margin:3px 0 0 auto;border:0;background:none;color:var(--grey);font-size:12px;font-weight:650;cursor:pointer;padding:2px 4px}
/* Nachrichten */
.msgs{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.msg{align-self:flex-start;max-width:85%;background:var(--greybg);border-radius:12px 12px 12px 4px;padding:7px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.ich{align-self:flex-end;background:var(--infobg);border-radius:12px 12px 4px 12px}
.msg-k{font-size:11px;font-weight:700;color:var(--mute);margin-bottom:2px}
.msg-schnell{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.msg-schnell::-webkit-scrollbar{display:none}
.tbest{border:2px solid var(--accent)}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
@media(min-width:720px){.setup-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.setup-grid>details.sk{margin:0;padding:12px}
.setup-grid>details.sk[open]{grid-column:1/-1;padding:14px 16px}
details.sk>summary{justify-content:flex-start;gap:8px;min-height:24px}
details.sk>summary .ic{width:18px;height:18px;flex:none;color:var(--brand2)}
details.sk>summary b{font-size:14px;white-space:normal;line-height:1.2;flex:1;min-width:0;overflow-wrap:anywhere}
details.sk>summary .chip{flex:none}
details.sk:not([open])>summary::after{display:none}
details.sk .foldin>h3{font-size:12.5px;color:var(--mute);font-weight:600;margin:0 0 6px}
.konto-k{display:grid;gap:8px;margin-top:12px}
/* Auftrag: kleine Knöpfe oben, Bereiche als aufklappbare Knöpfe */
.kopf-akt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kopf-akt .btn{min-height:36px;padding:6px 13px;font-size:13.5px;border-radius:999px;flex:0 1 auto;white-space:nowrap}
.det-grid{display:grid;gap:8px;align-items:start;margin-bottom:12px}
.det-grid>details.sk{margin:0;padding:10px 8px}
.det-grid>details.sk[open]{grid-column:1/-1;padding:14px 16px}
.det-grid>details.sk:not([open])>summary{flex-direction:column;align-items:center;gap:3px;text-align:center}
.det-grid>details.sk:not([open])>summary b{font-size:13px;text-align:center}
.det-grid>details.sk:not([open])>summary .small{font-size:11.5px;max-width:100%;text-align:center;flex:none}
.det-grid>details.sk[open]>summary b{font-size:15px;flex:none}
.det-grid>details.sk[open]>summary::after{display:block}
.los-k{display:grid;gap:8px;margin-top:12px}
.los-k .btn{min-height:56px;font-size:16px}
.konto-k .btn{display:flex;align-items:center;gap:8px;justify-content:flex-start;width:100%}
@media(min-width:720px){.konto-k{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.kal-monat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.kal-wt{text-align:center;font-size:11.5px;font-weight:700;color:var(--mute);padding:2px 0}
.kal-zelle{min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;cursor:pointer;overflow:hidden}
.kal-zelle.aus{opacity:.45}.kal-zelle.heute{border:2px solid var(--brand2)}
.kal-zn{font-size:11.5px;font-weight:700;color:var(--mute)}
.kal-chip{display:block;background:var(--brand2);color:#fff;border-radius:4px;padding:0 3px;margin-top:2px;font-size:10px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal-chip.fertig{background:var(--ok)}
.kal-mehr{display:block;font-size:10px;color:var(--mute);margin-top:1px}
.kal-n{display:none;margin:4px auto 0;width:24px;height:24px;border-radius:50%;background:var(--brand2);color:#fff;font-size:12px;font-weight:750;align-items:center;justify-content:center}
.kal-n.fertig{background:var(--ok)}
@media(max-width:600px){.kal-chip,.kal-mehr{display:none}.kal-n{display:flex}.kal-zelle{min-height:56px;text-align:center}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.dv{position:fixed;inset:0;z-index:90;background:#1b1f24;display:flex;flex-direction:column;color:#fff}
.dvbar{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#111418}
.dvt{flex:1;min-width:0;font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dvb{min-width:42px;height:42px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.dvp{min-width:52px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;opacity:.85}
.dvstage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}

/* ===== Ruhiges, minimalistisches Design ===== */
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#101828;--mute:#667085;--line:#eaecf0;
  --brand:#1d3a5f;--brand2:#2e5b8f;--accent:#d9912b;
  --ok:#15803d;--okbg:#ecfdf3;--warn:#b54708;--warnbg:#fff6e5;--bad:#d92d20;--badbg:#fef3f2;--info:#1d4ed8;--infobg:#eff4ff;--grey:#475467;--greybg:#f2f4f7;
  --r:16px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
html,body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.005em}
svg.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.cc{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;padding:1px 4px;border-radius:4px;background:currentColor;line-height:1.3;vertical-align:.1em}
.cc{background:none;border:1.5px solid currentColor}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);vertical-align:.05em}
.dotc.ok{background:var(--ok)}.dotc.warn{background:var(--accent)}.dotc.bad{background:var(--bad)}
/* Kopf: hell und ruhig */
header.top{background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header.top .logo{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--brand)}
header.top .logo small{color:var(--mute);opacity:1;font-weight:600;font-size:11px;letter-spacing:.02em;text-transform:uppercase}
header.top .chip.dark,#roleChip{background:var(--greybg);color:var(--grey)}
header.top .btn{background:var(--greybg)!important;color:var(--ink)!important}
/* Karten ohne harte Ränder */
.card{border:0;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card h3{font-size:15px;text-transform:none;letter-spacing:-.005em;color:var(--ink);font-weight:700;margin:0 0 12px}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
/* Auftragskarten */
.order{border:0;box-shadow:var(--sh);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.order .nr{font-size:17px;font-weight:800;letter-spacing:-.01em}
.order .bv{font-weight:600;margin-top:2px}
.order .chips{gap:6px;margin-top:10px}
.order.hl{box-shadow:var(--sh),inset 3px 0 0 var(--accent)}
.order.done{opacity:.6}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;gap:4px;background:var(--greybg);color:var(--grey)}
.chip.gold{background:#fff6e5;color:var(--warn)}
.kw{margin:20px 2px 8px}
.kw b{font-size:14px;color:var(--grey);font-weight:700}
.kw .now{font-size:11.5px}
/* Bedienelemente */
.btn{border-radius:12px;font-weight:600;background:var(--greybg)}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.sm{border-radius:10px}
.btn.warn{background:#fff6e5;color:var(--warn);border:1px solid #fedf89}
input.i,select.i,textarea.i{border-color:var(--line);border-radius:12px;background:#fff}
label.f{font-weight:600;color:var(--grey)}
.seg{background:var(--greybg);border-radius:12px}
.seg button{border-radius:10px;font-weight:600;color:var(--mute)}
.seg button.on{box-shadow:0 1px 3px rgba(16,24,40,.1)}
.seg.phasen .n{background:#fff;color:var(--mute)}
.banner{border-radius:14px;font-size:13.5px;padding:12px 14px}
.banner.bad{background:var(--badbg);color:#912018}.banner.warn{background:var(--warnbg);color:#93370d}.banner.info{background:var(--infobg);color:#1e3a8a}.banner.ok{background:var(--okbg);color:#085d3a}
.toolbar input{background:#fff;box-shadow:var(--sh);border-color:transparent}
.back{color:var(--grey);font-weight:600}
.steps div{height:4px}
.steps div.on{background:var(--brand2)}
.q{font-size:19px;font-weight:700;letter-spacing:-.01em}
.choice .btn{background:#fff;border:1px solid var(--line);font-weight:600}
.choice .btn.on{background:var(--brand);border-color:var(--brand)}
.thumbs .t,.thumbs .add{border-radius:12px}
.thumbs .t.pdf svg.ic{width:28px;height:28px;color:var(--brand2)}
/* Untere Leiste: ruhige Symbole */
nav.bottom{background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line)}
nav.bottom a{font-size:11px;font-weight:600;padding:9px 2px 10px;color:#98a2b3}
nav.bottom a .ic{display:block;margin:0 auto 3px;width:22px;height:22px;stroke-width:1.8}
nav.bottom a.on{color:var(--brand)}
nav.bottom a.on .ic{stroke-width:2.2}
.modal{border-radius:20px 20px 0 0}
@media(min-width:600px){.modal{border-radius:20px}}
.toast{border-radius:14px;font-weight:500}
details.fold>summary,.foldbtn{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after,.foldbtn::after{content:"›";font-size:20px;color:var(--mute);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(90deg)}
details.fold>summary b,.foldbtn b{font-size:15px;white-space:nowrap}
details.fold>summary .small,.foldbtn .small{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.fold .foldin{margin-top:12px}
.dokhinweis{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:999px;padding:1px 8px}
.order.abh{background:#f0fdf4;box-shadow:var(--sh),inset 4px 0 0 var(--ok)}
.chip.abh{background:var(--ok);color:#fff}
#pushBtn{padding:6px 9px}
.seg.phasen button.ab.on .n{background:var(--ok)}
.stlink{border:0;background:none;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:2px}
.stlink.on{color:var(--bad)}
#pushBtn.on{color:var(--ok)!important;background:var(--okbg)!important}
.seg.laender{background:none;padding:0;gap:6px;flex-wrap:nowrap;margin-top:10px!important}
.seg.laender button{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;min-height:32px;font-size:12.5px;white-space:nowrap;color:var(--grey);box-shadow:none}
.seg.laender button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg.laender button.on .cc{color:#fff}
.seg.laender .n{color:inherit;opacity:.7;margin-left:3px}
.nvrow{display:flex;justify-content:flex-end;margin:-4px 0 10px}

/* ===== Gerät: Auswahl ===== */
.geraet-k{justify-content:flex-start;gap:12px;min-height:58px;padding:10px 14px;background:var(--card);border:1.5px solid var(--line)}
.geraet-k.on{border-color:var(--brand2);background:var(--infobg)}
.gk-sym{font-size:24px;width:30px;text-align:center}
/* ===== iPhone: wie iOS – 16px in Feldern (kein Hineinzoomen), Tab-Leiste mit Home-Balken, Blätter mit Griff ===== */
html[data-geraet=ios] body,html[data-geraet=ios] button,html[data-geraet=ios] input,html[data-geraet=ios] select,html[data-geraet=ios] textarea{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
html[data-geraet=ios] input.i,html[data-geraet=ios] select.i,html[data-geraet=ios] textarea.i{font-size:16px}
html[data-geraet=ios] *{-webkit-tap-highlight-color:transparent}
html[data-geraet=ios] .modal{border-radius:14px 14px 0 0;padding-top:22px;position:relative}
html[data-geraet=ios] .modal::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#c7c7cc}
html[data-geraet=ios] .btn.pri{background:#007aff}
html[data-geraet=ios] .toast{border-radius:14px;background:rgba(30,30,32,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html[data-geraet=ios] header.top{border-bottom:.5px solid rgba(0,0,0,.15)}
/* ===== Android: wie Material 3 – runde Knöpfe, Leiste mit Pille hinter dem aktiven Symbol, Snackbar ===== */
html[data-geraet=android] body,html[data-geraet=android] button,html[data-geraet=android] input,html[data-geraet=android] select,html[data-geraet=android] textarea{font-family:Roboto,"Google Sans","Noto Sans",system-ui,sans-serif}
html[data-geraet=android] input.i,html[data-geraet=android] select.i,html[data-geraet=android] textarea.i{font-size:16px;border-radius:12px}
html[data-geraet=android] .btn{border-radius:999px}
html[data-geraet=android] .btn.sm{border-radius:999px}
html[data-geraet=android] .card,html[data-geraet=android] .li-gr{border-radius:16px}
html[data-geraet=android] .modal{border-radius:28px 28px 0 0;padding-top:24px;position:relative}
html[data-geraet=android] .modal::before{content:"";position:absolute;top:10px;left:50%;width:32px;height:4px;margin-left:-16px;border-radius:2px;background:#79747e;opacity:.4}
html[data-geraet=android] .toast{left:16px;right:16px;transform:none;border-radius:6px;text-align:left;background:#313033}
html[data-geraet=android] .fp,html[data-geraet=android] .tun-p{border-radius:8px}

/* ===== Abzeichen: überall gleich ===== */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:0;box-sizing:border-box;vertical-align:middle;flex:none}
.tun-p .badge{margin-left:6px}
details.sk>summary .badge{margin-left:auto}
.foldin>h3 .badge,.card h3 .badge{margin-left:4px}
.msg-b{position:relative;display:inline-flex;align-items:center;gap:3px;font-size:13px;padding:0 2px}
.msg-b .badge{min-width:16px;height:16px;font-size:10px;padding:0 4px}
/* ===== Fußleiste: schwebend, rund, aktives Symbol hinterlegt ===== */

function uebernachtet(b){ b=b||{}; if(b.uebernachtet) return b.uebernachtet; if((b.naechte||[]).length) return "ja"; if(b.hotel==="ja") return "ja"; if(!leer(b.uebernachtungen)) return nn(b.uebernachtungen)>0?"ja":"nein"; return ""; }

function nachtTag(d){ if(!d) return "Datum ?"; const x=new Date(d+"T12:00:00"); return isNaN(x)?String(d):x.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}); }

function naechteText(b){
  const u=uebernachtet(b); if(u==="nein") return "keine"; if(u!=="ja") return "";

  if(!n.length) return `${z} ${z===1?"Nacht":"Nächte"}`;

const isoTag=t=>{ const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

function naechteBauen(o,anzahl,liste){
  const pers=String((o.bericht||{}).personen??o.einsatz?.personenVorOrt??"");
  const out=[]; let d=null;
  (Array.isArray(liste)?liste:[]).forEach(x=>{ const dt=/^\d{4}-\d{2}-\d{2}$/.test(String(x?.datum||""))?x.datum:(d?naechsterTag(d):ersteNacht(o)); out.push({datum:dt,personen:String(x?.personen??pers)}); d=dt; });
  const soll=Math.max(out.length,parseInt(anzahl,10)||0);
  while(out.length<soll){ d=d?naechsterTag(d):ersteNacht(o); out.push({datum:d,personen:pers}); }
  return out;
}

function modal(html, onMount, onClose){
  const root=$("#modalRoot");
  const bg=document.createElement("div"); bg.className="modalbg";
  bg.innerHTML=`<div class="modal">${iconize(html)}</div>`;
  root.appendChild(bg);
  const close=()=>{ if(!bg.isConnected) return; bg.remove(); try{ onClose&&onClose(); }catch(e){} };

  bg.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  onMount && onMount(bg.firstElementChild, close);
  return close;
}

/* ---------- Scans sauber machen: gleichmäßig weißes Papier, klare schwarze Schrift, Raster geglättet, gerade gerichtet ----------
   Läuft komplett auf dem Gerät. Farbige Markierungen (rot, blau) bleiben farbig. */
function maxFilter(a,w,h,r){
  const t=new Uint8ClampedArray(w*h), o=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++){ const row=y*w; for(let x=0;x<w;x++){ let m=0; const x1=Math.min(w-1,x+r); for(let q=Math.max(0,x-r);q<=x1;q++){ const v=a[row+q]; if(v>m) m=v; } t[row+x]=m; } }
  for(let x=0;x<w;x++){ for(let y=0;y<h;y++){ let m=0; const y1=Math.min(h-1,y+r); for(let q=Math.max(0,y-r);q<=y1;q++){ const v=t[q*w+x]; if(v>m) m=v; } o[y*w+x]=m; } }
  return o;
}
const leinwand=(w,h)=>{ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; };
const ctx2=c=>c.getContext("2d",{willReadFrequently:true});
function scanSauber(src,max=2400){
  const w0=src.naturalWidth||src.width, h0=src.naturalHeight||src.height, k=Math.min(1,max/Math.max(w0,h0)), W=Math.max(1,Math.round(w0*k)), H=Math.max(1,Math.round(h0*k));
  const c=leinwand(W,H), x=ctx2(c); x.fillStyle="#fff"; x.fillRect(0,0,W,H); x.drawImage(src,0,0,W,H);
  // 1) Licht ausgleichen: Papierfarbe je Stelle schätzen (Schrift „weggewachsen“) und herausrechnen
  const bw=Math.ceil(W/8), bh=Math.ceil(H/8), b=leinwand(bw,bh), bx=ctx2(b); bx.drawImage(c,0,0,bw,bh);
  const bd=bx.getImageData(0,0,bw,bh), ba=bd.data;
  for(let ch=0;ch<3;ch++){ const k1=new Uint8ClampedArray(bw*bh); for(let i=0;i<bw*bh;i++) k1[i]=ba[i*4+ch]; const m=maxFilter(k1,bw,bh,3); for(let i=0;i<bw*bh;i++) ba[i*4+ch]=m[i]; }
  bx.putImageData(bd,0,0); const g=leinwand(W,H), gx=ctx2(g); gx.filter="blur(6px)"; gx.drawImage(b,0,0,W,H);
  const B=gx.getImageData(0,0,W,H).data, im=x.getImageData(0,0,W,H), P=im.data, lut=new Uint8ClampedArray(256);
  for(let v=0;v<256;v++) lut[v]=v<=70?0:v>=228?255:Math.round(255*Math.pow((v-70)/158,1.15));
  for(let i=0;i<P.length;i+=4) for(let ch=0;ch<3;ch++) P[i+ch]=lut[Math.min(255,Math.round(P[i+ch]*255/Math.max(B[i+ch],40)))];
  x.putImageData(im,0,0);
  // 2) Schrift vom Untergrund trennen: Untergrund wird glatt (weiß oder gleichmäßig hellgrau), Schrift satt schwarz
  const a=leinwand(W,H), ax=ctx2(a); ax.filter="blur(1.8px)"; ax.drawImage(c,0,0);
  const hw=Math.ceil(W/2), hh=Math.ceil(H/2), hc=leinwand(hw,hh), hx=ctx2(hc); hx.drawImage(a,0,0,hw,hh);
  const hd=hx.getImageData(0,0,hw,hh), HD=hd.data, L=new Uint8ClampedArray(hw*hh);
  for(let i=0;i<hw*hh;i++) L[i]=(HD[i*4]+HD[i*4+1]+HD[i*4+2])/3;
  const Mx=maxFilter(L,hw,hh,3);
  for(let i=0;i<hw*hh;i++){ const v=Mx[i]>226?255:Math.round(Mx[i]/8)*8; HD[i*4]=HD[i*4+1]=HD[i*4+2]=v; }
  hx.putImageData(hd,0,0); const tc=leinwand(W,H), tx=ctx2(tc); tx.filter="blur(1.2px)"; tx.drawImage(hc,0,0,W,H);
  const T=tx.getImageData(0,0,W,H).data, Bl=ax.getImageData(0,0,W,H).data, S2=x.getImageData(0,0,W,H), Q=S2.data;
  for(let i=0;i<Q.length;i+=4){
    const lb=(Bl[i]+Bl[i+1]+Bl[i+2])/3, ls=(Q[i]+Q[i+1]+Q[i+2])/3, t=T[i];
    const al=Math.max(0,Math.min(1,(t-Math.min(lb,ls*.6+lb*.4)-40)/55)), sat=Math.max(Q[i],Q[i+1],Q[i+2])-Math.min(Q[i],Q[i+1],Q[i+2]);
    const tf=t>=236?255:t>=140?232:t; /* helle Flächen einheitlich hellgrau wie gedruckt */
    for(let ch=0;ch<3;ch++){ const v=Q[i+ch], n=v<=40?0:v>=200?255:255*(v-40)/160; Q[i+ch]=tf*(1-al)+(sat>45?v*.85:n*.55)*al; }
  }
  x.putImageData(S2,0,0);
  // 3) Gerade richten (schief eingescannte Seiten, bis ±3°)
  const wnk=schraeglage(c); if(Math.abs(wnk)>=.3){ const r=leinwand(W,H), rx=r.getContext("2d"); rx.fillStyle="#fff"; rx.fillRect(0,0,W,H); rx.translate(W/2,H/2); rx.rotate(-wnk*Math.PI/180); rx.drawImage(c,-W/2,-H/2); return r; }
  return c;
}
function schraeglage(c){
  const k=Math.min(1,800/Math.max(c.width,c.height)), w=Math.round(c.width*k), h=Math.round(c.height*k), t=leinwand(w,h), tx=ctx2(t); tx.drawImage(c,0,0,w,h);
  const d=tx.getImageData(0,0,w,h).data, px=[], py=[];
  for(let y=0;y<h;y++) for(let i=0;i<w;i++){ const q=(y*w+i)*4; if(d[q]+d[q+1]+d[q+2]<330){ px.push(i-w/2); py.push(y-h/2); } }
  if(px.length<300) return 0;
  const guete=a=>{ const r=a*Math.PI/180, sn=Math.sin(r), co=Math.cos(r), hist=new Float64Array(h*2+4); for(let j=0;j<px.length;j++){ const yy=Math.round(py[j]*co-px[j]*sn+h); if(yy>=0&&yy<hist.length) hist[yy]++; } let s=0; for(const v of hist) s+=v*v; return s; };
  let best=0, bv=guete(0);
  for(let a=-3;a<=3.001;a+=.5){ const v=guete(a); if(v>bv){ bv=v; best=a; } }
  for(let a=best-.4;a<=best+.401;a+=.1){ const v=guete(a); if(v>bv){ bv=v; best=a; } }
  return Math.round(best*10)/10;
}
// Datei speichern / teilen (Handy: Teilen-Menü, PC: Download)
async function dateiSpeichern(blob,name){
  const dl=await window.claude?.use?.("downloads").catch(()=>null); if(dl){ await dl.save({filename:name,data:blob}); return; }
  try{ const f=new File([blob],name,{type:blob.type}); if(navigator.canShare?.({files:[f]})){ await navigator.share({files:[f],title:name}); return; } }catch(e){ if(e?.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}
// Vorschau Montagebericht / Sichtabnahme: alle Seiten untereinander im Zoom-Betrachter
function vorschauZeigen(cs,titel){
  const g=28, W=Math.max(...cs.map(c=>c.width)), H=cs.reduce((a,c)=>a+c.height,0)+g*(cs.length-1);
  const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d"); x.fillStyle="#2b3038"; x.fillRect(0,0,W,H);

function dokViewer(src, art="bild", titel="", opt={}){

    <button class="dvb" data-dv="minus" title="Kleiner">−</button><span class="dvp">100 %</span><button class="dvb" data-dv="plus" title="Größer">＋</button><button class="dvb" data-dv="fit" title="Einpassen">⤢</button><button class="dvb" data-dv="dreh" title="Drehen">⟳</button>${sauberMgl?`<button class="dvb dvs" data-dv="scan" title="Sauber (aufbereitet) / Original">✨</button>`:""}
    ${opt.datei?`<button class="dvb" data-dv="laden" title="Speichern / Teilen">⬇</button>`:art==="pdf"?`<a class="dvb" href="${esc(src)}" target="_blank" rel="noopener" title="Im Browser öffnen">↗</a>`:""}</div>
    <div class="dvstage"><div class="dvinhalt"><div class="dvlade"><span class="spin"></span> wird geladen …</div></div></div>
    <div class="dvhint">Mit zwei Fingern zoomen · doppelt tippen · ⟳ drehen${sauberMgl?" · ✨ aufbereitet / Original":""}</div>`;
  document.body.appendChild(d); document.body.style.overflow="hidden";
  const stage=d.querySelector(".dvstage"), inh=d.querySelector(".dvinhalt"), pct=d.querySelector(".dvp");
  let W=0,H=0,s=1,x=0,y=0,fit=1,einpassenGanz=true,OW=0,OH=0,dreh=0;
  const rot=document.createElement("div"); rot.className="dvrot";

  let neuMalen=()=>{};

  const zeigen=()=>{ inh.style.transform=`translate(${x}px,${y}px) scale(${s})`; pct.textContent=Math.round(s/fit*100)+" %"; };
  const begrenzen=()=>{ const vw=stage.clientWidth, vh=stage.clientHeight, cw=W*s, ch=H*s;

    rot.style.transform=r===90?`translate(${OH}px,0) rotate(90deg)`:r===180?`translate(${OW}px,${OH}px) rotate(180deg)`:r===270?`translate(0,${OW}px) rotate(270deg)`:"";
    W=r%180?OH:OW; H=r%180?OW:OH; inh.style.width=W+"px"; inh.style.height=H+"px"; einpassen(); };

    else if(a.length===1 && start && start.px!=null){ const dx=a[0].x-start.px, dy=a[0].y-start.py; if(Math.abs(dx)+Math.abs(dy)>4) bewegt=true; x=start.x+dx; y=start.y+dy; begrenzen(); zeigen(); } });

const abhBereit=o=>o.prodStatus==="abholbereit" && !o.nichtVerplant;
function phase(o){
  if(o.storniert) return "storniert";
  if(o.gemeinsam && can.sub()) return o.subAnteil?.[myId()]?.abgegebenAm?(abgerechnet(o)?"erledigt":"fertig"):terminiert(o)?"arbeit":abhBereit(o)?"abholbereit":"offen"; // gemeinsamer Auftrag: Sub ist fertig, wenn sein Anteil abgegeben ist
  if(abgerechnet(o) && !(o.berichtNachtragen && !istFertig(o))) return "erledigt"; // Vergütung da (Ausnahme: Bericht wird nachgetragen → erst unter Terminiert) (Montageabrechnung von meta) → komplett erledigt
  if(istFertig(o) || berichtVerschickt(o) || berichtAbgegeben(o)) return "fertig"; // Montagebericht geschrieben → Baustelle fertiggestellt, Vergütung steht noch aus
  if(terminiert(o)) return "arbeit";

function zuTun(){

const suchTasten=()=>{ try{ return localStorage.getItem("jdSucheTasten")==="text"?"text":"numeric"; }catch(e){ return "numeric"; } };
const suchFeld=ph=>`<div class="q-w"><input class="i" id="q" type="search" placeholder="${esc(ph)}" value="${esc(S.q)}" inputmode="${suchTasten()==="text"?"search":"numeric"}" ${suchTasten()==="text"?"":'pattern="[0-9]*"'} enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button type="button" class="q-tast" id="qTast" aria-label="Tastatur umschalten">${suchTasten()==="text"?"123":"ABC"}</button></div>`;
// Neu zeichnen, ohne das gerade benutzte Suchfeld auszutauschen – sonst springt die Handy-Tastatur zurück auf Buchstaben
function zeichnen(app,html){
  const alt=document.activeElement?.id==="q"?document.activeElement:null, altTb=alt&&[...app.children].find(c=>c.contains(alt));
  if(!altTb){ app.innerHTML=html; return; }
  const t=document.createElement("template"); t.innerHTML=html;
  const neuQ=t.content.querySelector("#q"), neuTb=neuQ&&[...t.content.children].find(c=>c.contains(neuQ));
  if(!neuTb){ app.innerHTML=html; return; }
  [...app.childNodes].forEach(c=>{ if(c!==altTb) c.remove(); });
  const vor=[], nach=[]; let hinter=false;
  [...t.content.childNodes].forEach(n=>{ if(n===neuTb){ hinter=true; return; } (hinter?nach:vor).push(n); });
  altTb.before(...vor); altTb.after(...nach);
}

function orderChips(o){
  const c=[];
  if(o.storniert){ if(landOf(o)==="lu") c.push(`<span class="chip info">🇱🇺 Luxemburg</span>`); c.push(`<span class="chip bad">❌ Storniert${o.storniert.am?" am "+new Date(o.storniert.am).toLocaleDateString("de-DE"):""}</span>`); if(o.monteure?.length) c.push(`<span class="chip">👷 ${o.monteure.map(nameOf).map(esc).join(", ")}</span>`); return c.join(""); }
  if(landOf(o)==="lu") c.push(`<span class="chip info">🇱🇺 Luxemburg</span>`);
  if(o.erstelltAm && Date.now()-o.erstelltAm<3*86400000 && (can.planen()?["offen","abholbereit"].includes(phase(o)):!istFertig(o)&&phase(o)!=="erledigt")) c.push(`<span class="chip gold">NEU</span>`);
  if(can.planen() && SERIEN().length && !serieId(o) && !istReklaAuftrag(o) && phase(o)!=="erledigt") c.push(`<span class="chip warn">Serie fehlt</span>`);
  if(o.abschluss){
    const t=o.abschluss.typ;
    c.push(t==="ok"?`<span class="chip ok">✓ Montiert</span>`:`<span class="chip warn">✓ Montiert mit Reklamation</span>`);
    if(o.berichtStatus==="pruefung"&&can.planen()) c.push(`<span class="chip warn">📥 Bericht prüfen</span>`);
    if(o.berichtStatus==="bereit"&&can.planen()) c.push(`<span class="chip warn">Bericht senden</span>`);
    if(o.berichtStatus==="pruefung"&&!can.planen()) c.push(`<span class="chip info">⏳ wartet auf Bestätigung</span>`);
    if(o.bestaetigtAm&&!can.planen()) c.push(`<span class="chip ok">✓ bestätigt</span>`);
    if(o.berichtStatus==="gesendet") c.push(`<span class="chip ok">Bericht gesendet</span>`);
    if(wartetAufAbrechnung(o)) c.push(`<span class="chip warn">⏳ Warten auf Abrechnung</span>`);
  } else if(phase(o)==="erledigt"){
    c.push(`<span class="chip ok">✓ erledigt</span>`);
  } else {
    if(running(o)) c.push(`<span class="chip info">⏱ läuft</span>`);
    if(o.terminStatus==="fest") c.push(`<span class="chip ok">Fest: ${esc(o.termin?fmtDate(o.termin):"terminiert")}</span>`);
    else c.push(`<span class="chip warn">Muss terminiert werden</span>`);
    const p=PROD[o.prodStatus||"offen"];
    if(abhBereit(o)) c.push(`<span class="chip abh">✓ Abholbereit${o.abholbereitBestaetigt?" · meta":""}</span>`);
    else if(o.prodStatus==="abholbereit" && o.nichtVerplant) c.push(`<span class="chip">↩ von Hand nach „Neu“</span>`);
    // Produktionsstand (offen / in Produktion / produziert) wird nicht mehr angezeigt – nur „Abholbereit“
    if(o.quelle==="mail-dispo"&&!o.zusage) c.push(`<span class="chip gold">📨 Anfrage von meta</span>`);
    if(o.versand) c.push(`<span class="chip ${/nicht/i.test(o.versand)?"":"ok"}">${esc(o.versand)}</span>`);
    if((o.leerfahrten||[]).length){ const l=o.leerfahrten[o.leerfahrten.length-1]; c.push(`<span class="chip warn">↩ Zuvor ${o.leerfahrten.length>1?o.leerfahrten.length+"× ":""}Leerfahrt ${leerDatum(l)}${leerKm(o)?` · ${String(leerKm(o)).replace(".",",")} km`:""}</span>`); }
    if(o.einsatz?.bereit==="nein"&&!o.einsatz?.nmb?.weiter) c.push(`<span class="chip bad">⛔ Nicht montagebereit – Freigabe offen</span>`);
    else if(o.einsatz?.fahrzeug&&!o.einsatz?.startAm&&!running(o)) c.push(`<span class="chip info">🚐 unterwegs / vor Ort</span>`);
  }
  if(o.abschluss && !o.abgerechnet) c.push(abnahmeChip(o));
  else if(o.abschluss && abnahmeFaellig(o)) c.push(abnahmeChip(o));
  const rk=offeneReklas(o.id).length; if(rk) c.push(`<span class="chip bad">${rk} Reklamation offen</span>`);
  if(o.monteure?.length) c.push(`<span class="chip">👷 ${o.monteure.map(nameOf).map(esc).join(", ")}</span>`);
  if(can.finanzen() && o.abnahmeVerguetet) c.push(`<span class="chip info">💶 Sichtabnahme vergütet ${fmtEUR(o.abnahmeVerguetet.summe)}</span>`);
  if(!S.fin[o.id] && o.abgerechnetMit) c.push(`<span class="chip ok">💶 abgerechnet mit ${esc(o.abgerechnetMit)}</span>`);
  if(can.finanzen() && S.fin[o.id]){ const f=S.fin[o.id], st=f.rechnungStatus||"offen";
    c.push(`<span class="chip info">💶 ${fmtEUR(f.summe)}</span>`);
    if(st==="offen"||st==="freigegeben") c.push(`<span class="chip warn">✏️ Rechnung schreiben</span>`);
    else if(st==="erstellt") c.push(`<span class="chip warn">Rechnung versenden</span>`);
    else if(st==="versendet") c.push(`<span class="chip">Rechnung versendet – Zahlung offen</span>`); }
  return c.join("");
}

const montagVon=d=>{ const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()); m.setDate(m.getDate()-((m.getDay()+6)%7)); return m; };
const WT=["Mo","Di","Mi","Do","Fr","Sa","So"];
function statusPills(o, imKal){
  if(o.storniert) return [["bad","storniert"]];
  if(can.sub() && (o.monteure||[]).includes(myId()) && subBerichtFehlt(o,myId())){ const q=[["bad","📝 Bericht fehlt"]]; const un=ungelesen(o.id); if(un) q.push(["msg",un]); return q; }
  if(o.gemeinsam && can.sub()){ const an=o.subAnteil?.[myId()]||{}, q=[];
    if(an.bestaetigtAm) q.push(["ok","✓ bestätigt · Rechnung schreiben"]); else if(an.abgegebenAm) q.push(["info","⏳ wartet auf Bestätigung"]);
    else { q.push(["","🤝 mit JD Brüder"]); if(!imKal&&o.termin) q.push(["",kurzDatum(o.termin)]); if(terminOffenFuerMich(o)) q.push(["warn","👍 bestätigen"]); }
    const un=ungelesen(o.id); if(un) q.push(["msg",un]); return q; }
  const p=[], chef=can.planen(), ph=phase(o);
  if(chef){ const fehlt=subsVon(o).filter(u=>subBerichtFehlt(o,u)); if(fehlt.length) p.push(["bad",`📝 Bericht fehlt: ${fehlt.map(u=>nameOf(u).split(" ")[0]).join(", ")}`]); }
  if(o.erstelltAm && Date.now()-o.erstelltAm<3*86400000 && (chef?["offen","abholbereit"].includes(ph):!istFertig(o))) p.push(["gold","NEU"]);
  if(istFertig(o) || ph==="erledigt" || ph==="fertig"){
    if(chef){
      if(o.berichtStatus==="pruefung") p.push(["warn","📥 prüfen"]);
      else if(o.berichtStatus==="bereit" && !berichtVerschickt(o) && !abgerechnet(o)) p.push(["warn","Bericht senden"]);
      else if(abgerechnet(o)) p.push(["ok","💶 abgerechnet"]);
      else if(berichtVerschickt(o)) p.push(["ok","✓ gesendet"]);
      else p.push(["ok","✓ fertig"]);
      if(can.finanzen() && S.fin[o.id]){ const st=S.fin[o.id].rechnungStatus||"offen"; if(st==="offen"||st==="freigegeben") p.push(["warn","✏️ Rechnung"]); else if(st==="erstellt") p.push(["warn","Rechnung versenden"]); }
      if(abnahmeFaellig(o)) p.push(["bad","⏰ Sichtabnahme"]);
    } else if(o.nachgetragen?.[myId()] && !o.subAnteil?.[myId()]?.abgegebenAm) p.push(["warn","🤝 Anteil eintragen"]);
    else p.push(o.bestaetigtAm?["ok",can.sub()?"✓ bestätigt · Rechnung schreiben":"✓ bestätigt"]:o.abschluss?["info","⏳ wartet auf Bestätigung"]:["ok","✓ erledigt"]);
  } else if(ph==="arbeit"){
    if(running(o)) p.push(["info","⏱ läuft"]);
    else if(o.einsatz?.bereit==="nein" && !o.einsatz?.nmb?.weiter) p.push(["bad","⛔ nicht montagebereit"]);
    else if(ueberfaellig(o)) p.push(["bad","überfällig"]);
    else if(o.einsatz?.fahrzeug && !o.einsatz?.startAm) p.push(["info","🚐 unterwegs"]);
    if(!imKal) p.push(o.termin?["",kurzDatum(o.termin)]:["warn","ohne Datum"]);
    if(chef && !(o.monteure||[]).length) p.push(["warn","👷 ohne Team"]);
    if(!chef && terminOffenFuerMich(o)) p.push(["warn","👍 bestätigen"]);
  } else if(ph==="abholbereit") p.push(["abh",o.abholbereitBestaetigt?"✓ abholbereit · meta":"✓ abholbereit"]);
  else {
    if(o.quelle==="mail-dispo" && !o.zusage) p.push(["gold","📨 Anfrage"]);
    if(o.prodStatus==="abholbereit" && o.nichtVerplant) p.push(["","↩ von Hand verschoben"]);
  }
  if(chef && o.gemeinsam) p.push(anteilOffen(o)?["warn","🤝 Abrechnung prüfen"]:["","🤝 mit Sub"]);
  const rk=offeneReklas(o.id).length; if(rk) p.push(["bad",`⚠ ${rk} Rekla`]);
  if((o.leerfahrten||[]).length && !istFertig(o)) p.push(["warn","↩ Leerfahrt"]);
  if(binBeteiligt(o)){ const un=ungelesen(o.id); if(un) p.push(["msg",un]); }
  return p;
}
// Kürzel der Eingeteilten: grün = Termin bestätigt, umrandet = noch nicht bestätigt
function avatare(o){
  const fest=o.terminStatus==="fest" && !!o.termin && !istFertig(o) && !o.storniert;
  return (o.monteure||[]).map(m=>{ const ok=terminBestaetigt(o,m);
    return `<span class="kal-av ${fest?(ok?"ok":"wartet"):""}" title="${esc(nameOf(m))}${fest?(ok?" – Termin bestätigt":" – Termin noch nicht bestätigt"):""}">${esc(initials(m))}</span>`; }).join("");
}

}
// Liste in Wochen-Kästen (wie die Tage im Kalender)
function gruppen(list){
  const groups={};
  list.forEach(o=>{ const w=planWeek(o); const k=w.kw?wkKey(w.jahr,w.kw):0; (groups[k]=groups[k]||{w,items:[]}).items.push(o); });
  const absteigend=S.filter==="erledigt"||S.filter==="fertig"||S.filter==="storniert";
  const keys=Object.keys(groups).map(Number).sort((a,b)=>absteigend?b-a:a-b);
  const nowK=wkKey(NOW.jahr,NOW.kw);
  const nvKnopf=o=>S.filter==="abholbereit"&&!S.q.trim()&&can.planen()&&phase(o)==="abholbereit"?`<button class="li-akt" data-nv="${esc(o.id)}">↩ nach „Neu“</button>`:"";
  return keys.map(k=>{ const g=groups[k];
    g.items.sort((a,b)=>String(a.nr).localeCompare(String(b.nr),"de",{numeric:true}));
    let range=""; if(k){ const m=mondayOf(g.w.jahr,g.w.kw); const f=new Date(m); f.setDate(f.getDate()+4); range=`${m.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}–${f.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}`; }
    const tag=k===nowK?"diese Woche":(k&&k<nowK&&(S.filter==="offen"||S.filter==="abholbereit")?"vergangen":"");
    return `<section class="li-gr ${k===nowK?"heute":""}"><div class="kal-kopf"><span>${k?`KW ${g.w.kw}${g.w.jahr!==NOW.jahr?"/"+g.w.jahr:""}`:"Ohne KW"}${range?` <span class="mute" style="font-weight:600">· ${range}</span>`:""}${tag?` · <span class="${tag==="vergangen"?"rot":"jetzt"}">${tag}</span>`:""}</span><span>${g.items.length}</span></div>
      <div class="li-grid">${g.items.map(o=>`<div class="li-w">${liKarte(o)}${nvKnopf(o)}</div>`).join("")}</div></section>`;
  }).join("");
}
function kalender(list){

  const heute=tagKey(new Date());
  const mitTag={}, ohne=[];

    <button class="btn sm" data-kal="zurueck" aria-label="Zurück">‹</button>`;

  }
  h+=`<button class="btn sm" data-kal="vor" aria-label="Weiter">›</button></div>
   <div class="row between" style="margin-bottom:8px;gap:8px"><div class="seg" id="kalSeg" style="width:auto"><button data-kalv="woche" class="${k.ansicht!=="monat"?"on":""}">Woche</button><button data-kalv="monat" class="${k.ansicht==="monat"?"on":""}">Monat</button></div>
   <button class="btn sm ghost" data-kal="heute">Heute</button></div>`;
  if(k.ansicht==="monat"){
    const m0=new Date(start.getFullYear(),start.getMonth(),1), ab=montagVon(m0);
    h+=`<div class="kal-monat">${WT.map(t=>`<div class="kal-wt">${t}</div>`).join("")}`;
    const tageImMonat=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate(), felder=Math.ceil(((m0.getDay()+6)%7+tageImMonat)/7)*7;
    for(let i=0;i<felder;i++){ const d=new Date(ab); d.setDate(ab.getDate()+i);
      const t=tagKey(d), a=mitTag[t]||[];
      h+=`<div class="kal-zelle ${d.getMonth()!==m0.getMonth()?"aus":""} ${t===heute?"heute":""}" data-kal-tag="${d.getTime()}"><div class="kal-zn">${d.getDate()}</div>
        ${a.length?`<span class="kal-n ${a.every(istFertig)?"fertig":""}">${a.length}</span>`:""}
        ${a.slice(0,3).map(o=>`<span class="kal-chip ${istFertig(o)?"fertig":""}">${esc(o.nr)}</span>`).join("")}${a.length>3?`<span class="kal-mehr">+${a.length-3}</span>`:""}</div>`; }
    h+=`</div><div class="small mute" style="margin-top:6px">Tag antippen → Woche mit allen Aufträgen öffnen.</div>`;
  } else {
    const tage=[]; for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(start.getDate()+i); tage.push(d); }
    const zeig=tage.filter((d,i)=>i<5 || (mitTag[tagKey(d)]||[]).length); // Sa/So nur, wenn dort etwas geplant ist
    h+=`<div class="kal-woche" style="--tage:${zeig.length}">${zeig.map(d=>{ const t=tagKey(d), a=mitTag[t]||[];
      return `<div class="kal-tag ${t===heute?"heute":""} ${a.length?"":"frei"}"><div class="kal-kopf"><span>${WT[(d.getDay()+6)%7]} ${d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}${t===heute?" · heute":""}</span>${a.length?`<span>${a.length}</span>`:""}</div>
        ${a.map(o=>liKarte(o,true)).join("")||`<div class="kal-leer">frei</div>`}</div>`; }).join("")}</div>`;
    const imBlick=zeig.flatMap(d=>mitTag[tagKey(d)]||[]);
    if(!imBlick.length){ const bis=new Date(start); bis.setDate(bis.getDate()+6);
      const nx=list.filter(o=>o.termin&&!istFertig(o)&&tagKey(new Date(o.termin))>tagKey(bis)).sort((a,b)=>a.termin-b.termin)[0];
      if(nx) h+=`<button class="btn block ghost" style="margin-top:8px" data-kal-tag="${new Date(nx.termin).getTime()}">Nächster Termin: ${esc(langDatum(nx.termin))} · ${esc(nx.nr)} ›</button>`; }

  if(!list.length) h+=`<div class="empty">Keine terminierten Aufträge.</div>`;

function viewListe(){

  let list=Object.values(S.orders).filter(sichtbar);
  // Mitarbeiter/Subunternehmer: keine Aufträge aus „Nicht verplant“ (auch nicht in der Suche)
  if(!can.planen()) list=list.filter(o=>phase(o)!=="offen" && (phase(o)!=="storniert" || (o.monteure||[]).includes(myId())));
  const q=S.q.trim().toLowerCase(), suche=!!q;
  if(q) list=list.filter(o=>[o.nr,o.bauvorhaben,o.plzOrt,o.adresse,o.vorgang].join(" ").toLowerCase().includes(q));
  if(S.nurMeine) list=list.filter(o=>(o.monteure||[]).includes(myId()));
  const imBereich=o=>suche || (spez ? !o.storniert && spez.f(o) : phase(o)===S.filter);
  const land=S.land||"alle";
  const proLand={alle:0,de:0,lu:0}; list.filter(imBereich).forEach(o=>{ proLand.alle++; proLand[landOf(o)]++; });
  if(land!=="alle") list=list.filter(o=>landOf(o)===land);
  const anzahl={}; list.forEach(o=>{ const p=phase(o); anzahl[p]=(anzahl[p]||0)+1; });
  list=list.filter(imBereich);
  const tun=zuTun();
  let h=`${fahrtLeiste()}<div class="toolbar">${suchFeld("Suchen: Nummer, Bauvorhaben, Ort")}${can.planen()?`<button class="btn" id="newOrder" title="Auftrag von Hand anlegen" aria-label="Auftrag von Hand anlegen" style="min-width:48px;font-size:22px;padding:0 10px">＋</button>`:""}</div>${umsatzStreifen()}
  ${tun.length?`<div class="tun" aria-label="Zu tun">${tun.map(([k,n])=>`<button class="tun-p ${SPEZIAL[k].cls} ${S.filter===k?"on":""}" data-f="${k}">${SPEZIAL[k].p(n)}${badge(n)}</button>`).join("")}</div>`:""}
  <div class="seg phasen" id="flt">${meinePhasen().map(([k,l])=>`<button data-f="${k}" class="${S.filter===k?"on":""}">${l}<span class="n">${anzahl[k]||0}</span></button>`).join("")}</div>
  <div class="fzeile">${["alle","de","lu"].map(k=>`<button class="fp ${land===k?"on":""}" data-land="${k}">${k==="alle"?"Alle":LAENDER[k][0]} <span class="n">${proLand[k]}</span></button>`).join("")}
    ${can.sub()?"":`<button class="fp ${S.nurMeine?"on":""}" id="nurMeine">👷 Meine</button>`}
    ${can.planen()||anzahl.storniert?`<button class="fp ${S.filter==="storniert"?"on":""}" data-f="storniert" style="margin-left:auto">Storniert <span class="n">${anzahl.storniert||0}</span></button>`:""}</div>`;
  if(spez && !suche) h+=`<div class="spez-kopf"><b>${esc(SPEZIAL[S.filter].t)}</b><span class="mute">${list.length}</span><button class="btn sm ghost" data-f="zurueck">✕</button></div>`;
  if(suche) h+=`<div class="small mute" style="margin:10px 2px 0">Suche in allen Bereichen · ${list.length} Treffer</div>`;
  if(S.filter==="storniert" && !suche) h+=`<div class="small mute" style="margin:10px 2px 0">Aufträge, die meta wieder storniert hat.</div>`;
  if(S.filter==="fertig" && !suche && !spez) h+=`<div class="small mute" style="margin:10px 2px 0">Baustellen mit geschriebenem Montagebericht – die Vergütung von meta steht noch aus.</div>`;
  if(S.filter==="erledigt" && !suche && !spez) h+=`<div class="small mute" style="margin:10px 2px 0">Komplett fertig – die Vergütung (Montageabrechnung von meta) ist da.</div>`;
  if(!Object.keys(S.orders).length){
    h+=`<div class="empty">Noch keine Aufträge.<br>${can.mails()?"Tippe oben auf „Mails abrufen“, um die Aufträge von meta zu holen.":"Sobald der Chef die Mails abruft, erscheinen sie hier."}</div>`;
    return h;
  }
  if(S.filter==="arbeit" && !suche && !spez){
    const tests=list.filter(istTest);
    if(tests.length) h+=`<section class="li-gr" style="margin-top:12px"><div class="kal-kopf"><span>🧪 Testaufträge</span><span>${tests.length}</span></div><div class="li-grid">${tests.map(o=>`<div class="li-w">${liKarte(o)}</div>`).join("")}</div></section>`;
    h+=kalender(list.filter(o=>!istTest(o))); return h; } // Terminiert: als Kalender
  if(!list.length) h+=`<div class="empty">${spez?"Alles erledigt 👍":"Keine Aufträge in dieser Ansicht."}</div>`;
  h+=`<div style="margin-top:10px">${gruppen(list)}</div>`;
  return h;
