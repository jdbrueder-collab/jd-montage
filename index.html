<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JD Brüder Montage</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e4e7ec;
  --brand:#1d3a5f;--brand2:#2d5a8e;--accent:#e8a33d;
  --ok:#1f8a4c;--okbg:#e6f4ec;--warn:#b26b00;--warnbg:#fdf1dc;--bad:#c4302b;--badbg:#fbe9e8;--info:#2758a8;--infobg:#e7eefb;--grey:#5b6472;--greybg:#eef0f3;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .logo{font-weight:800;letter-spacing:.3px;font-size:17px}
header.top .logo small{display:block;font-weight:500;font-size:11.5px;opacity:.75;letter-spacing:0}
header.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--greybg);color:var(--grey)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}.chip.dark{background:rgba(255,255,255,.16);color:#fff}.chip.gold{background:#fff4dc;color:#8a5a00}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;max-width:150px;text-align:center;padding:8px 2px 9px;font-size:11.5px;color:var(--mute);text-decoration:none;font-weight:600}
nav.bottom a .ic{display:block;font-size:20px;line-height:1.2}
nav.bottom a.on{color:var(--brand)}
nav.bottom a .dot{display:inline-block;min-width:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;margin-left:2px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:12.5px}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:650;cursor:pointer;background:var(--greybg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;min-height:44px}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.warn{background:var(--accent);color:#2b1a00}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:block;font-size:12px;font-weight:650;color:var(--mute);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;min-height:44px}
textarea.i{min-height:84px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--brand2);outline-offset:-1px;border-color:transparent}
.seg{display:flex;background:var(--greybg);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:650;font-size:13px;cursor:pointer;color:var(--grey);min-height:38px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input{flex:1}
.kw{margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px}
.kw b{font-size:16px}
.kw .now{color:var(--accent);font-weight:700;font-size:12px}
.order{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.order:active{background:#fafafa}
.order .nr{font-weight:800;font-size:17px;letter-spacing:.2px}
.order .bv{font-weight:600}
.order .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.order.done{opacity:.72}
.order.hl{border-color:var(--accent);box-shadow:0 0 0 2px #f6dcae}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
@media(max-width:420px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.big{font-size:22px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;letter-spacing:.5px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.thumbs .t{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--greybg);border:1px solid var(--line);cursor:zoom-in}
.thumbs .t img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .t .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:7px;width:24px;height:24px;cursor:pointer;font-size:13px}
.thumbs .add{display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px dashed var(--line);border-radius:9px;aspect-ratio:1;color:var(--mute);font-size:12px;cursor:pointer;text-align:center;padding:4px}
.thumbs .add span{font-size:22px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--brand2);font-weight:650;margin-bottom:10px;cursor:pointer;background:none;border:0;padding:6px 0}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--warnbg);color:#6b4100}.banner.bad{background:var(--badbg);color:#7a1d19}.banner.info{background:var(--infobg);color:#1b3d78}.banner.ok{background:var(--okbg);color:#14532d}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
table.pos{width:100%;border-collapse:collapse;font-size:13.5px}
table.pos td,table.pos th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.pos td:first-child,table.pos th:first-child{text-align:left}
table.pos tfoot td{font-weight:800;border-bottom:0}
.steps{display:flex;gap:4px;margin:6px 0 12px}
.steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--ok)}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.modalbg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modalbg{align-items:center}.modal{border-radius:18px}}
.modal h2{margin:0 0 6px;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14171c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:92vh}
canvas.sig{width:100%;height:200px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum .card{margin:0;text-align:center;padding:12px 6px}
.sum .card b{display:block;font-size:19px}
.sum .card span{font-size:11.5px;color:var(--mute)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.log{font-size:12.5px;color:var(--mute);max-height:180px;overflow:auto;background:var(--greybg);border-radius:9px;padding:8px;margin-top:8px;white-space:pre-wrap}
.hide{display:none!important}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JD Montage">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="claude-shim.js"></script>
</head>
<body>
<header class="top">
  <div class="logo">JD Brüder<small>Montage</small></div>
  <div class="sp"></div>
  <span id="roleChip" class="chip dark"></span>
  <button id="syncBtn" class="btn sm hide" style="background:rgba(255,255,255,.16);color:#fff">✉︎ Mails abrufen</button>
</header>
<main id="app"><div class="empty"><span class="spin"></span><br><br>App wird geladen …</div></main>
<nav class="bottom" id="nav"></nav>
<div id="modalRoot"></div>

<script>
"use strict";
/* ============ Grundlagen ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtEUR = n => (Number(n)||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}) : "";
const fmtDT = ts => ts ? new Date(ts).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
const fmtDur = ms => { ms=Math.max(0,ms|0); const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000); return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; };
const fmtHM = ms => { const m=Math.round(ms/60000); return `${Math.floor(m/60)} Std ${m%60} Min`; };
const idOf = nr => String(nr).trim().replace(/\//g,"-").replace(/[^A-Za-z0-9_\-.~:@+]/g,"");
function isoWeek(d){ d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day); const y=d.getUTCFullYear(); const w=Math.ceil(((d-Date.UTC(y,0,1))/86400000+1)/7); return {kw:w,jahr:y}; }
const NOW = isoWeek(new Date());
const wkKey = (j,k) => (j||0)*100+(k||0);
function mondayOf(jahr,kw){ const s=new Date(Date.UTC(jahr,0,4)); const d=(s.getUTCDay()||7); s.setUTCDate(s.getUTCDate()-d+1+(kw-1)*7); return new Date(s.getUTCFullYear(),s.getUTCMonth(),s.getUTCDate()); }

const URSACHEN = {
  selbst:"Selbstverschulden",
  baustelle:"Baustelle nicht montagefertig",
  teile:"Fehlerhafte/fehlende Teile vom Hersteller",
  sonst:"Sonstiges"
};
const PROD = {offen:["Produktion offen",""], in_produktion:["In Produktion","warn"], produziert:["Produziert","info"], abholbereit:["Abholbereit","ok"]};
const RECHNUNG = {offen:["Freigabe nötig","warn"], freigegeben:["Freigegeben – in Lexware anlegen","info"], erstellt:["Erstellt – Versand freigeben","info"], versendet:["Versendet","ok"], bezahlt:["Bezahlt","ok"]};
const ROLLEN = {chef:"Chef", monteur:"Monteur", sub:"Subunternehmer", hersteller:"meta (Hersteller)"};

const S = {
  db:null,user:null,mcp:null,sample:null,assets:null,
  me:null,isOwner:false,role:"monteur",
  orders:{},reklas:{},fin:{},settings:{},roles:{},
  loaded:false,loadErr:"",
  filter:"offen",q:"",wochenNurMeine:null,
  fotos:{},fotoUnsub:null,fotoFor:null,
  profiles:{},pendingRender:false,anfragen:{},meineAnfrage:null,rolesLoaded:false,fahrzeuge:{},fahrten:{},fzSel:null,lohnOpen:{},
  lohnPos:[],preise:null,lohn:{},lohnFor:{}
};

function toast(msg,ms=2600){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }

/* ============ Modals ============ */
function modal(html, onMount, onClose){
  const root=$("#modalRoot");
  const bg=document.createElement("div"); bg.className="modalbg";
  bg.innerHTML=`<div class="modal">${html}</div>`;
  root.appendChild(bg);
  const close=()=>{ if(!bg.isConnected) return; bg.remove(); try{ onClose&&onClose(); }catch(e){} };
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  onMount && onMount(bg.firstElementChild, close);
  return close;
}
function confirmBox(title, text, okLabel="Ja", cls="pri"){
  return new Promise(res=>{
    modal(`<h2>${esc(title)}</h2><p class="mute">${text}</p><div class="grid2" style="margin-top:14px"><button class="btn" data-no>Abbrechen</button><button class="btn ${cls}" data-yes>${esc(okLabel)}</button></div>`,(m,close)=>{
      m.querySelector("[data-no]").onclick=()=>{close();res(false)};
      m.querySelector("[data-yes]").onclick=()=>{close();res(true)};
    });
  });
}
function lightbox(src){ const d=document.createElement("div"); d.className="lightbox"; d.innerHTML=`<img src="${esc(src)}" alt="">`; d.onclick=()=>d.remove(); document.body.appendChild(d); }

/* ============ Rollen ============ */
const can = {
  finanzen:()=>S.isOwner,
  planen:()=>S.isOwner||S.role==="chef",
  einsatz:()=>S.isOwner||S.role==="chef"||S.role==="monteur"||S.role==="sub",
  sub:()=>!S.isOwner&&S.role==="sub",
  fahrten:()=>S.role!=="hersteller"&&S.role!=="pending",
  preise:()=>S.isOwner||S.role==="chef",
  produktion:()=>S.isOwner||S.role==="chef"||S.role==="hersteller",
  reklaErledigen:()=>S.isOwner||S.role==="chef"||S.role==="hersteller",
  mails:()=>S.isOwner && !!S.mcp,
  setup:()=>S.isOwner||S.role==="chef"
};
function myId(){ return S.me?.id || null; }
async function loadProfiles(ids){
  if(!S.user) return;
  const need=[...new Set(ids.filter(i=>i && !S.profiles[i]))];
  if(!need.length) return;
  try{ const ps=await S.user.profiles(need); Object.assign(S.profiles, ps||{}); scheduleRender(); }catch(e){}
}
function nameOf(id){ if(!id) return "–"; if(id===myId()) return "Ich"; const f=S.rolesInfo?.[id]?.firma; if(f) return f; const p=S.profiles[id]; return (p&&p.name)||"Jemand"; }
function initials(id){ const n=nameOf(id); return n==="Ich"?(S.me?.name||"I").slice(0,1):n.split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase(); }

/* ============ Datenzugriff ============ */
const writeQ = {};
function upd(path, patch){
  // eine Schreiboperation pro Dokument nacheinander
  const prev = writeQ[path] || Promise.resolve();
  const p = prev.then(()=>S.db.doc(path).update({...patch, geaendertAm:Date.now()})).catch(e=>{ console.error(e); toast("Speichern fehlgeschlagen: "+(e.message||e.code)); throw e; });
  writeQ[path]=p.catch(()=>{});
  return p;
}
function setDoc(path, data){
  const prev = writeQ[path] || Promise.resolve();
  const p = prev.then(()=>S.db.doc(path).set(data)).catch(e=>{ console.error(e); toast("Speichern fehlgeschlagen: "+(e.message||e.code)); throw e; });
  writeQ[path]=p.catch(()=>{});
  return p;
}
const orderPath = id => "auftraege/"+id;

function adresseOf(o){ return o.adresse || [o.bauvorhaben, o.plzOrt].filter(Boolean).join(", "); }
function planWeek(o){ if(o.termin){ const w=isoWeek(new Date(o.termin)); return w; } return {kw:o.kw, jahr:o.jahr}; }
function totalMs(o){ return (o.zeiten||[]).reduce((s,z)=>s+((z.e||Date.now())-z.s),0); }
function running(o){ const z=(o.zeiten||[]); return z.length && !z[z.length-1].e; }
function offeneReklas(id){ return Object.values(S.reklas).filter(r=>r.auftragId===id && r.offen); }
function istFertig(o){ return !!o.abschluss; }

/* ============ Boot ============ */
async function boot(){
  window.addEventListener("hashchange", ()=>render(true));
  document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(S.pendingRender && !editing()) { S.pendingRender=false; render(); } },50); });
  setInterval(tick, 1000);
  const claude = window.claude;
  if(!claude || !claude.use){ S.loadErr="App konnte nicht starten. Bitte Seite neu laden."; render(); return; }
  const [db,user,mcp,sample,assets] = await Promise.all(["db","user","mcp","sample","assets"].map(n=>claude.use(n).catch(()=>null)));
  Object.assign(S,{db,user,mcp,sample,assets});
  if(!db){ S.loadErr="Daten sind gerade nicht erreichbar. Bitte neu anmelden."; render(); return; }
  if(user){
    try{ S.isOwner = !!(await user.isOwner()); }catch(e){}
    try{ S.me = await user.me(); }catch(e){}
  }
  const timer=setTimeout(()=>{ if(!S.loaded){ S.loadErr="Daten konnten noch nicht geladen werden – bitte Internet prüfen."; render(); } },10000);
  const err = e => { clearTimeout(timer); S.loadErr = e.code==="revoked" ? "Kein Zugriff mehr auf die Daten." : "Datenverbindung unterbrochen ("+e.code+"). Seite neu öffnen."; render(); };
  db.collection("auftraege").onSnapshot(snap=>{
    clearTimeout(timer); S.loaded=true; S.loadErr="";
    const o={}; snap.docs.forEach(d=>o[d.id]={id:d.id,...d.data()}); S.orders=o;
    loadProfiles(Object.values(o).flatMap(x=>[...(x.monteure||[]),x.abschluss?.by].filter(Boolean)));
    scheduleRender();
  }, err);
  db.collection("reklamationen").onSnapshot(snap=>{ const r={}; snap.docs.forEach(d=>r[d.id]={id:d.id,...d.data()}); S.reklas=r; loadProfiles(Object.values(r).map(x=>x.von)); scheduleRender(); }, ()=>{});
  db.doc("einstellungen/allgemein").onSnapshot(d=>{ S.settings=d.exists?d.data():{}; maybeStoreOwner(); scheduleRender(); }, ()=>{});
  db.doc("einstellungen/rollen").onSnapshot(d=>{
    S.roles=(d.exists?d.data().map:null)||{}; S.rolesInfo=(d.exists?d.data().info:null)||{};
    S.role = S.isOwner ? "chef" : (S.roles[myId()] || "pending"); S.rolesLoaded=true;
    loadProfiles(Object.keys(S.roles)); scheduleRender();
  }, ()=>{});
  if(S.isOwner) db.collection("anfragen").onSnapshot(snap=>{ const a={}; snap.docs.forEach(d=>a[d.id]={id:d.id,...d.data()}); S.anfragen=a; loadProfiles(Object.keys(a)); scheduleRender(); },()=>{});
  else if(myId()) db.doc("anfragen/"+myId()).onSnapshot(d=>{ S.meineAnfrage=d.exists?d.data():null; scheduleRender(); },()=>{});
  db.collection("fahrzeuge").onSnapshot(snap=>{ const a={}; snap.docs.forEach(d=>a[d.id]={id:d.id,...d.data()}); S.fahrzeuge=a; scheduleRender(); },()=>{});
  db.collection("fahrten").onSnapshot(snap=>{ const a={}; snap.docs.forEach(d=>a[d.id]={id:d.id,...d.data()}); S.fahrten=a; loadProfiles(Object.values(a).map(x=>x.fahrer)); scheduleRender(); },()=>{});
  db.doc("einstellungen/lohnpositionen").onSnapshot(d=>{ S.lohnPos=(d.exists?d.data().items:null)||[]; scheduleRender(); },()=>{});
  db.collection("lohnberichte").onSnapshot(snap=>{ const l={}; snap.docs.forEach(d=>l[d.id]={id:d.id,...d.data()}); S.lohn=l; loadProfiles(Object.values(l).map(x=>x.uid)); scheduleRender(); },()=>{});
  if(S.isOwner) db.doc("lohn/preise").onSnapshot(d=>{ S.preise=d.exists?d.data():null; scheduleRender(); },()=>{});
  else if(myId()) db.doc("lohnsicht/"+myId()).onSnapshot(d=>{ S.preise=d.exists?d.data():null; scheduleRender(); },()=>{});
  if(S.isOwner){
    db.collection("finanzen").onSnapshot(snap=>{ const f={}; snap.docs.forEach(d=>f[d.id]={id:d.id,...d.data()}); S.fin=f; scheduleRender(); }, ()=>{});
  }
  render(true);
}
let ownerStored=false;
async function maybeStoreOwner(){
  if(!S.isOwner||ownerStored||!myId()) return;
  ownerStored=true;
  if(S.settings.ownerId!==myId()){
    try{ await setDoc("einstellungen/allgemein",{...S.settings, ownerId:myId()}); }catch(e){}
  }
}
function editing(){ const a=document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.closest("#app"); }
let rq=false;
function scheduleRender(){ if(editing()){ S.pendingRender=true; return; } if(rq) return; rq=true; requestAnimationFrame(()=>{ rq=false; render(); }); }

function tick(){
  document.querySelectorAll("[data-timer]").forEach(el=>{ const o=S.orders[el.dataset.timer]; if(o) el.textContent=fmtDur(totalMs(o)); });
}

/* ============ Rendering ============ */
function route(){ const h=location.hash.replace(/^#/,""); if(h.startsWith("a-")) return {v:"detail",id:h.slice(2)}; return {v:h||"auftraege"}; }
function go(h){ if(location.hash==="#"+h) render(true); else location.hash=h; }

function renderNav(){
  const r=route().v;
  const offR=Object.values(S.reklas).filter(x=>x.offen).length;
  if(S.role==="pending"){ $("#nav").innerHTML=""; $("#roleChip").textContent=""; $("#syncBtn").classList.add("hide"); return; }
  const meineR=can.sub()?Object.values(S.reklas).filter(x=>x.offen&&sichtbar(S.orders[x.auftragId]||{})).length:offR;
  const items=[["auftraege","📋","Aufträge"],["woche","🗓️","Woche"]];
  if(can.fahrten()) items.push(["fahrten","🚗","Fahrten"]);
  items.push(["rekla","⚠️","Reklam.",meineR]);
  if(can.finanzen()) items.push(["geld","€","Abrechnung", Object.values(S.fin).filter(f=>f.rechnungStatus==="offen").length]);
  if(can.setup()) items.push(["setup","⚙️","Setup",S.isOwner?Object.keys(S.anfragen).length:0]);
  $("#nav").innerHTML=items.map(([h,ic,l,n])=>`<a href="#${h}" class="${(r===h||(r==="detail"&&h==="auftraege"))?"on":""}"><span class="ic">${ic}</span>${l}${n?`<span class="dot">${n}</span>`:""}</a>`).join("");
  $("#roleChip").textContent = S.isOwner ? "Chef · Admin" : (ROLLEN[S.role]||"");
  $("#syncBtn").classList.toggle("hide", !can.mails());
}

function render(scrollTop){
  renderNav();
  const app=$("#app");
  if(S.loadErr && !S.loaded){ app.innerHTML=`<div class="empty">${esc(S.loadErr)}</div>`; return; }
  if(!S.loaded){ app.innerHTML=`<div class="empty"><span class="spin"></span><br><br>Aufträge werden geladen …</div>`; return; }
  const r=route();
  if(r.v!=="detail" && S.fotoUnsub){ S.fotoUnsub(); S.fotoUnsub=null; S.fotoFor=null; }
  let html="";
  if(S.loadErr) html+=`<div class="banner bad">${esc(S.loadErr)}</div>`;
  if(S.role==="pending"){ app.innerHTML=S.rolesLoaded?viewPending():`<div class="empty"><span class="spin"></span></div>`; bindPending(); return; }
  if(r.v==="detail") html+=viewDetail(r.id);
  else if(r.v==="fahrten" && can.fahrten()) html+=viewFahrten();
  else if(r.v==="woche") html+=viewWoche();
  else if(r.v==="rekla") html+=viewRekla();
  else if(r.v==="geld" && can.finanzen()) html+=viewGeld();
  else if(r.v==="setup" && can.setup()) html+=viewSetup();
  else html+=viewListe();
  app.innerHTML=html;
  bind(r);
  if(scrollTop) window.scrollTo(0,0);
}

  return `<div class="card" style="margin-top:20px"><h2 style="margin:0 0 6px">Willkommen bei JD Brüder Montage</h2>
   <p class="mute small">Melde dich an. JD Brüder prüft deine Anmeldung und schaltet dich frei.</p>
   <label class="f">Ich bin</label><select class="i" id="pw"><option value="sub">Subunternehmer</option><option value="monteur">Mitarbeiter von JD Brüder</option><option value="hersteller">meta Trennwandanlagen</option></select>

/* ---------- Liste ---------- */
function orderChips(o){
  const c=[];
  if(o.erstelltAm && Date.now()-o.erstelltAm<3*86400000 && !istFertig(o)) c.push(`<span class="chip gold">NEU</span>`);
  if(o.abschluss){
    const t=o.abschluss.typ;
    c.push(t==="ok"?`<span class="chip ok">✓ Montiert</span>`:`<span class="chip warn">✓ Montiert mit Reklamation</span>`);
    if(o.berichtStatus==="pruefung") c.push(`<span class="chip warn">📥 Sub-Bericht prüfen</span>`);
    if(o.berichtStatus==="bereit"&&!can.sub()) c.push(`<span class="chip warn">Bericht senden</span>`);
    if(o.berichtStatus==="gesendet") c.push(`<span class="chip ok">Bericht gesendet</span>`);
  } else {
    if(running(o)) c.push(`<span class="chip info">⏱ läuft</span>`);
    if(o.terminStatus==="fest") c.push(`<span class="chip ok">Fest: ${esc(o.termin?fmtDate(o.termin):"terminiert")}</span>`);
    else c.push(`<span class="chip warn">Muss terminiert werden</span>`);
    const p=PROD[o.prodStatus||"offen"]; if(o.prodStatus && o.prodStatus!=="offen") c.push(`<span class="chip ${p[1]}">${p[0]}</span>`);
    if(o.versand) c.push(`<span class="chip ${/nicht/i.test(o.versand)?"":"ok"}">${esc(o.versand)}</span>`);
    if((o.leerfahrten||[]).length) c.push(`<span class="chip bad">${o.leerfahrten.length}× Leerfahrt</span>`);
  }
  if(o.abschluss && !o.abgerechnet) c.push(abnahmeChip(o));
  else if(o.abschluss && abnahmeFaellig(o)) c.push(abnahmeChip(o));
  const rk=offeneReklas(o.id).length; if(rk) c.push(`<span class="chip bad">${rk} Reklamation offen</span>`);
  if(o.monteure?.length) c.push(`<span class="chip">👷 ${o.monteure.map(nameOf).map(esc).join(", ")}</span>`);
  if(can.finanzen() && S.fin[o.id]) c.push(`<span class="chip info">${fmtEUR(S.fin[o.id].summe)}</span>`);
  return c.join("");
}
function orderCard(o){
  const hl = !istFertig(o) && o.terminStatus!=="fest" && (o.prodStatus==="abholbereit"||o.prodStatus==="produziert");
  return `<a class="order ${istFertig(o)?"done":""} ${hl?"hl":""}" href="#a-${esc(o.id)}">
    <div class="row between"><span class="nr">${esc(o.nr)}</span><span class="small mute">${o.kabinen?esc(o.kabinen)+" Kabinen":""}</span></div>
    <div class="bv">${esc(o.bauvorhaben||"Bauvorhaben unbekannt")}</div>
    <div class="small mute">${esc(o.plzOrt||o.adresse||"")}</div>
    ${hl?`<div class="small" style="color:#8a5a00;font-weight:650;margin-top:4px">→ Ware ist fertig – kann terminiert werden</div>`:""}
    <div class="chips">${orderChips(o)}</div></a>`;
}
function sichtbar(o){
  if(can.sub()) return (o.monteure||[]).includes(myId());
  return true;
}
function viewListe(){
  let list=Object.values(S.orders).filter(sichtbar);
  const q=S.q.trim().toLowerCase();
  if(q) list=list.filter(o=>[o.nr,o.bauvorhaben,o.plzOrt,o.adresse,o.vorgang].join(" ").toLowerCase().includes(q));
  if(S.filter==="offen") list=list.filter(o=>!istFertig(o)||offeneReklas(o.id).length||o.berichtStatus==="bereit"||o.berichtStatus==="pruefung"||abnahmeFaellig(o));
  if(S.filter==="fertig") list=list.filter(istFertig);
  if(S.filter==="meine") list=list.filter(o=>(o.monteure||[]).includes(myId()));
  if(S.filter==="pruefung") list=list.filter(o=>o.berichtStatus==="pruefung");
  if(S.filter==="abnahme") list=list.filter(o=>istFertig(o)&&abnahmeStatus(o)!=="ok"&&abnahmeStatus(o)!=="verzicht");
  const groups={};
  list.forEach(o=>{ const w=planWeek(o); const k=w.kw?wkKey(w.jahr,w.kw):0; (groups[k]=groups[k]||{w,items:[]}).items.push(o); });
  const keys=Object.keys(groups).map(Number).sort((a,b)=>S.filter==="fertig"?b-a:a-b);
  let h=`<div class="toolbar"><input class="i" id="q" placeholder="Nummer, Bauvorhaben, Ort suchen …" value="${esc(S.q)}"></div>
  <div class="seg" id="flt">${[["offen","Offen"],["meine","Meine"],["fertig","Erledigt"],["alle","Alle"]].map(([k,l])=>`<button data-f="${k}" class="${S.filter===k?"on":""}">${l}</button>`).join("")}</div>`;
  if(can.planen()){
    h+=`<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="newOrder">＋ Auftrag von Hand anlegen</button></div>`;
  }
  if(!Object.keys(S.orders).length){
    h+=`<div class="empty">Noch keine Aufträge.<br>${can.mails()?"Tippe oben auf „Mails abrufen“, um die Aufträge von meta zu holen.":"Sobald der Chef die Mails abruft, erscheinen sie hier."}</div>`;
    return h;
  }
  const pruef=Object.values(S.orders).filter(o=>o.berichtStatus==="pruefung");
  if(can.planen() && pruef.length && S.filter!=="pruefung") h+=`<div class="banner warn" style="margin-top:10px;cursor:pointer" id="pruefBanner">📥 <b>${pruef.length} Bericht${pruef.length>1?"e":""} von Subunternehmern</b> zu prüfen. <u>Anzeigen</u></div>`;
  if(S.filter==="pruefung") h+=`<div class="banner warn" style="margin-top:10px">Berichte von Subunternehmern zur Prüfung · <a href="#" id="abnBack">alle anzeigen</a></div>`;
  const faellig=Object.values(S.orders).filter(o=>sichtbar(o)&&abnahmeFaellig(o));
  if(can.planen() && faellig.length && S.filter!=="abnahme") h+=`<div class="banner bad" style="margin-top:10px;cursor:pointer" id="abnBanner">⏰ <b>${faellig.length} Sichtabnahme${faellig.length>1?"n":""}</b> seit über einer Woche offen – Kunden informieren. <u>Anzeigen</u></div>`;
  if(S.filter==="abnahme") h+=`<div class="banner warn" style="margin-top:10px">Aufträge mit offener Sichtabnahme · <a href="#" id="abnBack">alle anzeigen</a></div>`;
  if(!list.length) h+=`<div class="empty">Keine Aufträge in dieser Ansicht.</div>`;
  const nowK=wkKey(NOW.jahr,NOW.kw);
  keys.forEach(k=>{
    const g=groups[k]; g.items.sort((a,b)=>String(a.nr).localeCompare(String(b.nr),"de",{numeric:true}));
    const label = k? `KW ${g.w.kw}/${g.w.jahr}` : "Ohne KW";
    const tag = k===nowK?`<span class="now">diese Woche</span>`:(k && k<nowK && S.filter!=="fertig"?`<span class="now" style="color:var(--bad)">vergangen</span>`:"");
    let range=""; if(k){ const m=mondayOf(g.w.jahr,g.w.kw); const f=new Date(m); f.setDate(f.getDate()+4); range=`${m.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}–${f.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}`; }
    h+=`<div class="kw"><b>${label}</b><span class="small mute">${range} · ${g.items.length} Auftr.</span>${tag}</div>`;
    h+=g.items.map(orderCard).join("");
  });
  return h;
}

const nn = v => { const x=parseFloat(String(v??"").replace(",",".")); return isNaN(x)?0:x; };
const r2 = x => Math.round(x*100)/100;
function lohnDocId(oid,uid){ return oid+"__"+uid; }
function preisFuer(uid,P=S.preise){ if(!P) return null; const lid=P.zuordnung?.[uid]; return (lid&&P.listen?.[lid])||P; }
function calcLohn(d,P){
  if(!P||!d) return null;
  if(P===S.preise && d.uid) P=preisFuer(d.uid);
  const lines=[]; const pr=P.preise||{};
  S.lohnPos.forEach(p=>{ const q=nn(d.mengen?.[p.k]); if(q) lines.push({label:p.label,menge:q,ep:nn(pr[p.k]),gp:r2(q*nn(pr[p.k]))}); });
  const pers=nn(d.personen)||1;
  const et=r2(nn(P.stockSatz)*nn(d.stockwerke)*nn(d.etagenAnzahl)/pers);
  if(et) lines.push({label:`Etagengeld (${nn(d.stockwerke)} Stock × ${nn(d.etagenAnzahl)} ÷ ${pers} Pers.)`,menge:"",ep:"",gp:et});
  const ks=r2(nn(d.kmSelbst)*nn(P.kmSelbst)); if(ks) lines.push({label:"km selbst gefahren",menge:nn(d.kmSelbst),ep:nn(P.kmSelbst),gp:ks});
  const km=r2(nn(d.kmMit)*nn(P.kmMit)); if(km) lines.push({label:"km mitgefahren",menge:nn(d.kmMit),ep:nn(P.kmMit),gp:km});
  return {lines,total:r2(lines.reduce((s,l)=>s+l.gp,0))};
}
function lohnPersonen(o){
  const ids=new Set(o.monteure||[]);
  Object.values(S.lohn).forEach(l=>{ if(l.auftragId===o.id) ids.add(l.uid); });
  if(S.role!=="hersteller" && myId()) ids.add(myId());
  return [...ids].filter(Boolean);
}

   ${darfAndere&&pers.length>1?`<div class="seg" id="lohnWho" style="margin-bottom:8px">${pers.map(p=>`<button data-lw="${esc(p)}" class="${p===uid?"on":""}">${esc(nameOf(p))}</button>`).join("")}</div>`:""}

   ${S.isOwner&&!S.preise?`<div class="small mute" style="margin-top:8px">Noch keine Preisliste hinterlegt (Einstellungen).</div>`:""}
  </div></details></div>`;

async function saveLohn(o,uid,patch){
  const key=lohnDocId(o.id,uid); const cur=S.lohn[key];
  const base=cur?{...cur}:{auftragId:o.id,nr:o.nr,uid,mengen:{}};
  delete base.id;
  const next={...base,...patch,mengen:{...(base.mengen||{}),...(patch.mengen||{})},am:Date.now()};
  S.lohn[key]={id:key,...next};
  await setDoc("lohnberichte/"+key,next);
}
function bindLohn(o){
  document.querySelectorAll("#lohnWho [data-lw]").forEach(b=>b.onclick=()=>{ S.lohnFor[o.id]=b.dataset.lw; render(); });
  const det=$("#lohnDet"); if(det) det.ontoggle=()=>{ S.lohnOpen[o.id]=det.open; };
  let uid=S.lohnFor[o.id]; if(!uid||(!can.planen()&&uid!==myId())) uid=myId();
  if(!uid) return;
  const path="lohnberichte/"+lohnDocId(o.id,uid);
  const save=patch=>saveLohn(o,uid,patch);
  document.querySelectorAll("[data-lq]").forEach(i=>i.onchange=()=>save({mengen:{[i.dataset.lq]:i.value.trim()}}));
  document.querySelectorAll("[data-lf]").forEach(i=>i.onchange=()=>save({[i.dataset.lf]:i.value.trim()}));
}

function meineFahrzeuge(){
  return Object.values(S.fahrzeuge).filter(f=>{
    if(can.planen()) return true;
    if(can.sub()) return f.zugeordnet===myId();
    return !f.zugeordnet || f.zugeordnet===myId() || S.roles[f.zugeordnet]!=="sub";
  }).sort((a,b)=>(a.kennzeichen||"").localeCompare(b.kennzeichen||""));
}
function fahrtenVon(fzId){
  const fz=S.fahrzeuge[fzId]; if(!fz) return [];

  let stand=nn(fz.startKm); list.forEach(f=>{ f._start=stand; stand+=nn(f.km); f._ende=stand; });
  return list;
}

async function fahrtenbuchPdf(fzId,monat){
  const fz=S.fahrzeuge[fzId]; const all=fahrtenVon(fzId); const list=all.filter(f=>(f.datum||"").startsWith(monat));
  const jsPDF=await loadJsPDF(); const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"landscape"});
  const mName=new Date(monat+"-01").toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  pdf.setFontSize(16); pdf.text(`Fahrtenbuch – ${fz.kennzeichen}${fz.name?" ("+fz.name+")":""}`,14,16);
  pdf.setFontSize(10); pdf.text(`${S.settings.monteurName||"JD Brüder GbR"} · ${mName} · ${list.length} Fahrten · ${list.reduce((a,f)=>a+nn(f.km),0)} km`,14,23);
  const cols=[["Datum",22],["Fahrer",32],["Von",58],["Nach",58],["Auftrag",22],["Zweck",42],["km",14],["km-Stand",22]];
  let y=32; const head=()=>{ pdf.setFont(undefined,"bold"); let x=14; cols.forEach(([t,w])=>{ pdf.text(t,x,y); x+=w; }); pdf.setFont(undefined,"normal"); pdf.line(14,y+1.5,284,y+1.5); y+=6; };
  head();
  list.forEach(f=>{ const o=S.orders[f.auftragId]; const row=[new Date(f.datum).toLocaleDateString("de-DE"),nameOf(f.fahrer)==="Ich"?(S.me?.name||""):nameOf(f.fahrer),f.von||"",f.nach||"",o?o.nr:"",f.zweck||"",String(nn(f.km)),`${f._start}–${f._ende}`];
    const wrapped=row.map((t,i)=>pdf.splitTextToSize(String(t),cols[i][1]-2)); const hh=Math.max(...wrapped.map(w=>w.length))*4.2;
    if(y+hh>196){ pdf.addPage(); y=16; head(); }
    let x=14; wrapped.forEach((w,i)=>{ pdf.text(w,x,y); x+=cols[i][1]; }); y+=hh+1.5; pdf.setDrawColor(220); pdf.line(14,y-2.5,284,y-2.5); pdf.setDrawColor(0); });
  if(list.length){ y+=3; pdf.setFont(undefined,"bold"); pdf.text(`Kilometerstand Monatsanfang: ${list[0]._start}   ·   Monatsende: ${list[list.length-1]._ende}`,14,y); }
  return {blob:pdf.output("blob"),name:`Fahrtenbuch_${(fz.kennzeichen||"Auto").replace(/[^\w-]+/g,"_")}_${monat}.pdf`};
}

function viewWoche(){

  const weeks=[]; for(let i=-1;i<5;i++){ const d=new Date(); d.setDate(d.getDate()+i*7); weeks.push(isoWeek(d)); }
  let h=`<div class="row between" style="margin-bottom:6px"><h2 style="margin:0;font-size:20px">Wochenplan</h2>
    <div class="seg" id="wSeg" style="min-width:200px"><button data-w="0" class="${!S.wochenNurMeine?"on":""}">Alle</button><button data-w="1" class="${S.wochenNurMeine?"on":""}">Nur meine</button></div></div>`;

    items=items.filter(sichtbar);
    if(S.wochenNurMeine) items=items.filter(o=>(o.monteure||[]).includes(myId()));
    const m=mondayOf(w.jahr,w.kw); const f=new Date(m); f.setDate(f.getDate()+4);
    h+=`<div class="kw"><b>KW ${w.kw}</b><span class="small mute">${m.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}–${f.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</span>${w.kw===NOW.kw?`<span class="now">diese Woche</span>`:""}</div>`;
    if(!items.length){ h+=`<div class="small mute" style="padding:0 4px 6px">Nichts geplant.</div>`; return; }
    // nach Monteur gruppieren
    const by={}; items.forEach(o=>{ const ms=(o.monteure&&o.monteure.length)?o.monteure:["_"]; ms.forEach(mm=>(by[mm]=by[mm]||[]).push(o)); });
    Object.keys(by).sort((a,b)=>a==="_"?1:b==="_"?-1:nameOf(a).localeCompare(nameOf(b))).forEach(mm=>{
      if(S.wochenNurMeine && mm!==myId()) return;
      h+=`<div class="card" style="padding:10px 12px"><div class="row" style="margin-bottom:6px">${mm==="_"?`<span class="chip warn">Noch niemand eingeteilt</span>`:`<span class="av">${esc(initials(mm))}</span><b>${esc(nameOf(mm))}</b>`}</div>
      ${by[mm].sort((a,b)=>(a.termin||9e15)-(b.termin||9e15)).map(o=>`<a href="#a-${esc(o.id)}" class="row between" style="text-decoration:none;color:inherit;padding:7px 0;border-top:1px solid var(--line)">
        <div><b>${esc(o.nr)}</b> · ${esc(o.bauvorhaben||"")}<div class="small mute">${esc(o.plzOrt||"")}</div></div>
        <div style="text-align:right">${o.terminStatus==="fest"?`<span class="chip ok">${esc(o.termin?fmtDate(o.termin):"fest")}</span>`:`<span class="chip warn">offen</span>`}${istFertig(o)?`<div class="small" style="color:var(--ok)">✓ erledigt</div>`:""}</div></a>`).join("")}</div>`;
    });
  });
  return h;
}

/* ---------- Reklamationen ---------- */
function viewRekla(){
  const all=Object.values(S.reklas).filter(r=>sichtbar(S.orders[r.auftragId]||{})).sort((a,b)=>b.am-a.am);
  const offen=all.filter(r=>r.offen), zu=all.filter(r=>!r.offen);
  const block=(r)=>{ const o=S.orders[r.auftragId]||{}; return `<div class="card"><div class="row between"><a href="#a-${esc(r.auftragId)}" style="font-weight:800;font-size:16px;text-decoration:none">${esc(o.nr||r.auftragId)}</a><span class="small mute">${esc(o.bauvorhaben||"")}</span></div>${reklaItem(r)}</div>`; };
  let h=`<h2 style="margin:0 0 10px;font-size:20px">Reklamationen</h2>`;
  const cnt={}; all.forEach(r=>cnt[r.ursache]=(cnt[r.ursache]||0)+1);
  if(all.length) h+=`<div class="row" style="margin-bottom:12px">${Object.entries(URSACHEN).map(([k,l])=>`<span class="chip">${esc(l)}: <b>${cnt[k]||0}</b></span>`).join("")}</div>`;
  h+=`<div class="kw"><b>Offen</b><span class="small mute">${offen.length}</span></div>`;
  h+= offen.length? offen.map(block).join("") : `<div class="small mute" style="padding:4px">Keine offenen Reklamationen 👍</div>`;
  if(zu.length){ h+=`<div class="kw"><b>Erledigt</b><span class="small mute">${zu.length}</span></div>`+zu.slice(0,30).map(block).join(""); }
  return h;
}

/* ---------- Abrechnung ---------- */
function viewGeld(){
  const rows=Object.values(S.fin).map(f=>({f,o:S.orders[f.id]||{nr:f.nr||f.id,id:f.id}})).sort((a,b)=>(b.f.datum||0)-(a.f.datum||0));
  const m=new Date(); const thisMonth=rows.filter(r=>{ const d=new Date(r.f.datum||0); return d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear(); });
  const sum=a=>a.reduce((s,r)=>s+(Number(r.f.summe)||0),0);
  const offen=rows.filter(r=>(r.f.rechnungStatus||"offen")!=="versendet"&&r.f.rechnungStatus!=="bezahlt");
  let h=`<h2 style="margin:0 0 10px;font-size:20px">Abrechnung <span class="small mute">(nur für dich)</span></h2>
  <div class="sum"><div class="card"><b>${fmtEUR(sum(thisMonth))}</b><span>${m.toLocaleDateString("de-DE",{month:"long"})}</span></div><div class="card"><b>${fmtEUR(sum(offen))}</b><span>noch nicht in Rechnung</span></div><div class="card"><b>${rows.length}</b><span>Abrechnungen</span></div></div>
  <div class="banner info">Ablauf: Abrechnung von meta kommt rein → du gibst die Rechnung frei → Daten in Lexware übernehmen → Versand bestätigen.</div>`;
  { const ein=sum(thisMonth); const kost=r2(thisMonth.reduce((s2,r)=>s2+kostenAuftrag(r.f.id),0)); const gew=r2(ein-kost);
    h+=`<div class="card"><h3>Gewinn · ${m.toLocaleDateString("de-DE",{month:"long",year:"numeric"})}</h3><div class="grid3" style="text-align:center"><div><div class="small mute">Von meta</div><b style="font-size:17px">${fmtEUR(ein)}</b></div><div><div class="small mute">An Subs / Akkord</div><b style="font-size:17px">− ${fmtEUR(kost)}</b></div><div><div class="small mute">Gewinn</div><b style="font-size:17px;color:${gew>=0?"var(--ok)":"var(--bad)"}">${fmtEUR(gew)}</b></div></div><div class="small mute" style="margin-top:6px">Aufträge, deren meta-Abrechnung in diesem Monat kam.</div></div>`; }
  { const subs=Object.keys(S.roles).filter(k=>S.roles[k]==="sub");
    if(subs.length) h+=`<div class="card"><h3>Subunternehmer · ${m.toLocaleDateString("de-DE",{month:"long"})}</h3>${subs.map(u=>{ const ls=Object.values(S.lohn).filter(l=>l.uid===u); const mon=ls.filter(l=>{ const d=new Date(l.am||0); return d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear(); }); const sm=r2(mon.reduce((a,l)=>a+((calcLohn(l,S.preise)||{}).total||0),0)); const pr=Object.values(S.orders).filter(o=>o.berichtStatus==="pruefung"&&o.berichtVonSub===u).length;
      return `<details class="person" style="display:block"><summary style="display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none"><span class="av">${esc(initials(u))}</span><div style="flex:1"><b>${esc(nameOf(u))}</b><div class="small mute">${mon.length} Bericht(e)${pr?` · <span style="color:var(--warn)">${pr} zu prüfen</span>`:""} · Liste: ${esc((S.preise?.listen?.[S.preise?.zuordnung?.[u]]||{}).name||"Standard")}</div></div><b>${fmtEUR(sm)}</b></summary>
      <div style="padding:6px 0 0 38px">${ls.sort((a,b)=>(b.am||0)-(a.am||0)).slice(0,30).map(l=>{ const o=S.orders[l.auftragId]||{}; const c=calcLohn(l,S.preise); return `<a href="#a-${esc(l.auftragId)}" class="row between small" style="text-decoration:none;color:inherit;padding:5px 0;border-top:1px solid var(--line)"><span><b>${esc(o.nr||l.nr)}</b> ${esc(o.bauvorhaben||"")} · ${l.am?new Date(l.am).toLocaleDateString("de-DE"):""}${o.berichtStatus==="pruefung"?` <span class="chip warn">prüfen</span>`:""}</span><b>${fmtEUR(c?.total||0)}</b></a>`; }).join("")||`<div class="small mute">Noch keine Berichte.</div>`}</div></details>`; }).join("")}</div>`; }
  if(S.preise){
    const byU={}; Object.values(S.lohn).forEach(l=>{ const d=new Date(l.am||0); if(d.getMonth()!==m.getMonth()||d.getFullYear()!==m.getFullYear()) return; if(S.roles[l.uid]==="sub") return; const c=calcLohn(l,S.preise); if(!c) return; (byU[l.uid]=byU[l.uid]||{sum:0,n:0}); byU[l.uid].sum+=c.total; byU[l.uid].n++; });
    const ks=Object.keys(byU);
    if(ks.length) h+=`<div class="card"><h3>Akkord Mitarbeiter · ${m.toLocaleDateString("de-DE",{month:"long"})}</h3>${ks.map(k=>`<div class="person"><span class="av">${esc(initials(k))}</span><div style="flex:1"><b>${esc(nameOf(k))}</b><div class="small mute">${byU[k].n} Bericht(e)</div></div><b>${fmtEUR(byU[k].sum)}</b></div>`).join("")}</div>`;
  }
  if(!rows.length) h+=`<div class="empty">Noch keine Montageabrechnungen.</div>`;
  rows.forEach(({f,o})=>{ const st=f.rechnungStatus||"offen"; h+=`<a class="order" href="#a-${esc(f.id)}"><div class="row between"><span class="nr">${esc(o.nr||f.nr)}</span><b>${fmtEUR(f.summe)}</b></div><div class="small mute">${esc(o.bauvorhaben||f.bauvorhaben||"")} · ${f.datum?new Date(f.datum).toLocaleDateString("de-DE"):""}</div><div class="chips"><span class="chip ${RECHNUNG[st][1]}">${RECHNUNG[st][0]}</span>${f.rechnungsNr?`<span class="chip">${esc(f.rechnungsNr)}</span>`:""}${(()=>{ const g=r2((Number(f.summe)||0)-kostenAuftrag(f.id)); return `<span class="chip ${g>=0?"ok":"bad"}">Gewinn ${fmtEUR(g)}</span>`; })()}</div></a>`; });
  return h;
}

/* ============ Ereignisse ============ */
function bind(r){
  const app=$("#app");
  app.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>history.length>1?history.back():go("auftraege"));
  app.querySelectorAll("[data-zoom]").forEach(t=>t.onclick=e=>{ if(e.target.closest("[data-delfoto]")) return; lightbox(t.dataset.zoom); });
  const q=$("#q"); if(q){ q.oninput=()=>{ S.q=q.value; clearTimeout(q._t); q._t=setTimeout(()=>{ const pos=q.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); },250); }; }
  app.querySelectorAll("#flt [data-f]").forEach(b=>b.onclick=()=>{ S.filter=b.dataset.f; render(); });
  app.querySelectorAll("#wSeg [data-w]").forEach(b=>b.onclick=()=>{ S.wochenNurMeine=b.dataset.w==="1"; render(); });

  $("#pruefBanner") && ($("#pruefBanner").onclick=()=>{ S.filter="pruefung"; render(); });
  $("#abnBack") && ($("#abnBack").onclick=e=>{ e.preventDefault(); S.filter="offen"; render(); });
  app.querySelectorAll("[data-rk-toggle]").forEach(b=>b.onclick=async()=>{ const rk=S.reklas[b.dataset.rkToggle]; await upd("reklamationen/"+rk.id,{offen:!rk.offen, erledigtAm:rk.offen?Date.now():null, erledigtVon:rk.offen?myId():null}); toast(rk.offen?"Reklamation erledigt ✓":"Wieder geöffnet"); });
  app.querySelectorAll("[data-rk-ans]").forEach(b=>b.onclick=()=>{ const rk=S.reklas[b.dataset.rkAns]; modal(`<h2>Antwort / Notiz</h2><textarea class="i" id="ans">${esc(rk.antwort||"")}</textarea><div class="grid2" style="margin-top:12px"><button class="btn" data-close>Abbrechen</button><button class="btn pri" id="ok">Speichern</button></div>`,(m,close)=>{ m.querySelector("#ok").onclick=async()=>{ await upd("reklamationen/"+rk.id,{antwort:m.querySelector("#ans").value.trim()}); close(); }; }); });

function bindDetail(id){
  const o=S.orders[id]; if(!o) return;
  const P=orderPath(id);
  bindLohn(o); bindVordruck(o);
  $("#terminSeg")?.querySelectorAll("button").forEach(b=>b.onclick=()=>upd(P,{terminStatus:b.dataset.t}));
  const td=$("#terminDatum"); if(td) td.onchange=()=>upd(P,{termin:td.value?new Date(td.value+"T08:00:00").getTime():null, terminStatus:td.value?"fest":o.terminStatus||"zu_terminieren"});
  const kwi=$("#kwInput"); if(kwi) kwi.onchange=()=>{ const v=parseInt(kwi.value,10); if(v>0&&v<54) upd(P,{kw:v, jahr:o.jahr||NOW.jahr}); };
  $("#prodSeg")?.querySelectorAll("button").forEach(b=>b.onclick=()=>upd(P,{prodStatus:b.dataset.p, prodGeaendertAm:Date.now(), prodVon:myId()}));
  document.querySelectorAll("[data-rm-m]").forEach(b=>b.onclick=()=>upd(P,{monteure:(o.monteure||[]).filter(x=>x!==b.dataset.rmM)}));
  const am=$("#addMonteur"); if(am) am.onclick=()=>pickPerson(id);
  const eb=$("#editBau"); if(eb) eb.onclick=()=>editBauDialog(id);
  const tb=$("#timerBtn"); if(tb) tb.onclick=async()=>{
    const z=[...(o.zeiten||[])].map(x=>({...x}));
    if(running(o)) z[z.length-1].e=Date.now(); else z.push({s:Date.now(),by:myId()});
    const war=running(o); await upd(P,{zeiten:z}); toast(war?"Zeit gestoppt":"Zeit läuft ⏱");
  };
  document.querySelectorAll("[data-delz]").forEach(a=>a.onclick=async e=>{ e.preventDefault(); if(!await confirmBox("Zeiteintrag löschen?","Dieser Zeitblock wird entfernt.","Löschen","bad")) return; const z=(o.zeiten||[]).filter((_,i)=>i!==Number(a.dataset.delz)); upd(P,{zeiten:z}); });
  document.querySelectorAll("[data-b]").forEach(inp=>{
    const save=()=>{ const k=inp.dataset.b; let v=inp.value.trim();
      if(inp.dataset.top){ if(String(o[k]??"")!==v) upd(P,{[k]:v}); return; }
      if(String((o.bericht||{})[k]??"")!==v) upd(P,{bericht:{[k]:v}}); };
    inp.onchange=save; if(inp.tagName==="TEXTAREA") inp.onblur=save;
  });
  document.querySelectorAll("[data-upload]").forEach(inp=>inp.onchange=()=>uploadFotos(id, inp.dataset.upload, [...inp.files]));
  document.querySelectorAll("[data-delfoto]").forEach(b=>b.onclick=async e=>{ e.stopPropagation(); if(!await confirmBox("Foto löschen?","Das Foto wird aus dem Auftrag entfernt.","Löschen","bad")) return; const f=S.fotos[b.dataset.delfoto]; await S.db.doc("fotos/"+f.id).delete(); if(S.assets && can.planen()){ try{ await S.assets.delete(f.assetId); }catch(e){} } });
  const sg=$("#sign"); if(sg) sg.onclick=()=>signDialog(id);
  $("#speak") && ($("#speak").onclick=()=>sprachDialog(id));
  $("#fahrtAdd") && ($("#fahrtAdd").onclick=()=>fahrtDialog(id));
  $("#finOk") && ($("#finOk").onclick=()=>abschluss(id,"ok"));
  $("#finRekla") && ($("#finRekla").onclick=()=>reklaDialog(id,{abschluss:true}));
  $("#finLeer") && ($("#finLeer").onclick=()=>reklaDialog(id,{leerfahrt:true}));
  $("#newRekla") && ($("#newRekla").onclick=()=>reklaDialog(id,{}));

function rechnungsText(o,f){
  const lines=[`Rechnung – Montageleistung Auftrag ${o.nr}`,`Bauvorhaben: ${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}`, o.vorgang?`meta-Vorgang: ${o.vorgang}`:"", `Leistungszeitraum: ${o.abschluss?new Date(o.abschluss.am).toLocaleDateString("de-DE"):"KW "+(o.kw||"")}`,"","Pos.\tArtikel\tMenge\tEP\tGP"];
  (f.positionen||[]).forEach((p,i)=>lines.push(`${i+1}\t${p.artikel}\t${p.menge}\t${Number(p.ep).toFixed(2)}\t${Number(p.gp).toFixed(2)}`));
  lines.push("",`Summe netto: ${Number(f.summe).toFixed(2)} €`);
  return lines.filter(l=>l!==null).join("\n");
}

async function savePreise(patch){
  const cur=S.preise?{...S.preise}:{preise:{},sichtbarFuer:[]};
  const chefs=Object.keys(S.roles).filter(k=>S.roles[k]==="chef");
  const alt=new Set(cur.sichtbarFuer||[]); patch={...patch,sichtbarFuer:chefs};
  const next={...cur,...patch,preise:{...(cur.preise||{}),...(patch.preise||{})}};
  if(patch.preise===null) next.preise={};
  S.preise=next;
  await setDoc("lohn/preise",next);
  // freigegebene Mitarbeiter bekommen eine Kopie
  const copy={preise:next.preise,stockSatz:next.stockSatz,kmSelbst:next.kmSelbst,kmMit:next.kmMit,listen:next.listen||{},zuordnung:next.zuordnung||{}};
  for(const id of (next.sichtbarFuer||[])) await setDoc("lohnsicht/"+id,copy);
  for(const id of alt) if(!chefs.includes(id)){ try{ await S.db.doc("lohnsicht/"+id).delete(); }catch(e){} }
}

  const lid=S.plSel&&S.preise?.listen?.[S.plSel]?S.plSel:"std";
  const saveL=patch=>{ if(lid==="std") return savePreise(patch); const cur=S.preise.listen[lid]; return savePreise({listen:{...S.preise.listen,[lid]:{...cur,...patch,preise:{...(cur.preise||{}),...(patch.preise||{})}}}}); };

    const pt=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
    cv.onpointerdown=e=>{ draw=true; any=true; cv.setPointerCapture(e.pointerId); const [x,y]=pt(e); ctx.beginPath(); ctx.moveTo(x,y); };
    cv.onpointermove=e=>{ if(!draw) return; const [x,y]=pt(e); ctx.lineTo(x,y); ctx.stroke(); };
    cv.onpointerup=()=>draw=false;
    m.querySelector("#clr").onclick=()=>{ ctx.clearRect(0,0,cv.width,cv.height); any=false; };

async function shrink(file,max=1600,q=.82){
  if(!/^image\//.test(file.type)||/svg/.test(file.type)) return file;
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  }catch(e){ return file; }
}

/* ============ Gmail ============ */
const DEFAULT_QUERY='from:meta.de newer_than:60d';
const GM="Gmail";
function mcpMsg(e){
  const c=e?.code;
  if(c==="server_not_connected") return "Gmail ist noch nicht eingerichtet.";
  if(c==="needs_reauth") return "Gmail-Verbindung abgelaufen, bitte neu einrichten.";
  if(c==="not_in_manifest"||c==="approval_required") return "Zugriff auf Gmail wurde für diese App nicht erlaubt.";
  if(c==="server_unavailable") return "Gmail gerade nicht erreichbar – gleich nochmal versuchen.";
  return e?.message||c||String(e);
}
const txt = el => (el?.textContent||"").replace(/ /g," ").replace(/\s+/g," ").trim();
const num = s => { const v=parseFloat(String(s).replace(/\s/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".")); return isNaN(v)?0:v; };
function splitBV(s){ const i=s.lastIndexOf(","); return i>0?{bauvorhaben:s.slice(0,i).trim(),plzOrt:s.slice(i+1).trim()}:{bauvorhaben:s,plzOrt:""}; }
function htmlDoc(m){ const h=(m.htmlBody||"").replace(/<br\s*\/?>/gi," "); if(!h) return null; return new DOMParser().parseFromString(h,"text/html"); }

function parseUebersicht(m){
  const doc=htmlDoc(m); const out=[];
  if(doc){
    const tbl=doc.querySelector("table"); if(!tbl) return out;
    const heads=[...tbl.querySelectorAll("th")].map(th=>txt(th).toLowerCase());
    const ix=k=>heads.findIndex(h=>h.startsWith(k));
    const iA=ix("aufnr"), iV=ix("vorgang"), iB=ix("bauvorhaben"), iK=ix("kabinen"), iS=ix("status");
    let kw=null,jahr=null;
    tbl.querySelectorAll("tr").forEach(tr=>{
      const tds=[...tr.querySelectorAll("td")];
      if(tds.length===1){ const mm=txt(tds[0]).match(/KW\s*(\d+)\s*\/\s*(\d{4})/i); if(mm){ kw=+mm[1]; jahr=+mm[2]; } return; }
      if(tds.length>=4 && iA>=0){
        const nr=txt(tds[iA]); if(!nr) return;
        out.push({nr, vorgang:iV>=0?txt(tds[iV]).replace(/^-$/,""):"", ...splitBV(txt(tds[iB])), kabinen:iK>=0?txt(tds[iK]):"", versand:iS>=0?txt(tds[iS]):"", kw, jahr});
      }
    });
    return out;
  }
  // Fallback Klartext
  let kw=null,jahr=null;
  (m.plaintextBody||"").split(/\n/).forEach(l=>{
    const k=l.match(/^\s*KW\s*(\d+)\/(\d{4})/); if(k){kw=+k[1];jahr=+k[2];return;}
    const r=l.match(/^\s*((?:R-)?\d{4,6}(?:\/\d+)?)\s+(?:(\d{5,7}|-)\s+)?(.+?,\s*\d{4,5}\s+[^\d]+?)\s+(\d+)?\s*(versendet|noch nicht)/);
    if(r) out.push({nr:r[1],vorgang:r[2]&&r[2]!=="-"?r[2]:"",...splitBV(r[3].trim()),kabinen:r[4]||"",versand:r[5]==="noch nicht"?"noch nicht versendet":"versendet",kw,jahr});
  });
  return out;
}
function parseAbrechnung(m){
  const doc=htmlDoc(m); const pos=[]; let summe=0, bem="";
  if(doc){
    doc.querySelectorAll("tr").forEach(tr=>{
      const tds=[...tr.querySelectorAll("td")]; const t=txt(tr);
      if(/^Bem\.?:/i.test(t)) bem=t.replace(/^Bem\.?:\s*/i,"");
      if(/Summe/i.test(t)){ const v=num(txt(tds[tds.length-1])); if(v) summe=v; return; }
      if(tds.length===4){ const [a,me,ep,gp]=tds.map(txt); if(a && /^[\d.,]+$/.test(gp)) pos.push({artikel:a,menge:num(me),ep:num(ep),gp:num(gp)}); }
    });
  }
  if(!summe){ const mm=(m.plaintextBody||"").match(/Summe:\s*([\d.,]+)/); if(mm) summe=num(mm[1]); }
  if(!pos.length && m.plaintextBody){ m.plaintextBody.split("\n").forEach(l=>{ const r=l.match(/^\s*(.+?)\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)\s*$/); if(r && !/Summe/.test(r[1])) pos.push({artikel:r[1].trim(),menge:num(r[2]),ep:num(r[3]),gp:num(r[4])}); }); }
  const mm=(m.plaintextBody||txt(doc?.body)).match(/Auftrag\s+\S+\s+\(([^)]+)\)/);
  return {positionen:pos,summe,bemerkung:bem,bv:mm?mm[1]:""};
}

async function syncMails(){
  if(!can.mails()) return;
  const logLines=[]; let closeM=null; let logEl=null;
  const log=s=>{ logLines.push(s); if(logEl){ logEl.textContent=logLines.join("\n"); logEl.scrollTop=1e9; } };
  closeM=modal(`<h2>Mails von meta abrufen</h2><div class="small mute">Suche: ${esc(S.settings.gmailQuery||DEFAULT_QUERY)}</div><div class="log" id="lg"></div><button class="btn block" data-close style="margin-top:12px" id="cl">Schließen</button>`,(m)=>{ logEl=m.querySelector("#lg"); });
  const btn=$("#syncBtn"); btn.disabled=true;
  let neu=0, upd_=0, abr=0;
  try{
    log("Suche Mails …");
    const sr=await S.mcp.callTool(GM,"search_threads",{query:S.settings.gmailQuery||DEFAULT_QUERY,pageSize:50,view:"THREAD_VIEW_MINIMAL"},{cache:false});
    const threads=(sr.payload&&sr.payload.threads)||[];
    log(`${threads.length} Mail-Verläufe gefunden.`);
    const stDoc=await S.db.doc("mails/status").get();
    const st=stDoc.exists?stDoc.data():{threads:{},msgs:{}};
    st.threads=st.threads||{}; st.msgs=st.msgs||{};
    // älteste zuerst, damit neuere Infos gewinnen
    const msgs=[];
    for(const t of threads){
      const subj=(t.messages&&t.messages[0]&&t.messages[0].subject)||"";
      if(!/Montageauftr|Montagezusage|Montageabrechnung/i.test(subj) && !(t.messages||[]).some(x=>/Montage/i.test(x.subject||""))) continue;
      const known=(t.messages||[]).every(x=>st.msgs[x.id]) && st.threads[t.id]===(t.messageCount||t.messages?.length);
      if(known) continue;
      try{
        const th=await S.mcp.callTool(GM,"get_thread",{threadId:t.id,messageFormat:"FULL_CONTENT"},{cache:false});
        const p=th.payload||{};
        (p.messages||[]).forEach(mm=>{ if(!st.msgs[mm.id]) msgs.push(mm); });
        st.threads[t.id]=(p.messages||[]).length;
      }catch(e){ log("⚠ "+(t.messages?.[0]?.subject||t.id)+": "+mcpMsg(e)); }
    }
    msgs.sort((a,b)=>new Date(a.date)-new Date(b.date));
    log(`${msgs.length} neue Nachrichten werden verarbeitet …`);
    const zusagen=[];
    for(const m of msgs){
      const subj=m.subject||"";
      if(!/meta\.de/i.test(m.sender||"")) { st.msgs[m.id]=1; continue; }
      try{
        if(/Montageauftr/i.test(subj)){
          const rows=parseUebersicht(m); log(`📋 Wochenübersicht ${new Date(m.date).toLocaleDateString("de-DE")}: ${rows.length} Aufträge`);
          for(const r of rows){
            const id=idOf(r.nr); const ex=S.orders[id];
            if(!ex){ await setDoc(orderPath(id),{...r,terminStatus:"zu_terminieren",prodStatus:/nicht/i.test(r.versand)?"in_produktion":"abholbereit",erstelltAm:Date.now(),quelle:"mail",uebersichtAm:new Date(m.date).getTime()}); S.orders[id]={id,...r}; neu++; }
            else { const p={}; ["vorgang","bauvorhaben","plzOrt","kabinen","versand","kw","jahr"].forEach(k=>{ if(r[k] && r[k]!==ex[k]) p[k]=r[k]; });
              if(p.versand && !/nicht/i.test(p.versand) && (!ex.prodStatus||ex.prodStatus==="offen"||ex.prodStatus==="in_produktion"||ex.prodStatus==="produziert")) p.prodStatus="abholbereit";
              if(Object.keys(p).length){ await upd(orderPath(id),{...p,uebersichtAm:new Date(m.date).getTime()}); Object.assign(ex,p); upd_++; } }
          }
        } else if(/Montagezusage/i.test(subj)){
          const mm=subj.match(/Auftrag\s+(\S+)\s+in\s+KW\s+(\d+)\/(\d{4})/i);
          if(mm){
            const nr=mm[1], id=idOf(nr); const body=m.plaintextBody||txt(htmlDoc(m)?.body);
            const kab=(body.match(/\((\d+)\s+Kabine/)||[])[1]||"";
            const ab=(body.match(/Der Auftrag kann (.*?) abgeholt werden/s)||[])[1]||"";
            const att=(m.attachments||[]).filter(a=>/image|pdf/i.test(a.mimeType||"")).map(a=>({id:a.id,filename:a.filename||"",mimeType:a.mimeType||""}));
            const data={kw:+mm[2],jahr:+mm[3],zusage:true,abholung:ab?ab.replace(/\s+/g," ").trim():"",zusageMail:{msgId:m.id,viewUrl:m.viewUrl||"",att,am:new Date(m.date).getTime()}};
            if(kab) data.kabinen=kab;
            if(!S.orders[id]){ await setDoc(orderPath(id),{nr,...data,terminStatus:"zu_terminieren",prodStatus:"in_produktion",erstelltAm:Date.now(),quelle:"mail"}); S.orders[id]={id,nr,...data}; neu++; }
            else { await upd(orderPath(id),data); Object.assign(S.orders[id],data); upd_++; }
            log(`✅ Montagezusage ${nr} für KW ${mm[2]} (${att.length} Anhänge)`);
            if(att.length) zusagen.push(id);
          }
        } else if(/Montageabrechnung/i.test(subj)){
          const mm=subj.match(/Auftrag\s+(\S+)/i);
          if(mm){
            const nr=mm[1].replace(/[^\w\/\-]/g,""), id=idOf(nr); const a=parseAbrechnung(m);
            if(a.summe){
              const ex=S.fin[id]; const d=new Date(m.date).getTime();
              if(!ex || (ex.datum||0)<=d){
                await setDoc("finanzen/"+id,{nr,bauvorhaben:a.bv,summe:a.summe,positionen:a.positionen,bemerkung:a.bemerkung,datum:d,mailId:m.id,rechnungStatus:ex?.rechnungStatus||"offen",rechnungsNr:ex?.rechnungsNr||"",quelle:"mail"});
              }
              if(!S.orders[id]){ const bv=splitBV(a.bv); await setDoc(orderPath(id),{nr,bauvorhaben:bv.bauvorhaben,plzOrt:bv.plzOrt,terminStatus:"fest",prodStatus:"abholbereit",erstelltAm:Date.now(),quelle:"mail",abgerechnet:true,abschluss:{typ:"ok",am:d,by:null},berichtStatus:"gesendet",berichtGesendetAm:d}); }
              else await upd(orderPath(id),{abgerechnet:true});
              abr++; log(`💶 Abrechnung ${nr}: ${fmtEUR(a.summe)}`);
            } else log(`⚠ Abrechnung ${nr}: Summe nicht lesbar`);
          }
        }
        st.msgs[m.id]=1;
      }catch(e){ log("⚠ Fehler bei „"+subj+"“: "+(e.message||e.code)); }
    }
    await setDoc("mails/status",st);
    await setDoc("einstellungen/allgemein",{...S.settings,letzterAbruf:Date.now()});
    // Unterlagen neuer Zusagen holen & Deckblatt lesen
    for(const id of zusagen){
      try{ log(`📎 Unterlagen für ${S.orders[id]?.nr} …`); const n=await importUnterlagen(id,s=>log("   "+s)); log(`   ${n} Bilder übernommen`); }
      catch(e){ log("   ⚠ "+mcpMsg(e)); }
    }
    log(`\nFertig: ${neu} neu, ${upd_} aktualisiert, ${abr} Abrechnungen.`);
  }catch(e){ log("⚠ "+mcpMsg(e)); }
  btn.disabled=false;
}
async function importUnterlagen(id,progress=()=>{}){
  const o=S.orders[id]; const z=o?.zusageMail; if(!z?.att?.length) return 0;
  const have=new Set(Object.values(S.fotoFor===id?S.fotos:{}).map(f=>f.mailAtt).filter(Boolean));
  const existing=await S.db.collection("fotos").where("auftragId","==",id).get().catch(()=>null);
  existing?.docs.forEach(d=>{ const x=d.data(); if(x.mailAtt) have.add(x.mailAtt); });
  const blobs=[]; let n=0;
  for(const a of z.att){
    const key=(a.filename||"")+"|"+z.msgId; if(have.has(key)) continue;
    progress(`lade ${a.filename} …`);
    const r=await S.mcp.callTool(GM,"download_gmail_attachment",{messageId:z.msgId,attachmentId:a.id,filename:a.filename,mimeType:a.mimeType},{cache:false});
    const img=(r.content||[]).find(c=>c.type==="image"&&c.data);
    if(!img) continue;
    const bin=atob(img.data); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const blob=new Blob([u8],{type:img.mimeType||a.mimeType||"image/jpeg"});
    blobs.push(blob);
    if(S.assets){ const sb=await shrink(blob,2000,.85); const up=await S.assets.upload(sb); await S.db.collection("fotos").doc().set({auftragId:id,kat:"unterlagen",assetId:up.id,name:a.filename,typ:sb.type,mailAtt:key,am:Date.now(),von:myId()}); }
    n++;
  }
  if(blobs.length && S.sample){
    progress("Claude liest das Deckblatt …");
    try{ const k=await readDeckblatt(id,blobs); progress(`${k} Felder vom Deckblatt übernommen`); }catch(e){ progress("Deckblatt nicht gelesen: "+(e.message||e.code)); }
  }
  return n;
}

  const L=[];

  else L.push(`Auftrag ${o.nr} (${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}): Baustelle erfolgreich abgeschlossen.`);
  L.push("","Montagebericht:");
  if(typ==="leerfahrt"&&lf){ L.push(`- Datum: ${new Date(lf.am).toLocaleDateString("de-DE")}`,`- Gefahrene km: ${lf.km||"-"}`,`- Personen: ${lf.personen||"-"}`,`- Zeit: ${Math.floor(lf.minuten/60)} Std ${lf.minuten%60} Min`,`- Grund: ${lf.grund}`); }
  else {
    L.push(`- Montagetag(e): ${tage||"-"}`,`- Arbeitszeit: ${fmtHM(totalMs(o))}`,`- Personen: ${b.personen||"-"}`,`- Gefahrene km: ${b.istKm||"-"}`,`- Übernachtung: ${b.hotel==="ja"?"ja"+(b.hotelInfo?" ("+b.hotelInfo+")":""):"nein"}`);
    if(b.taetigkeit) L.push(`- Ausgeführt: ${b.taetigkeit}`);
    if(o.unterschrift) L.push(`- Abnahme unterschrieben von: ${o.unterschrift.name||"-"} am ${new Date(o.unterschrift.am).toLocaleDateString("de-DE")}`);
  }
  if((typ==="rekla"||typ==="leerfahrt") && rk){ L.push("","Reklamation:",`- Ursache: ${URSACHEN[rk.ursache]||rk.ursache}`,`- Beschreibung: ${rk.text}`); }
  L.push("","Montagebericht und Abnahmebescheinigung im Anhang.","","Mit freundlichen Grüßen","JD Brüder");
  return L.join("\n");
}
async function blobToB64(blob){ return await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
function berichtDialog(id){
  const o=S.orders[id];
  const typ=o.berichtTyp||o.abschluss?.typ||"ok";
  const rk=Object.values(S.reklas).filter(r=>r.auftragId===id).sort((a,c)=>c.am-a.am)[0];
  const cands=[];
  Object.values(S.fotos).forEach(f=>{ if(/^image/.test(f.typ||"image") && f.kat!=="unterlagen") cands.push({assetId:f.assetId,label:{vorher:"Vorher",nachher:"Nachher",vordruck:"Berichtszettel"}[f.kat]||f.kat,def:f.kat!=="vorher"}); });
  if((typ==="rekla"||typ==="leerfahrt") && rk) (rk.fotos||[]).forEach(a=>cands.push({assetId:a,label:"Reklamation",def:true}));
  if(o.unterschrift) cands.push({assetId:o.unterschrift.assetId,label:"Unterschrift",def:true,png:true});
  const subject=`${o.nr} ${o.bauvorhaben||""}`.trim()+(typ==="leerfahrt"?" – Leerfahrt":typ==="rekla"?" – Reklamation":"");
  const to=S.settings.berichtEmail||"Montagebericht@meta.de";
  modal(`<h2>Bericht an meta senden</h2>
   <label class="f">An</label><input class="i" id="to" value="${esc(to)}">
   <label class="f">Betreff</label><input class="i" id="sj" value="${esc(subject)}">
   <label class="f">Text</label><textarea class="i" id="bd" style="min-height:240px">${esc(berichtText(o))}</textarea>
   <label class="row" style="margin-top:10px;gap:8px"><input type="checkbox" id="withPdf" checked style="width:20px;height:20px"><b>Montagebericht als PDF anhängen${abnahmeOk(o)?" (mit unterschriebener Abnahme)":""}</b></label>
   ${abnahmeOk(o)?"":`<div class="small mute">Sichtabnahme noch nicht erfolgt – sie wird nicht mitgeschickt.</div>`}
   <label class="f">Fotos anhängen</label>
   <div class="thumbs">${cands.map((c,i)=>`<label class="t" style="cursor:pointer"><img src="_blob/${esc(c.assetId)}" alt=""><input type="checkbox" data-ci="${i}" ${c.def?"checked":""} style="position:absolute;top:5px;left:5px;width:20px;height:20px"><span style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 4px">${esc(c.label)}</span></label>`).join("")||`<span class="small mute">Keine Fotos vorhanden.</span>`}</div>
   <div id="st" class="small mute" style="margin-top:8px"></div>
   <div class="grid2" style="margin-top:14px"><button class="btn" data-close>Abbrechen</button><button class="btn pri" id="ok">✉︎ Jetzt senden</button></div>`,(m,close)=>{
    m.querySelector("#ok").onclick=async()=>{
      const btn=m.querySelector("#ok"), st=m.querySelector("#st");
      const toV=m.querySelector("#to").value.trim(); if(!/@/.test(toV)) return toast("Empfänger fehlt");
      if(!await confirmBox("Bericht wirklich senden?",`An ${esc(toV)} – Betreff „${esc(m.querySelector("#sj").value)}“`,"Senden","pri")) return;
      btn.disabled=true; st.innerHTML=`<span class="spin"></span> Fotos werden vorbereitet …`;
      const atts=[]; let size=0, skipped=0;
      if(m.querySelector("#withPdf").checked){
        try{ st.innerHTML=`<span class="spin"></span> PDF wird erstellt …`; let pdf=await makeVordruckPdf(o); if(pdf.size>520000) pdf=await makeVordruckPdf(o,.5); const b64=await blobToB64(pdf); size+=b64.length; atts.push({content:b64,filename:`Montagebericht_${idOf(o.nr)}.pdf`,mimeType:"application/pdf"}); }
        catch(e){ btn.disabled=false; st.textContent="PDF konnte nicht erstellt werden: "+(e.message||e); return; }
      }
      if(!o.unterschrift && o.abnahmeDatei && !/^image/.test(o.abnahmeDatei.typ||"")){ try{ const raw=await (await fetch("_blob/"+o.abnahmeDatei.assetId)).blob(); const b64=await blobToB64(raw); size+=b64.length; atts.push({content:b64,filename:`Abnahme_unterschrieben_${idOf(o.nr)}.pdf`,mimeType:raw.type||"application/pdf"}); }catch(e){} }
      const sel=[...m.querySelectorAll("[data-ci]:checked")].map(x=>cands[+x.dataset.ci]);
      for(const c of sel){
        try{
          const raw=await (await fetch("_blob/"+c.assetId)).blob();
          const b=c.png?raw:await shrink(raw,1280,.72);
          const b64=await blobToB64(b);
          if(size+b64.length>850000){ skipped++; continue; }
          size+=b64.length; atts.push({content:b64,filename:`${idOf(o.nr)}_${c.label}_${atts.length+1}.${c.png?"png":"jpg"}`,mimeType:c.png?"image/png":"image/jpeg"});
        }catch(e){ skipped++; }
      }
      st.innerHTML=`<span class="spin"></span> wird gesendet …`;
      try{
        const r=await S.mcp.callTool(GM,"send_message",{to:[toV],subject:m.querySelector("#sj").value.trim(),body:m.querySelector("#bd").value,attachments:atts});
        await upd(orderPath(id),{berichtStatus:"gesendet",berichtGesendetAm:Date.now(),berichtAn:toV,berichtMailId:r.payload?.id||""});
        close(); toast("Bericht gesendet ✓"+(skipped?` (${skipped} Foto(s) zu groß, nicht angehängt)`:""),4000);
      }catch(e){
        btn.disabled=false;
        st.textContent = (e.code==="server_unavailable"||e.code==="upstream_error") ? "Unklar, ob die Mail raus ist – bitte im Gmail-Postausgang nachsehen, bevor du nochmal sendest." : "Nicht gesendet: "+mcpMsg(e);
      }
    };
  });
}

boot();
