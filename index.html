    toast(`📣 ${nameOf(u)} hat die Nachricht bekommen`,3000); render(); });
  $("#zumBericht") && ($("#zumBericht").onclick=()=>{ const z=$("#berichtCard")||$("#preisliste")||$("#anteilAb")||document.querySelector(".einsatz,.card.einsatz"); z?.scrollIntoView({behavior:"smooth",block:"start"}); });
  $("#rkAz") && ($("#rkAz").onchange=()=>{ const m=parseMin($("#rkAz").value); if($("#rkAz").value.trim() && m==null) return toast("Bitte z. B. 3:30 oder 3,5 eintragen"); upd(P,{bericht:{arbeitszeitMin:m}}); });
  $("#terminAnfrage") && ($("#terminAnfrage").onclick=()=>terminAnfrageDialog(id));
  $("#taNeu") && ($("#taNeu").onclick=()=>terminAnfrageDialog(id));
  $("#anteilAend") && ($("#anteilAend").onclick=()=>aenderungAnfragen(id,"anteil"));
  $("#taKwTag") && ($("#taKwTag").onclick=()=>terminDialog(id));
  $("#taUebernehmen") && ($("#taUebernehmen").onclick=async()=>{ const a=o.terminAnfrage, t=a?.antwort?.termin; if(!t) return;
    if(!await confirmBox("Wunschtermin übernehmen?",`${esc(terminText(t))} wird als fester Termin eingetragen. Die Eingeteilten bekommen Bescheid, und der Termin geht in den Google Kalender.`,"Übernehmen","ok")) return;
    const ta={...a,status:"uebernommen"}; await upd(P,{termin:t,terminStatus:"fest",terminQuelle:"bauleiter",terminAnfrage:ta}); S.orders[id]={...S.orders[id],termin:t,terminStatus:"fest",terminAnfrage:ta};
    if(a.token) S.db.doc("terminanfragen/"+a.token).update({status:"uebernommen"}).catch(()=>{});
    S.sync?.run({termin:id}).catch(()=>{});
    try{ const r=await S.sync?.run({kalender:id}); toast(r?.gesendet?`Termin eingetragen ✓ – Kalendereinladung an ${r.an}`:"Termin eingetragen ✓"+(r?.grund?` (Kalender: ${r.grund})`:""),4000); }catch(e){ toast("Termin eingetragen ✓"); }
    render(); });
  $("#kalBtn") && ($("#kalBtn").onclick=async()=>{ const b=$("#kalBtn"); b.disabled=true;
    try{ const r=await S.sync?.run({kalender:id}); toast(r?.gesendet?`Kalendereinladung an ${r.an} gesendet ✓`:`Nicht gesendet: ${r?.grund||"unbekannt"}`,4000); }catch(e){ toast("Kalender fehlgeschlagen: "+(e.message||e)); } b.disabled=false; });
  document.querySelectorAll("[data-serie]").forEach(b=>b.onclick=async()=>{ const v=b.dataset.serie; if(!can.planen()||o.serie===v) return; // nur der Chef legt die Serie fest
    await upd(P,{serie:v}); S.orders[id]={...S.orders[id],serie:v}; render(); toast(`${serieName(S.orders[id])} gewählt`,2200); });
  $("#gemeinsam") && ($("#gemeinsam").onchange=async()=>{ const v=$("#gemeinsam").checked; await upd(P,{gemeinsam:v}); S.orders[id]={...S.orders[id],gemeinsam:v}; render(); toast(v?"🤝 Gemeinsamer Auftrag – jeder trägt seins ein, im Bericht wird alles zusammengezählt":"Normaler Auftrag",3500); });
  // Preisliste: Betrag je Zeile sofort mitrechnen (gespeichert wird beim Verlassen des Feldes)
  document.querySelectorAll("#preisliste .pl-z:not(.pl-etage) .pl-q, .pl-liste .pl-q").forEach(i=>i.addEventListener("input",()=>{ const z=i.closest(".pl-z"), ep=z.dataset.ep;
    z.classList.toggle("voll",!!nn(i.value)); const t=z.closest(".pl-fenster")?.previousElementSibling?.querySelector(".pl-anz"); if(t) t.textContent=z.closest(".pl-fenster").querySelectorAll(".pl-z.voll").length||""; z.querySelector(".pl-gp").textContent=nn(i.value)&&ep!==""?fmtEUR(r2(nn(i.value.replace(",","."))*nn(ep))):""; }));
  $("#anteilAb") && ($("#anteilAb").onclick=async()=>{
    if(document.activeElement?.closest?.("#preisliste")){ document.activeElement.dispatchEvent(new Event("change")); document.activeElement.blur(); await new Promise(r=>setTimeout(r,300)); }
    const mitPreis=!!S.preise&&(!istSubUid(myId())||subPreiseAn());
    const l=S.lohn[lohnDocId(id,myId())], c=l?calcLohn({...l,uid:myId()},mitPreis?preisFuer(myId(),S.preise,serieId(o)):{preise:Object.fromEntries(S.lohnPos.map(x=>[x.k,0]))}):null;
    if(!l||!Object.values(l.mengen||{}).some(v=>nn(v))) return toast("Bitte mindestens eine Position mit Menge eintragen",3000);
    if(!await confirmBox("Abrechnung abgeben?",`${c.lines.length} Position${c.lines.length>1?"en":""}${mitPreis?` · <b>${fmtEUR(c.total)}</b>`:""}<br>JD Brüder prüft und bestätigt sie – danach kannst du deine Rechnung schreiben. Ändern geht nach dem Abgeben nicht mehr.`,"Abgeben","ok")) return;
    const a={...(o.subAnteil?.[myId()]||{}),summe:c.total};
    const neu={...a,abgegebenAm:Date.now()}; await upd(P,{subAnteil:{[myId()]:neu}}); S.orders[id]={...S.orders[id],subAnteil:{...(o.subAnteil||{}),[myId()]:neu}};
    nachrichtSenden(id,`🤝 Meine Montageabrechnung ist fertig${mitPreis?` (${fmtEUR(a.summe)})`:""} – bitte prüfen und bestätigen.`); toast("Abgegeben ✓ – JD Brüder bekommt Bescheid",3000); render();
  });
  document.querySelectorAll("[data-anteil-ok]").forEach(b=>b.onclick=async()=>{ const u=b.dataset.anteilOk;
    if(!await confirmBox("Abrechnung bestätigen?",`Ist die Montageabrechnung von <b>${esc(nameOf(u))}</b> korrekt? Danach ist sie gesperrt und ${esc(nameOf(u))} kann die Rechnung schreiben.`,"Bestätigen","ok")) return;
    const neu={...(o.subAnteil?.[u]||{}),bestaetigtAm:Date.now(),bestaetigtVon:myId()}; await upd(P,{subAnteil:{[u]:neu}}); S.orders[id]={...S.orders[id],subAnteil:{...(o.subAnteil||{}),[u]:neu}};
    nachrichtSenden(id,`✓ Montageabrechnung von ${nameOf(u)} bestätigt – die Rechnung kann geschrieben werden.`); toast("Bestätigt ✓",2500); render(); });
}

/* ---------- Detail ---------- */
function viewDetail(id){
  const o=S.orders[id];
  if(!o||!sichtbar(o)) return `<button class="back" data-back>‹ Zurück</button><div class="empty">Auftrag nicht gefunden.</div>`;
  if(S.fotoFor!==id) subscribeFotos(id);
  const f=S.fin[id];
  const fotos=Object.values(S.fotos).filter(fotoMeins).sort((a,b)=>(a.am||0)-(b.am||0));
  const fk=k=>fotos.filter(x=>x.kat===k);
  const addr=adresseOf(o);
  const nav=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr)}`;
  const route=S.settings.firmenAdresse?`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(S.settings.firmenAdresse)}&destination=${encodeURIComponent(addr)}`:"";
  const reklas=Object.values(S.reklas).filter(r=>r.auftragId===id&&istMeins(r)).sort((a,b)=>b.am-a.am);
  const w=planWeek(o);
  const erl=phase(o)==="erledigt"||(phase(o)==="fertig"&&(berichtVerschickt(o)||berichtAbgegeben(o)));
  // Nicht verplant / Abholbereit: nur Kopf, Baustelle & Kunde, Unterlagen (+ Knopf „Terminieren“)
  const frueh=phase(o)==="offen"||phase(o)==="abholbereit";
  const nurAnsehen=phase(o)==="offen"; // Bereich „Neu“: nur ansehen – Nummer, Baustelle, Unterlagen
  // Laufender Einsatz: nur das Nötigste – Nummer, Bauvorhaben, Navi/Anrufen; ab Montagestart ohne Planung/Baustelle
  const imEinsatz=!istFertig(o) && phase(o)==="arbeit" && !!(o.einsatz?.abfahrtAm||(o.zeiten||[]).length) && can.einsatz() && !S.bearbeiten[id];
  const montageLaeuft=imEinsatz && !!(o.einsatz?.startAm||(o.zeiten||[]).length);
  // Fertiggestellt / Erledigt: nur Nummer, Stand (zu prüfen / erledigt), Bericht und Unterlagen
  const kompakt=(phase(o)==="fertig"||phase(o)==="erledigt") && !S.bearbeiten[id] && !(o.gemeinsam&&can.sub()) && !o.storniert;
  // Klappbare Karte: zu, bis man draufdrückt (Zustand bleibt beim Neuzeichnen erhalten)
  const fold=(key,titel,info,inhalt,offen=false)=>`<details class="card fold" data-fold="${id}:${key}" ${(S.fold[id+":"+key]??offen)?"open":""}><summary><b>${titel}</b><span class="small mute">${info||""}</span></summary><div class="foldin">${inhalt}</div></details>`;
  let h=`<button class="back" data-back>‹ ${can.mitarbeiter()?"Zurück":"Alle Aufträge"}</button>${kompakt||schritt(o)==="ankunft"&&S.fahrten[o.einsatz?.fahrtId]?.offen?"":fahrtLeiste()}`;
  if(S.bearbeiten[id]) h+=`<div class="banner warn" style="display:flex;align-items:center;gap:10px"><span style="flex:1">✏️ Bericht bearbeiten${o.aenderung?.status==="frei"&&o.aenderung.grund?`<br><span class="small">Änderung: ${esc(o.aenderung.grund)}</span>`:""}</span><button class="btn sm ok" id="bearbFertig">✓ ${o.aenderung?.status==="frei"&&!can.planen()?"Änderung abgeben":"Fertig"}</button></div>`;
  if(o.storniert) h+=`<div class="banner bad"><b>❌ Auftrag storniert</b>${o.storniert.am?" am "+fmtDT(o.storniert.am):""}${o.storniert.quelle==="mail"?" (laut Mail von meta)":o.storniert.von?" von "+esc(nameOf(o.storniert.von)):""}.${o.storniert.grund?`<div class="small" style="margin-top:4px;white-space:pre-wrap">${esc(o.storniert.grund)}</div>`:""}${can.planen()?`<div style="margin-top:8px"><button class="btn sm" id="stornoAuf">Storno aufheben</button></div>`:""}</div>`;

  // Kopf
  if(imEinsatz) h+=`<div class="card ek"><div class="ek-t"><b>${esc(o.nr)}</b>${o.bauvorhaben?` <span>${esc(o.bauvorhaben)}</span>`:""}</div>
     <div class="kopf-akt">${addr?`<a class="btn" href="${esc(navUrl(addr))}" target="_blank" rel="noopener">🧭 Navi</a>`:""}${o.bauleiterTel?`<a class="btn" href="tel:${esc(o.bauleiterTel.replace(/[^\d+]/g,""))}">📞 Anrufen</a>`:""}${!can.sub()?`<button class="btn" id="subDazu">👷 Subunternehmer hinzufügen</button>`:""}</div>
     ${can.planen()&&(o.monteure||[]).length?`<details class="mini-f" style="margin-top:6px"><summary>📝 Bericht schreibt: ${schreiberVon(o)?esc(schreiberVon(o)===myId()?"Ich":nameOf(schreiberVon(o))):"jeder"}</summary>${berichtSchreiberHtml(o)}</details>`
       :schreiberVon(o)?`<div class="small mute" style="margin-top:6px">📝 Bericht schreibt: <b>${esc(schreiberVon(o)===myId()?"du":nameOf(schreiberVon(o)))}</b></div>`:""}
     ${(o.monteure||[]).filter(u=>u!==myId()).length?`<div class="small mute" style="margin-top:6px">🤝 Mit dabei: ${[...new Set((o.monteure||[]).filter(u=>u!==myId()).map(u=>{ const n=nameOf(u); return n==="Jemand"?"JD Brüder":n; }))].map(esc).join(", ")}</div>`:""}</div>`;
  else h+=`<div class="card"><div class="row between"><div><div class="big">${esc(o.nr)}</div><div style="font-weight:650">${esc(o.bauvorhaben||"")}</div><div class="mute small">${esc(o.plzOrt||"")}</div></div>
     <div style="text-align:right"><div class="chip ${w.kw===NOW.kw&&w.jahr===NOW.jahr?"gold":""}">KW ${esc(o.kw||"?")}${o.jahr?"/"+esc(o.jahr):""}</div>${o.kabinen&&o.kabinen!=="0"?`<div class="small mute" style="margin-top:4px">${esc(o.kabinen)} Kabinen</div>`:""}</div></div>
     <div class="chips" style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px">${orderChips(o)}</div>
     ${kompakt||nurAnsehen?"":`<div class="kopf-akt">
     ${frueh&&can.planen()?`<button class="btn pri" id="terminieren">📅 Terminieren</button>`:""}
     ${addr?`<button class="btn ${frueh?"":"pri"}" data-zur-baustelle="${esc(id)}">🧭 Zur Baustelle</button>`:`<button class="btn" data-dok="1">📄 Adresse im Dokument</button>`}
     ${o.bauleiterTel?`<a class="btn" href="tel:${esc(o.bauleiterTel.replace(/[^\d+]/g,""))}">📞 Anrufen</a>`:fk("unterlagen").length?`<button class="btn" data-dok="1">📄 Telefon im Dokument</button>`:""}
     ${can.planen()&&!erl&&!o.storniert&&o.terminStatus!=="fest"?`<button class="btn" id="terminAnfrage">📧 Termin anfragen</button>`:""}
     ${frueh&&can.planen()&&phase(o)==="abholbereit"?`<button class="btn ghost" data-nv="${esc(id)}">↩ nach „Neu“</button>`:""}
     ${frueh&&can.planen()&&o.nichtVerplant&&o.prodStatus==="abholbereit"?`<button class="btn ghost" data-nv-zurueck="${esc(id)}">✓ Wieder abholbereit</button>`:""}
     </div>`}
     ${!kompakt&&!nurAnsehen&&((addr&&unsicher(o,"adresse"))||(o.bauleiterTel&&unsicher(o,"bauleiterTel")))?`<div class="small" style="margin-top:8px;color:var(--warn)">⚠️ ${[addr&&unsicher(o,"adresse")?"Adresse":"",o.bauleiterTel&&unsicher(o,"bauleiterTel")?"Telefonnummer":""].filter(Boolean).join(" und ")} beim Auslesen unsicher – <a href="#" data-dok="1">bitte im Dokument prüfen</a>.</div>`:""}</div>`;

  if(kompakt) h+=abschlussStand(o,f,reklas);
  if(!kompakt&&!nurAnsehen&&!imEinsatz) h+=terminAnfrageKarte(o);
  // Eingeteilte: Termin bestätigen
  if(!erl && !imEinsatz && terminOffenFuerMich(o)) h+=`<div class="card tbest"><div style="font-weight:750;font-size:16px">📅 ${esc(langDatum(o.termin))} – passt der Termin?</div>
     <div class="small mute" style="margin-top:2px">JD Brüder sieht deine Antwort sofort.</div>
     <div class="grid2" style="margin-top:10px"><button class="btn ok" id="tOk">👍 Passt</button><button class="btn" id="tNein">✋ Passt nicht</button></div></div>`;
  if(!nurAnsehen && ((!kompakt&&!imEinsatz)||ungelesen(o.id))) h+=nachrichtenKarte(o);

  // Planung: Datum eintragen (= terminiert), Auftrag zuteilen, ggf. stornieren
  const knoepfe=[]; // kleine Knöpfe nebeneinander, gehen beim Antippen auf
  const sk=(key,icon,titel,info,inhalt,extra="")=>`<details class="card fold sk" data-fold="${id}:${key}" ${S.fold[id+":"+key]?"open":""} ${extra}><summary><b>${icon} ${titel}</b><span class="small mute">${info||""}</span></summary><div class="foldin">${inhalt}</div></details>`;
  if(kompakt && (o.abschluss||o.bericht||o.berichtStatus)) knoepfe.push(`<button class="card fold sk ber-k" id="berichtAnsehen"><b>${o.berichtTyp==="leerfahrt"?"↩ Leerfahrt":istReklaAuftrag(o)?"🛠 Reklamationsbericht":"📄 Montagebericht"}</b><span class="small mute">ansehen · Bilder</span></button>`);
  if(!erl && !frueh && !kompakt && !montageLaeuft) knoepfe.push(sk("planung","📅","Planung",[o.termin?kurzDatum(o.termin):"kein Termin",(o.monteure||[]).length?`${(o.monteure||[]).length} 👷`:""].filter(Boolean).join(" · "),`
    <label class="f" style="margin-top:0">Termin</label>
    ${can.planen()?`<input type="date" class="i" id="terminDatum" value="${o.termin?new Date(o.termin).toISOString().slice(0,10):""}">`:`<div style="font-weight:600">${o.termin?new Date(o.termin).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}):`<span class="mute">noch nicht terminiert</span>`}</div>`}
    ${o.prodStatus==="abholbereit"&&o.abholbereitBestaetigt?`<div class="small" style="margin-top:6px;color:var(--ok)">✓ Von meta als abholbereit bestätigt: <b>${esc(o.abholbereitBestaetigt.name)}</b>, ${fmtDT(o.abholbereitBestaetigt.am)}</div>`:""}
    <label class="f">Auftrag zuteilen</label>
    ${can.planen()&&(o.monteure||[]).length?`<label class="f">📝 Montagebericht schreibt</label>${berichtSchreiberHtml(o)}<div class="small mute" style="margin-top:4px">Nur diese Person (und du) kann den Bericht fertig schreiben – sie bekommt Bescheid.</div>`:""}
    <div class="row" id="monteure">${(o.monteure||[]).map(m=>`<span class="chip ${o.termin&&o.terminStatus==="fest"?(terminBestaetigt(o,m)?"ok":"warn"):"info"}" title="${o.termin&&o.terminStatus==="fest"?(terminBestaetigt(o,m)?"Termin bestätigt":"Termin noch nicht bestätigt"):""}">👷 ${esc(nameOf(m))}${o.termin&&o.terminStatus==="fest"?(terminBestaetigt(o,m)?" ✓":" · ⏳"):""}${can.planen()?` <button data-rm-m="${esc(m)}" style="border:0;background:none;cursor:pointer;color:inherit">✕</button>`:""}</span>`).join("")||`<span class="mute small">noch niemand zugeteilt</span>`}
    ${can.planen()?`<button class="btn sm ghost" id="addMonteur">＋ zuteilen</button>`:""}</div>
    ${can.planen()&&o.terminStatus==="fest"&&o.termin?`<button class="btn sm ghost" id="kalBtn" style="margin-top:10px">📅 ${o.kalender?.termin===o.termin?"Im Google Kalender ✓ – erneut senden":"In Google Kalender eintragen"}</button>`:""}
    ${can.planen()&&SERIEN().length&&!o.einsatz?.fertigAm?serieWahl(o,true):""}
    ${can.planen()&&(o.monteure||[]).some(m=>S.roles[m]==="sub")?`<label class="gem-k"><input type="checkbox" id="gemeinsam" ${o.gemeinsam?"checked":""}><span><b>🤝 Zusammen mit dem Subunternehmer</b><span class="small mute" style="display:block">Jeder trägt nur ein, was er selbst montiert hat – der Sub unter „Mein Anteil“. Im Bericht an meta wird alles zusammengezählt; den schickst du.</span></span></label>`:""}
    ${can.planen()&&!o.storniert?`<button class="btn sm ghost" id="stornoSetzen" style="margin-top:12px;color:var(--bad)">❌ Auftrag als storniert markieren</button>`:""}
  `));

  // Baustelle
  const kv=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:"";
  const bauInhalt=`${can.planen()?`<div style="text-align:right;margin-bottom:6px"><button class="btn sm ghost" id="editBau">Bearbeiten</button></div>`:""}
   ${adresseKontakte(o)}
   ${achtungTeil(o)}
   <details class="bau-mehr" data-fold="${id}:baumehr" ${S.fold[id+":baumehr"]?"open":""}><summary>Mehr zur Baustelle <span class="mute">– Geschosse, Aufbau, Hinweise, Anlagen …</span></summary>
   <dl class="kv">
   ${kv("Land",`${LAENDER[landOf(o)].join(" ")}${o.land?"":` <span class="mute small">(erkannt)</span>`}`)}
   ${kv("Geschosse",esc(o.geschosse||""))}
   ${kv("Öffnungszeiten",esc(o.oeffnungszeiten||""))}
   ${kv("Aufzug",esc(o.aufzug||""))}
   ${kv("Was aufbauen",esc(o.aufbau||""))}
   ${kv("Montagehinweise",esc(o.montageHinweise||""))}
   ${kv("Techn. Hinweise",esc(o.technHinweise||""))}
   ${kv("Kaufm. Hinweise",esc(o.kaufmHinweise||""))}
   ${kv("Auftraggeber",esc(o.zahlungspflichtiger||""))}
   ${kv("Vorgang",esc(o.vorgang||""))}
   ${kv("meta-Berater",esc(o.berater||""))}
   </dl>
   ${dokInfoTeil(o)}
   ${o.zusageMail?.viewUrl&&S.isOwner?`<div style="margin-top:10px"><a class="small" href="${esc(o.zusageMail.viewUrl)}" target="_blank" rel="noopener">Montagezusage-Mail in Gmail öffnen ↗</a></div>`:""}
   </details>
   ${!o.bauleiterName&&!o.adresse?`<div class="banner info" style="margin:10px 0 0">Die genauen Baustellendaten stehen auf dem Aufmaß-Deckblatt. ${can.planen()?"Lade das Deckblatt unten bei „Unterlagen“ hoch oder hol es aus der Mail – die App liest es dann aus.":""}</div>`:""}
  `;
  if(!kompakt && !montageLaeuft) knoepfe.push(sk("bau","🏗","Baustelle",esc(o.plzOrt||(addr||"").split(",").pop()||""),bauInhalt));

  // Unterlagen
  const unterInhalt=`${fk("unterlagen").length?`<button class="btn ok block" id="unterPdf" style="margin-bottom:10px">📑 Unterlagen als PDF <span style="font-weight:500;opacity:.85">– mit Übersicht vorne</span></button>`:""}
   ${thumbs(fk("unterlagen"),"unterlagen",can.planen())}
   ${dokListe(o)?`<div style="margin-top:8px">${dokListe(o)}</div>`:""}
   <div class="row" style="margin-top:10px">
   ${can.planen()&&(S.isOwner&&S.sync||S.sample)&&fk("unterlagen").length?`<button class="btn sm ghost" id="readDeck">🔎 ${o.dokInfo?"Unterlagen neu auslesen":"Alle Unterlagen auslesen"}</button>`:""}
   ${can.mails()&&o.zusageMail?.att?.length?`<button class="btn sm ghost" id="mailUnterlagen">✉︎ Unterlagen aus Mail holen</button>`:""}
   </div>`;
  knoepfe.push(sk("unter","📂","Unterlagen",`${fk("unterlagen").length} Datei${fk("unterlagen").length===1?"":"en"}`,unterInhalt,'id="unterlagenCard"'));
  h+=`<div class="det-grid" style="grid-template-columns:repeat(${knoepfe.length},minmax(0,1fr))">${knoepfe.join("")}</div>`;

  // Sub: Bericht fehlt (angefordert oder Montagetag vorbei)
  if(can.sub() && (o.monteure||[]).includes(myId()) && subBerichtFehlt(o,myId())){ const ang=o.berichtFehlt?.[myId()];
    h+=`<div class="banner warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>📝 Dein Montagebericht fehlt</b><div class="small">${ang?`JD Brüder hat ihn am ${fmtDT(ang.am)} angefordert. `:""}Du bist hier als Monteur eingeteilt – bitte schreib deinen Bericht selbst und gib ihn ab.</div></div><button class="btn sm pri" id="zumBericht">Jetzt schreiben ›</button></div>`; }
  // Einsatz-Ablauf: Abfahrt → Ankunft → Vorher-Fotos → Montagebereit → Montagestart → Bericht → Sichtabnahme → Versand
  if(kompakt){ if(!can.planen() && o.nachgetragen?.[myId()]) h+=anteilKarte(o); }
  else if(o.gemeinsam && can.sub()){
    if(!frueh) h+=anteilKarte(o);
  } else if((erl || berichtGesperrt(o) || berichtAbgegeben(o)) && !(S.bearbeiten[id]&&aenderungFrei(o))){
    const stand=o.bestaetigtAm?`bestätigt am ${fmtDT(o.bestaetigtAm)} – nicht mehr änderbar`:o.berichtStatus==="gesendet"?"an meta gesendet – nicht mehr änderbar":o.berichtStatus==="pruefung"?"abgegeben – wartet auf Bestätigung durch JD Brüder":"fertig – nicht mehr änderbar";
    if(o.abschluss||o.bericht) h+=`<button class="card fold foldbtn" id="berichtAnsehen" style="width:100%;text-align:left;border:0;cursor:pointer"><b>📄 Montagebericht</b><span class="small mute">ansehen · ${stand}</span></button>`;
  } else if(can.einsatz() && !frueh){
    h+=einsatzCard(o,fk);
    const st=schritt(o);
    if(!darfBericht(o) && ["bericht","rekla","abnahme"].includes(st)){ /* Bericht schreibt jemand anderes */ }
    else if(st==="bericht"){
      h+=berichtCard(o,fk);
      h+=berichtFertigCard(o,fk);
      h+=vordruckCard(o);
    } else if(st==="rekla"||st==="abnahme"){
      h+=vordruckCard(o);
    } else if(st==="fertig"){
      h+=berichtCard(o,fk);
      h+=abnahmeTeil(o,fk);
      h+=vordruckCard(o);
    }
  }

  // Chef: alle Positionen aller Monteure zusammen
  if(can.planen() && !frueh) h+=gesamtKarte(o);
  // Berichte der Subunternehmer: wer hat abgegeben, wem fehlt er – mit „Bericht anfordern“
  if(can.planen() && !o.storniert && subsVon(o).length && (o.termin||istFertig(o))) h+=subBerichtKarte(o);
  // Anteil des Subunternehmers (gemeinsamer Auftrag) – nur für die Abrechnung, geht nicht an meta
  if((o.gemeinsam||o.nachgetragen) && can.planen() && !frueh && (!kompakt||anteilOffen(o)||Object.keys(o.nachgetragen||{}).some(u=>!o.subAnteil?.[u]?.bestaetigtAm))) h+=anteilChefKarte(o);

  // Bericht-Versand (beim gemeinsamen Auftrag sieht der Sub nur seinen Anteil)
  if(o.gemeinsam && can.sub()){ /* nichts – der Bericht an meta kommt vom Chef */ }
  else if(o.berichtStatus==="pruefung" && (can.planen()||!kompakt)){
    h+=`<div class="card" style="border-left:5px solid var(--accent)"><h3>${can.planen()?"Bericht prüfen":"Montagebericht"}</h3>
     ${can.planen()?(()=>{ const sl=S.lohn[lohnDocId(o.id,o.berichtVonSub)]; const sc=sl&&subPreiseAn()?calcLohn(sl,S.preise):null; const meta=can.finanzen()&&S.fin[o.id]?Number(S.fin[o.id].summe)||0:null;
       return `<div class="banner warn">Bericht von <b>${esc(nameOf(berichtVonWem(o)))}</b> – bitte prüfen (Fotos, Mengen, Montagebericht &amp; Sichtabnahme). ${kompakt?"Ändern geht über „Bericht ansehen → ✏️ Bericht bearbeiten“.":"Du kannst oben noch alles ändern."} Nach deiner Bestätigung ist der Bericht <b>gesperrt</b>${o.berichtVonSub?", und der Subunternehmer darf seine Rechnung schreiben":""}.</div>
       ${sc?`<div class="grid3" style="text-align:center;margin-bottom:10px"><div style="background:var(--greybg);border-radius:10px;padding:8px"><div class="small mute">Sub berechnet</div><b>${fmtEUR(sc.total)}</b></div><div style="background:var(--greybg);border-radius:10px;padding:8px"><div class="small mute">meta zahlt</div><b>${meta!=null?fmtEUR(meta):"–"}</b></div><div style="background:${meta!=null&&meta-sc.total<0?"var(--badbg)":"var(--okbg)"};border-radius:10px;padding:8px"><div class="small mute">Gewinn</div><b>${meta!=null?fmtEUR(r2(meta-sc.total)):"–"}</b></div></div>
       <div class="small mute" style="margin-bottom:8px">${sc.lines.map(z=>`${z.menge!==""?String(z.menge).replace(".",",")+"× ":""}${esc(z.label)} ${fmtEUR(z.gp)}`).join(" · ")} – Mengen kannst du unter „Positionsergänzung“ korrigieren.</div>`:""}
       <button class="btn ok block" id="subFrei">✓ Alles korrekt – Bericht bestätigen</button>`; })():`<div class="banner info">✓ Dein Bericht ist abgegeben und liegt bei JD Brüder zur Prüfung. Ändern geht jetzt nicht mehr. Du bekommst eine Nachricht, sobald er bestätigt ist${can.sub()?" – dann kannst du deine Rechnung schreiben":""}.</div>`}</div>`;
  } else if((erl||frueh||kompakt) && o.berichtStatus==="gesendet"){
    // erledigt und an meta gesendet – nichts mehr zu tun
  } else if(kompakt && !can.planen()){
    // steht im „Stand“
  } else if(o.berichtStatus && !can.planen()){
    h+=`<div class="card"><h3>Montagebericht</h3>${o.bestaetigtAm||o.subGeprueftAm?`<div class="banner ok">✓ Von JD Brüder bestätigt am ${fmtDT(o.bestaetigtAm||o.subGeprueftAm)}${o.berichtStatus==="gesendet"?" und an meta übermittelt":""}. Nicht mehr änderbar.${can.sub()?" Du kannst jetzt deine Rechnung schreiben.":""}</div>`:o.berichtStatus==="gesendet"?`<div class="banner ok">✓ An meta übermittelt. Nicht mehr änderbar.</div>`:`<div class="banner info">Bericht ist fertig und wartet auf JD Brüder.</div>`}</div>`;
  } else if(o.berichtStatus){
    h+=`<div class="card"><h3>Bericht an meta</h3>
     ${o.bestaetigtAm?`<div class="small" style="color:var(--ok);margin-bottom:6px">✓ Bestätigt am ${fmtDT(o.bestaetigtAm)} – Bericht ist gesperrt</div>`:""}
     ${o.berichtStatus==="gesendet"?`<div class="banner ok">Gesendet am ${fmtDT(o.berichtGesendetAm)} an ${esc(o.berichtAn||"")}</div>`:`<div class="banner warn">Bericht ist fertig und wartet auf Versand${can.senden()?"":" durch den Chef"}.</div>`}
     ${o.berichtStatus!=="gesendet"&&!abnahmeOk(o)&&o.berichtTyp!=="leerfahrt"?`<div class="small mute" style="margin-bottom:8px">Die Sichtabnahme steht noch aus – der Bericht kann trotzdem schon verschickt werden. Eine Woche nach dem Versand erinnert die App, falls dann noch keine Sichtabnahme vorliegt.</div>`:""}
     ${can.senden()?`<button class="btn pri block" id="sendBericht">✉︎ ${o.berichtStatus==="gesendet"?"Erneut senden":"Bericht abschicken"}</button>`:""}
     ${S.isOwner&&!S.mcp?`<div class="small mute">Gmail ist noch nicht eingerichtet.</div>`:""}</div>`;
  }
  if(istFertig(o) && (can.einsatz()||can.produktion()) && !(o.gemeinsam&&can.sub()) && (!kompakt||!abnahmeOk(o)&&o.berichtTyp!=="leerfahrt")) h+=abnahmeCard(o);

  // Reklamationen
  if(kompakt){
    const off=reklas.filter(r=>r.offen);
    if(off.length) h+=fold("rekla","⚠ Offene Reklamationen",`${off.length} offen`,reklas.map(reklaItem).join(""));
  } else if(erl){
    if(reklas.length) h+=fold("rekla","Reklamationen",`${reklas.filter(r=>r.offen).length} offen`,`${can.einsatz()||can.reklaErledigen()?`<div style="text-align:right"><button class="btn sm ghost" id="newRekla">＋ Reklamation</button></div>`:""}${reklas.map(reklaItem).join("")}`,reklas.some(r=>r.offen));
  } else if(!frueh && !imEinsatz && (reklas.length||can.einsatz())){
    h+=`<div class="card"><div class="row between"><h3 style="margin:0">Reklamationen</h3>${can.einsatz()||can.reklaErledigen()?`<button class="btn sm ghost" id="newRekla">＋ Reklamation</button>`:""}</div>
      ${reklas.length?reklas.map(reklaItem).join(""):`<div class="small mute" style="margin-top:8px">Keine.</div>`}</div>`;
  }

  // Finanzen (nur Chef/Admin)
  // Abrechnung nur bei erledigten Aufträgen zeigen
  if(can.finanzen() && erl && (!kompakt||f)){ const st=f?(f.rechnungStatus||"offen"):"";
    h+=fold("abr","💶 Abrechnung",f?`${fmtEUR(f.summe)} · ${RECHNUNG[st][0]}`:"noch keine Abrechnung von meta",finanzCard(o,f).replace(/^<div class="card"><h3>Abrechnung \(nur für dich sichtbar\)<\/h3>/,"<div>")); }
  return h;
}

function abschlussStand(o,f,reklas){
  const chef=can.planen(), titel=o.berichtTyp==="leerfahrt"?"Leerfahrt-Bericht":istReklaAuftrag(o)?"Reklamationsbericht":"Montagebericht", a=o.abschluss||{};
  const zeile=(st,txt,sub="")=>`<div class="ab-z ${st}"><span class="ab-i">${st==="ok"?"✓":st==="bad"?"!":"•"}</span><div><b>${txt}</b>${sub?`<div class="small mute">${sub}</div>`:""}</div></div>`;
  let z="";
  if(o.abschluss) z+=zeile("ok",a.typ==="rekla"?"Montage abgeschlossen – mit Reklamation":"Montage abgeschlossen",`${fmtDT(a.am)}${a.by?" · "+esc(nameOf(a.by)):""}`);
  if(o.berichtStatus==="gesendet") z+=zeile("ok",`${titel} an meta gesendet`,`${o.berichtGesendetAm?fmtDT(o.berichtGesendetAm):""}${o.berichtAn?" · "+esc(o.berichtAn):""}`);
  else if(o.berichtStatus==="pruefung") z+=zeile("warn",chef?`${titel} prüfen`:`${titel} wird von JD Brüder geprüft`,o.berichtVon?"von "+esc(nameOf(berichtVonWem(o))):"");
  else if(o.bestaetigtAm) z+=zeile(chef?"warn":"ok",chef?`${titel} bestätigt – noch an meta senden`:`${titel} bestätigt`,fmtDT(o.bestaetigtAm));
  else if(o.berichtStatus) z+=zeile("warn",chef?`${titel} noch an meta senden`:`${titel} fertig – wartet auf Versand`);
  if(o.abschluss && o.berichtTyp!=="leerfahrt"){ const ab=abnahmeStatus(o);
    z+=ab==="ok"?zeile("ok","Sichtabnahme unterschrieben",o.unterschrift?`${esc(o.unterschrift.name||"")} · ${fmtDT(o.unterschrift.am)}`:o.abnahmeDatei?"hochgeladen":"auf Papier")
      :ab==="versendet"?zeile("warn","Sichtabnahme beim Kunden – wartet",`Frist bis ${new Date(o.abnahmeAnfrage.frist).toLocaleDateString("de-DE")}`)
      :ab==="verzicht"?zeile("ok","Sichtabnahme nicht angefordert"):zeile(abnahmeFaellig(o)?"bad":"warn","Sichtabnahme fehlt"); }
  const off=reklas.filter(r=>r.offen).length; if(reklas.length) z+=zeile(off?"warn":"ok",off?`${off} Reklamation${off>1?"en":""} offen`:"Reklamationen erledigt");
  z+=abgerechnet(o)?zeile("ok","Vergütung von meta erhalten",[o.abgerechnetMit?"Abrechnung "+esc(o.abgerechnetMit):"",can.finanzen()&&f?fmtEUR(f.summe):""].filter(Boolean).join(" · ")):zeile("warn","Vergütung von meta steht noch aus");
  const ae=o.aenderung;
  if(ae?.status==="angefragt") z+=`<div class="ab-z warn"><span class="ab-i">✏️</span><div style="flex:1"><b>${chef?`${esc(nameOf(ae.von))} möchte ${ae.art==="anteil"?"den Anteil":"den Bericht"} ändern`:"Änderung angefragt – wartet auf Freigabe"}</b><div class="small mute">„${esc(ae.grund||"")}“ · ${fmtDT(ae.am)}</div>

  else if(ae?.status==="frei" && ae.von===myId()) z+=`<div class="ab-z ok"><span class="ab-i">✏️</span><div style="flex:1"><b>Änderung freigegeben</b><div class="small mute">Du kannst jetzt bearbeiten.</div><button class="btn sm ok" id="aendLos" style="margin-top:6px">✏️ Jetzt bearbeiten</button></div></div>`;
  return `<div class="card ab-k"><div class="ab-liste">${z}</div>${chef?`<button class="btn sm ghost block" id="mitDazu" style="margin-top:8px">👷 Mitmonteur / Subunternehmer dazunehmen</button>`:""}</div>`;
}

  if(st==="abnahme") return istReklaAuftrag(o)?{bericht:{fertigAm:null}}:{bericht:{reklaFertig:null,abnahmeFrage:null}};
  if(!o.einsatz||istFertig(o)) return null;
  if(st==="ankunft") return {einsatz:{fahrzeug:null,fahrzeugText:null,abfahrtAm:null}};
  if(st==="start") return {einsatz:{ankunftAm:null}};
  if(st==="vorher") return {einsatz:{startAm:null},zeiten:(o.zeiten||[]).filter(z=>z.s<(e.startAm||0))};

  return null;
}

function schreiberVon(o){ const subs=subsVon(o); if(!o?.gemeinsam && subs.length && !subs.includes(o.berichtSchreiber)) return subs[0]; return o?.berichtSchreiber||null; }

function fehlendeAngaben(o,fk){
  const b=o.bericht||{}, r=[];
  if(leer(b.personen)) r.push({t:"Personen vor Ort fehlen",soft:true});
  if(leer(b.istKm)) r.push({t:"Kilometer fehlen",soft:true});
  if(leer(b.geschosse) && !istReklaAuftrag(o)) r.push({t:"Geschosse fehlen"});
  if(sonderFertig(b).some(x=>!nn(x.personen)||!x.min)) r.push({t:"Mehraufwand: Personen und Stunden angeben"});
  if(!uebernachtet(b)) r.push({t:"Übernachtung? (Ja/Nein) nicht angegeben",soft:true});
  else if(uebernachtet(b)==="ja" && (!(b.naechte||[]).length || b.naechte.some(x=>!x.datum||!nn(x.personen)))) r.push({t:"Übernachtung: Tag und Personen je Nacht angeben"});
  if(istReklaAuftrag(o)){
    if(leer(b.taetigkeit)) r.push({t:"Reklamationsbericht: Was wurde gemacht?"});
    if(!(arbeitszeitMin(o)>0)) r.push({t:"Arbeitszeit fehlt"});
  } else {
    if(SERIEN().length && !serieId(o)) r.push(can.planen()?{t:"Serie fehlt (oben im Montagebericht wählen)"}:{t:"Serie fehlt – JD Brüder legt sie noch fest",soft:true});
    if(S.lohnPos.length && !Object.keys(summeMengen(o)).length) r.push({t:"Keine Positionen im Montagebericht eingetragen"});
  }
  if(fk && !fk("vorher").length && !o.einsatz?.vorherSkip) r.push({t:"Vorher-Fotos fehlen",soft:true});
  if(fk && !fk("nachher").length) r.push({t:"Fotos nach der Montage fehlen"});
  if(!abnahmeOk(o)) r.push({t:"Sichtabnahme fehlt (Bericht kann trotzdem verschickt werden)",soft:true});
  return r;
}

/* ---------- Akkord / Montagebericht Mitarbeiter ---------- */
const nn = v => { const x=parseFloat(String(v??"").replace(",",".")); return isNaN(x)?0:x; };
const r2 = x => Math.round(x*100)/100;
function lohnDocId(oid,uid){ return oid+"__"+uid; }
// Subunternehmer mit eigener Preisliste sehen nur deren Positionen; Chef und Mitarbeiter sehen alle
const posFuer=(P)=>!can.planen() && can.sub() && P && Object.keys(P.preise||{}).length ? S.lohnPos.filter(x=>nn(P.preise[x.k])>0) : S.lohnPos;
// Serien (Anlagentypen) mit eigener Preisliste: einstellungen/allgemein.serien = [{id,name,typen,pos:[…]}]; Preise: „std“ = lohn/preise, sonst lohn/preise.listen[id]
const SERIEN=()=>Array.isArray(S.settings?.serien)&&S.settings.serien.length?S.settings.serien:[];
// Serie aus den Unterlagen erkennen (Modell der Anlagen: „30 RW Standard“ → Serie 30, „13 RP“ → Serie 13, „30 KG-LF“ → KIGA, „40 FB“ → Design 40)
const SERIE_RX=/\b(?:serie|design)?\s*(13|30|40)\s*-?\s*(KG|RP|RS|RF|BS|RW|NR|FT|FN|FB)\b|\b(?:serie|design)\s*(13|30|40)\b|\b(kiga|kita)\b/i;
const istKitaSerie=x=>/kiga|kita/i.test(x?.name||"");
function serieAusText(t){ const L=SERIEN(); if(!L.length||!t) return null; const m=String(t).match(SERIE_RX); if(!m) return null;
  const nr=m[1]||m[3], code=(m[2]||"").toUpperCase();
  if(m[4]||code==="KG") return L.find(istKitaSerie)?.id||null;
  const kand=L.filter(x=>!istKitaSerie(x) && new RegExp("\\b"+nr+"\\b").test(x.name||"")); if(!kand.length) return null;
  return (code&&kand.find(x=>new RegExp("\\b"+code+"\\b","i").test(x.typen||""))||kand[0]).id; }
function serieErkannt(o){ const st={}; for(const a of (Array.isArray(o?.dokInfo?.anlagen)?o.dokInfo.anlagen:[])){ const id=serieAusText(a.modell)||serieAusText(a.besonderes); if(id) st[id]=(st[id]||0)+(parseInt(a.kabinen)||1); }
  const best=Object.entries(st).sort((a,b)=>b[1]-a[1])[0]; return best?best[0]:null; }
// Gilt: vom Chef festgelegt, sonst aus den Unterlagen erkannt
const serieId=o=>o?.serie||serieErkannt(o)||null;
const serieVon=o=>{ const id=serieId(o); return id?SERIEN().find(x=>x.id===id)||null:null; };
const serieName=o=>{ const x=serieVon(o); return x?`${x.name}${x.typen?` (${x.typen})`:""}`:""; };
// Sub-Preise erst anzeigen, wenn JD Brüder sie freigibt (Setup → Preislisten)
const subPreiseAn=()=>!!S.settings?.subPreiseAktiv;
const istSubUid=u=>S.roles?.[u]==="sub";
// Preisliste je Serie. Subunternehmer: Chef-Preis der Serie minus Abschlag (Standard 30 %) je Position
function preisFuer(uid,P=S.preise,serie){ if(!P) return null;
  const L=serie&&serie!=="std"&&P.listen?.[serie]?P.listen[serie]:P;
  if(P.fuerSub || !istSubUid(uid)) return L; // fuerSub: Kopie auf dem Handy des Subs ist schon umgerechnet
  return subListe(P,L); }

  const lines=[]; const pr=P.preise||{};

function zeigeVorschlag(m,o,r,text,close){
  r=r||{}; const rows=[]; const lbl=k=>(S.lohnPos.find(p=>p.k===k)||{}).label||k;
  if(r.personenVorOrt!=null&&r.personen==null) r.personen=r.personenVorOrt;
  const B={taetigkeit:"Was wurde gemacht",personen:"Personen vor Ort",personenMit:"Mitgefahrene Personen",istKm:"Selbst gefahrene km",geschosse:"Geschosse (Material getragen)",uebernachtungen:"Übernachtungen",bemerkung:"Weitere Bemerkungen"};
  const nl=Array.isArray(r.naechte)?r.naechte.filter(x=>x&&(x.datum||x.personen!=null)):[];
  if(nl.length||nn(r.uebernachtungen)>0){ const n=naechteBauen(o,r.uebernachtungen,nl); rows.push({t:"n",label:"Übernachtungen",v:naechteText({uebernachtet:"ja",naechte:n}),n}); delete r.uebernachtungen; }
  Object.keys(B).forEach(k=>{ if(!leer(r[k])) rows.push({t:"b",k,label:B[k],v:String(r[k])}); });
  Object.entries(r.mengen||{}).forEach(([k,v])=>{ if(nn(v)&&S.lohnPos.some(p=>p.k===k)) rows.push({t:"m",k,label:lbl(k),v:String(v)}); });
  (Array.isArray(r.sonder)?r.sonder:[]).forEach(s=>{ if(!leer(s?.arbeit)) rows.push({t:"s",label:"Sonderleistung",v:`${s.arbeit} – ${s.personen||1} Pers. × ${String(s.stunden??"?").replace(".",",")} Std.`,s}); });
  const res=m.querySelector("#res");
  if(!rows.length && !r.reklamation){ res.innerHTML=`<div class="banner warn" style="margin-top:10px">Ich habe nichts Eindeutiges gefunden. Sag es nochmal etwas genauer.</div>`; return; }
  res.innerHTML=`<div class="card" style="margin-top:12px;background:var(--okbg);border-color:#bfe3cc"><b>Das trage ich ein:</b> <span class="small mute">(Haken entfernen, was nicht stimmt – danach kannst du alles im Bericht korrigieren)</span>
   ${rows.map((x,i)=>`<label class="row" style="flex-wrap:nowrap;padding:6px 0;border-bottom:1px solid #d6ecdd;align-items:flex-start"><input type="checkbox" checked data-ri="${i}" style="width:20px;height:20px;margin-top:2px"><div style="flex:1"><div class="small mute">${esc(x.label)}${x.t==="m"?" · Positionsergänzung":""}</div><div>${esc(x.v)}</div></div></label>`).join("")}
   ${r.reklamation?`<div class="banner warn small" style="margin:8px 0 0">⚠ Problem erwähnt: „${esc(r.reklamation)}“ – bitte beim Abschluss über „Montage mit Reklamation“ (mit Fotos) erfassen.</div>`:""}</div>`;
  const btns=m.querySelector("#btns"); btns.innerHTML=`<button class="btn" data-close2>Abbrechen</button><button class="btn ok" id="apply">✓ Übernehmen</button>`;
  btns.querySelector("[data-close2]").onclick=close;
  btns.querySelector("#apply").onclick=async()=>{
    const sel=[...res.querySelectorAll("[data-ri]:checked")].map(c=>rows[+c.dataset.ri]);
    const b={}, l={mengen:{}}, cur=(S.orders[o.id]||o).bericht||{}; const sonder=[];
    sel.forEach(x=>{
      if(x.t==="b"){
        if(x.k==="taetigkeit"||x.k==="bemerkung"){ const alt=cur[x.k]; b[x.k]=alt&&!alt.includes(x.v)?alt+"\n"+x.v:x.v; }
        else if(x.k==="arbeitszeit"){ const mn=parseMin(x.v); if(mn) b.arbeitszeitMin=mn; }
        else if(x.k==="uebernachtungen"){ if(nn(x.v)===0){ b.uebernachtet="nein"; b.naechte=[]; b.uebernachtungen="0"; } }
        else b[x.k]=x.v;
      } else if(x.t==="n"){ b.uebernachtet="ja"; b.naechte=x.n; b.uebernachtungen=String(x.n.length); }
      else if(x.t==="m") l.mengen[x.k]=x.v;
      else if(x.t==="s"){ const mn=Math.round(nn(x.s.stunden)*60); sonder.push({id:"s"+Date.now().toString(36)+sonder.length,arbeit:String(x.s.arbeit).trim(),personen:parseInt(x.s.personen,10)||1,min:mn||0,bemerkung:""}); }
    });
    if(sonder.length) b.sonder=[...sonderListe(cur),...sonder];

    if(b.istKm && !S.lohn[lohnDocId(o.id,myId())]?.kmSelbst) l.kmSelbst=b.istKm;
    try{
      if(Object.keys(b).length) await upd(orderPath(o.id),{bericht:b});

      close(); toast("Eingetragen ✓ – bitte kurz prüfen und ergänzen",3500);
    }catch(e){}
  };
}

/* ---------- Sichtabnahme-Pflicht ---------- */
function abnahmeOk(o){ return !!(o.unterschrift||o.abnahmeDatei||o.abnahmePapier); }
const TAG=86400000;
function abnahmeStatus(o){
  if(abnahmeOk(o)) return "ok";
  if(o.abnahmeAnfrage) return "versendet";
  if(o.abnahmeKeinVersand) return "verzicht";
  return "offen";
}
function abnahmeFaellig(o){ // Erinnerung an die zuständige Person
  if(abnahmeOk(o)) return false; // aktueller Status zuerst: nachgereichte Sichtabnahme beendet die Erinnerung
  const st=abnahmeStatus(o);
  if(st==="versendet") return Date.now()>o.abnahmeAnfrage.frist;
  if(o.abschluss && o.berichtGesendetAm && Date.now()-o.berichtGesendetAm>7*TAG && st!=="verzicht") return true; // eine Woche nach Berichtsversand (nicht bei Leerfahrten)
  if(st==="offen") return !!(o.abschluss && Date.now()-o.abschluss.am>7*TAG);
  return false;
}
function meinAuftrag(o){ return can.planen() || (o.monteure||[]).includes(myId()) || o.abschluss?.by===myId(); }

  let h=`<div class="card" style="border-left:5px solid var(--${c==="ok"?"ok":c==="warn"?"accent":c==="bad"?"bad":"line"})"><h3>Sichtabnahme</h3>
   <div class="row between"><b style="font-size:16px">${ic} ${l}</b></div>`;
  if(st==="ok") h+=`<div class="small mute" style="margin-top:4px">${o.unterschrift?`Unterschrieben von ${esc(o.unterschrift.name||"")} am ${fmtDT(o.unterschrift.am)}`:o.abnahmeDatei?`Unterschriebene Sichtabnahme hochgeladen am ${fmtDT(o.abnahmeDatei.am)} – <a href="_blob/${esc(o.abnahmeDatei.assetId)}" target="_blank" rel="noopener">ansehen</a>`:"Auf Papier erledigt"}</div>`;

  if(abnahmeFaellig(o) && o.berichtGesendetAm && st!=="versendet") h+=`<div class="banner bad" style="margin:10px 0 0">⏰ Der Bericht ging am ${fmtDT(o.berichtGesendetAm)} raus – seitdem liegt keine Sichtabnahme vor. Bitte beim Kunden nachhaken oder die Sichtabnahme anfordern.</div>`;
  else if(abnahmeFaellig(o)) h+=`<div class="banner bad" style="margin:10px 0 0">⏰ ${st==="offen"?`Seit ${tage} Tagen keine Sichtabnahme. Bitte den Kunden informieren: Sichtabnahme prüfen und entscheiden, ob sie an das Bauvorhaben geschickt wird.`:"Frist abgelaufen – beim Kunden nachhaken oder erneut senden."}</div>`;

     ${can.planen()&&can.mails()?`<button class="btn ${abnahmeFaellig(o)?"warn":"ghost"} block" id="reqAbn">👁 Sichtabnahme prüfen &amp; an Kunden senden</button>`:""}
     ${can.planen()&&st==="offen"?`<button class="btn ghost block" id="noAbn">Nicht an Kunden senden</button>`:""}
     ${can.planen()&&S.assets?`<label class="btn ghost block">📎 Unterschriebene Sichtabnahme hochladen<input type="file" accept="image/*,application/pdf" hidden id="abnUp"></label>`:""}
    </div>`;
  }
  return h+`</div>`;
}

/* ---------- meta-Vordruck: Montagebericht + Sichtabnahmebescheinigung ---------- */
const BG1="_blob/meta-montagebericht-v2", BG2="_blob/meta-sichtabnahme-v2"; // meta-Vorlage (PDF von meta, als Bild)
const ARTEN={lieferung:"Lieferung",fertigmontage:"Fertigmontage",teilmontage:"Teilmontage",restmontage:"Restmontage",rekla:"Rekl. Behebung"};
function tageText(o){
  const ds=(o.zeiten||[]).map(z=>new Date(z.s)).sort((a,b)=>a-b);
  if(!ds.length) return new Date().toLocaleDateString("de-DE");
  const a=ds[0], b=ds[ds.length-1];
  if(a.toDateString()===b.toDateString()) return a.toLocaleDateString("de-DE");
  if(a.getMonth()===b.getMonth()) return `${a.getDate()}.–${b.toLocaleDateString("de-DE")}`;
  return `${a.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}–${b.toLocaleDateString("de-DE")}`;
}
// Eigene Einträge: Mitarbeiter und Subunternehmer sehen nur, was sie selbst erfasst haben – die Chefs sehen alles
const istMeins=x=>can.planen()||x?.von===myId();
const fotoMeins=f=>can.planen()||f?.kat==="unterlagen"||f?.von===myId();
const vonTag=x=>can.planen()&&x?.von&&x.von!==myId()?` <span class="chip info" style="font-size:11px">${esc(nameOf(x.von).split(" ")[0])}</span>`:"";
// Positionen für den Bericht an meta: alle Beteiligten zusammengezählt. Ausnahme: nachträglich dazugenommene Leute –
// ihr Anteil ist nur für die eigene Abrechnung (der Bericht stand da schon). uid: nur die Positionen dieser Person.
const spaetDazu=(o,u)=>!!o?.nachgetragen?.[u] && !o.nachgetragen[u].imEinsatz; // erst nach dem Bericht dazugenommen
const lohnFuerBericht=o=>Object.values(S.lohn).filter(l=>l.auftragId===o.id && !spaetDazu(o,l.uid));
function summeMengen(o,uid){
  const tot={};
  (uid?Object.values(S.lohn).filter(l=>l.auftragId===o.id&&l.uid===uid):lohnFuerBericht(o)).forEach(l=>Object.entries(l.mengen||{}).forEach(([k,v])=>{ const q=nn(v); if(q) tot[k]=(tot[k]||0)+q; }));
  return tot;
}
// Chef: alle Positionen aller Monteure auf einer Liste – je Person und zusammen
function gesamtKarte(o){
  const ls=Object.values(S.lohn).filter(l=>l.auftragId===o.id && Object.values(l.mengen||{}).some(v=>nn(v)));
  if(ls.length<2) return "";
  const leute=ls.map(l=>l.uid), tot=summeMengen(o);
  const keys=S.lohnPos.map(p=>p.k).filter(k=>ls.some(l=>nn(l.mengen?.[k])));
  const kurz=u=>esc((u===myId()?"Ich":nameOf(u)).split(" ")[0]);
  return `<div class="card"><h3>📋 Alle Positionen zusammen</h3>
   <div class="small mute" style="margin-bottom:8px">Was jeder selbst eingetragen hat – die Summe geht in den Montagebericht an meta.${leute.some(u=>spaetDazu(o,u))?" Nachträglich Dazugenommene (kursiv) zählen nur für ihre eigene Abrechnung.":""}</div>
   <div style="overflow-x:auto"><table class="pos"><thead><tr><th>Position</th>${leute.map(u=>`<th style="${spaetDazu(o,u)?"font-style:italic":""}">${kurz(u)}</th>`).join("")}<th>Summe</th></tr></thead>
   <tbody>${keys.map(k=>`<tr><td>${esc((S.lohnPos.find(p=>p.k===k)||{}).label||k)}</td>${ls.map(l=>`<td style="${spaetDazu(o,l.uid)?"font-style:italic;color:var(--mute)":""}">${nn(l.mengen?.[k])?fmtZahl(nn(l.mengen[k])):""}</td>`).join("")}<td><b>${tot[k]?fmtZahl(tot[k]):""}</b></td></tr>`).join("")}</tbody></table></div></div>`;
}
const fmtZahl=v=>String(v).replace(".",",");
function vdDefaults(o){
  const b=o.bericht||{};
  const rk=Object.values(S.reklas).filter(r=>r.auftragId===o.id).sort((a,c)=>c.am-a.am)[0];
  const d={datum:tageText(o),art:istReklaAuftrag(o)?"rekla":"fertigmontage",ok:(o.abschluss&&o.abschluss.typ!=="ok")?"nein":"ja"};
  d.m1=S.settings.monteurName||"JD Brüder GbR"; d.n1=S.settings.monteurNr||"286"; d.p1="100";
  // Bemerkungen: alle übrigen Berichtseinträge – Positionen mit Mengen, Tätigkeiten, Sonderleistungen, weitere Bemerkungen
  const tot=summeMengen(o); const lbl=k=>(S.lohnPos.find(p=>p.k===k)||{}).label||k;
  const sonder=sonderFertig(b);
  const bem=[];
  // Positionen stehen im Vordruck einzeln untereinander (eigene Liste), nicht im Fließtext
  d.positionen=S.lohnPos.filter(p=>p.k!=="stunden"&&tot[p.k]).map(p=>({m:fmtZahl(tot[p.k]),l:p.label,e:p.einheit||""}));
  Object.keys(tot).filter(k=>k!=="stunden"&&!S.lohnPos.some(p=>p.k===k)).forEach(k=>d.positionen.push({m:fmtZahl(tot[k]),l:lbl(k),e:""}));
  if(b.taetigkeit) bem.push(b.taetigkeit);
  sonder.forEach(s=>bem.push(`${istReklaAuftrag(o)?"Zusatzarbeit":"Sonderarbeit"}: ${sonderZeile(s)}`));
  if(!leer(b.personen)||!leer(b.personenMit)) bem.push(`Personen: ${[leer(b.personen)?"":`${b.personen} vor Ort`,leer(b.personenMit)?"":`${b.personenMit} mitgefahren`].filter(Boolean).join(", ")}`);
  if(b.bemerkung) bem.push(b.bemerkung);
  vorleistungZeilen(o).forEach(z=>bem.push(z));
  d.bemerkungen=bem.join("\n");
  // Fertigung: alle Reklamationen dieses Auftrags, jede in eigener Zeile (Leerfahrten stehen als Vorleistung bei den Bemerkungen)
  d.fertigung=Object.values(S.reklas).filter(r=>r.auftragId===o.id && !r.leerfahrt).sort((a,c)=>(a.am||0)-(c.am||0)).map(r=>`${URSACHEN[r.ursache]||r.ursache}: ${String(r.text||"").replace(/\s*\n\s*/g," ")}`).join("\n");
  // Montage-Abrechnung ganz unten: ausschließlich gefahrene km und Geschosse
  const ab=[];
  const lk=leerKm(o), ld=(o.leerfahrten||[]).filter(l=>nn(l.km)).map(leerDatum).join(", ");
  if(!leer(b.istKm)) ab.push(`${fmtZahl(b.istKm)} km${lk?` + ${fmtZahl(lk)} km Leerfahrt (${ld})`:""}`);
  else if(lk) ab.push(`${fmtZahl(lk)} km Leerfahrt (${ld})`);
  if(hotelKm(o)) ab.push(`Hotelfahrten ${fmtZahl(hotelKm(o))} km`);
  if(mitAnhaenger(o.einsatz)) ab.push("Bitte beachten: Anhängerfahrt");
  const g=leer(b.geschosse)?"":b.geschosse; if(g) ab.push(`Geschosse: ${g}`);
  if((b.naechte||[]).length && uebernachtet(b)==="ja") ab.push(`Übernachtung: ${b.naechte.map(x=>`${x.datum?new Date(x.datum+"T12:00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}):"?"} ${x.personen||"?"} Pers.`).join(", ")}`);
  d.abrechnung=ab.join(", ");
  // Stunden-Bereich: Sonderleistungen mit Personen und Dauer

function meineFahrzeuge(){

}
function fahrtenVon(fzId){
  const fz=S.fahrzeuge[fzId]; if(!fz) return [];
  const list=Object.values(S.fahrten).filter(f=>f.fahrzeugId===fzId).sort((a,b)=>(a.datum||"").localeCompare(b.datum||"")||(a.am||0)-(b.am||0));

  if(offen){

    await setDoc("fahrten/"+offen.id,g); S.fahrten[offen.id]={id:offen.id,...g};

    if(startKm<stand){ toast(`Kleiner als der letzte Stand (${kmFmt(stand)} km) – bitte prüfen`,3500); return null; }
    if(startKm>stand){
      const diff=Math.round((startKm-stand)*10)/10;
      const w=await waehleBox(`${kmFmt(diff)} km ohne Eintrag`,`Seit dem letzten Eintrag (${kmFmt(stand)} km) ist das Auto <b>${kmFmt(diff)} km</b> gefahren. Was war das?`,[["privat","🏠 Privatfahrt"],["dienst","💼 Dienstfahrt (vergessen einzutragen)"]]);

      const lid=neueFahrtId(), l={fahrzeugId:fzId,datum:isoTag(Date.now()),von:"",nach:"",km:diff,startKm:stand,endKm:startKm,art:w,zweck:w==="privat"?"Privatfahrt":"Dienstfahrt (nachgetragen)",fahrer:myId(),am:Date.now()-1,nachtrag:true};

    }
  }
  // Tour: direkt im Anschluss an die vorige Fahrt (z. B. Baustelle → nächste Baustelle) → Fahrten werden verkettet
  const an=anschlussAn(fzId,startKm,vonZiel);
  if(vonZiel===undefined) vonZiel=an?an.ziel||null:null;
  if(vonAuftragId===undefined) vonAuftragId=an&&an.ziel==="baustelle"?an.auftragId||null:null;
  const kette=an?(an.kette||an.id):null;

  const vo=S.orders[vonAuftragId];

  await setDoc("fahrten/"+id,f); S.fahrten[id]={id,...f};

}

function anschlussAn(fzId,startKm,vonZiel){
  const v=fahrtenVon(fzId).filter(f=>!f.offen&&!f.nachtrag&&f.art!=="privat").slice(-1)[0]; if(!v) return null;

  if(vonZiel && v.ziel && vonZiel!==v.ziel && vonZiel!=="sonst") return null;

const geoAbst=(a,b)=>{ const R=6371000,r=x=>x*Math.PI/180, dl=r(b.lat-a.lat), dn=r(b.lon-a.lon); const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
async function geoErlaubt(){ try{ const p=await navigator.permissions?.query({name:"geolocation"}); return p?p.state:"unbekannt"; }catch(e){ return "unbekannt"; } }
function geoPos(ms=6000){
  return new Promise(res=>{ if(!navigator.geolocation) return res(null); let fertig=false; const t=setTimeout(()=>{ if(!fertig){ fertig=true; res(null); } },ms+500);
    navigator.geolocation.getCurrentPosition(p=>{ if(fertig) return; fertig=true; clearTimeout(t); res({lat:p.coords.latitude,lon:p.coords.longitude}); },()=>{ if(!fertig){ fertig=true; clearTimeout(t); res(null); } },{enableHighAccuracy:false,maximumAge:120000,timeout:ms}); });

// Adresse → Koordinaten (OpenStreetMap), im Gerät gemerkt
async function geoAdresse(adr){
  adr=String(adr||"").trim(); if(adr.length<6||!/\d/.test(adr)) return null;
  const k="jdGeo:"+adr.toLowerCase(); try{ const c=JSON.parse(localStorage.getItem(k)||"null"); if(c) return c; }catch(e){}
  // mehrere Schreibweisen probieren: wie geschrieben → ohne Klammern/Länderkürzel („L-8389“) → nur PLZ + Ort
  const ohne=adr.replace(/\([^)]*\)/g," ").replace(/\b(?:L|D|A|B|F|NL|CH)-(?=\d{4,5}\b)/g,"").replace(/\s+/g," ").replace(/\s+,/g,",").trim();
  const lu=/\bL-\d{4}\b|luxemb/i.test(adr)?"lu":"";
  const plzOrt=(ohne.match(/(\d{4,5}\s+[^,]+)$/)||[])[1]||"";
  const varianten=[...new Set([adr,ohne,plzOrt].filter(x=>x&&x.length>=4))];
  // Kartendienst erlaubt etwa 1 Anfrage pro Sekunde → bei „zu viele“ kurz warten und erneut versuchen
  const holen=async q=>{ for(let v=0;v<3;v++){ try{ const res=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&countrycodes=${lu||"de,lu,fr,be,nl,at,ch"}&q=${encodeURIComponent(q)}`);
      if(res.status===429||res.status>=500){ await new Promise(r=>setTimeout(r,1500*(v+1))); continue; } return await res.json(); }catch(e){ await new Promise(r=>setTimeout(r,1200)); } } return null; };
  for(const q of varianten){
    const r=await holen(q);
    if(r?.[0]){ const g={lat:+r[0].lat,lon:+r[0].lon,genau:q!==plzOrt}; try{ localStorage.setItem(k,JSON.stringify(g)); }catch(e){} return g; }
    await new Promise(r=>setTimeout(r,1100));
  }
  return null;
}
// Strecken-km mit dem Auto (wie die Route in Google Maps)
async function strasseKm(a,b){
  try{ const r=await (await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`)).json();
    const m=r?.routes?.[0]?.distance; return m?Math.round(m/100)/10:null; }catch(e){ return null; }
}

const fahrtZielAdr=f=>{ const o=S.orders[f.auftragId]; return f.ziel==="baustelle"&&o?adresseOf(o):f.ziel==="firma"?S.settings.firmenAdresse||"":/\d/.test(f.nach||"")?f.nach:""; };
async function routeErmitteln(f){
  if(f.routeKm||f._routeVersucht) return f.routeKm||null; S.fahrten[f.id]._routeVersucht=true;
  const zA=fahrtZielAdr(f); if(!zA) return null;
  const ziel=f.zielGeo||await geoAdresse(zA); if(!ziel) return null;
  const start=f.startGeo||await geoAdresse(f.von); if(!start) { await fahrtPatch(f.id,{zielGeo:ziel}); return null; }

}
const routeVorschlag=f=>f?.routeKm?Math.round(nn(f.startKm)+f.routeKm):"";
const routeHinweis=f=>f?.routeKm?`<div class="small mute" style="margin-top:2px">🗺 Strecke laut Route: <b>${kmFmt(f.routeKm)} km</b> – Stand ist vorgeschlagen, bitte mit dem Tacho abgleichen.</div>`:"";
function kmDiffText(f,v){

async function fahrtenbuchPdf(fzId,monat){
  const fz=S.fahrzeuge[fzId]; const all=fahrtenVon(fzId); const list=all.filter(f=>(f.datum||"").startsWith(monat));
  const jsPDF=await loadJsPDF(); const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"landscape"});
  const mName=new Date(monat+"-01").toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  pdf.setFontSize(16); pdf.text(`Fahrtenbuch – ${fz.kennzeichen}${fz.name?" ("+fz.name+")":""}`,14,16);
  pdf.setFontSize(10); pdf.text(`${S.settings.monteurName||"JD Brüder GbR"} · ${mName} · ${list.length} Fahrten · ${list.reduce((a,f)=>a+nn(f.km),0)} km`,14,23);
  const cols=[["Datum",22],["Fahrer",32],["Von",58],["Nach",58],["Auftrag",22],["Zweck",42],["km",14],["km-Stand",22]];
  let y=32; const head=()=>{ pdf.setFont(undefined,"bold"); let x=14; cols.forEach(([t,w])=>{ pdf.text(t,x,y); x+=w; }); pdf.setFont(undefined,"normal"); pdf.line(14,y+1.5,284,y+1.5); y+=6; };
  head();
  list.forEach(f=>{ const o=S.orders[f.auftragId]; const priv=f.art==="privat"; const row=[new Date(f.datum).toLocaleDateString("de-DE"),nameOf(f.fahrer)==="Ich"?(S.me?.name||""):nameOf(f.fahrer),priv?"":f.von||"",priv?"":f.nach||"",o?o.nr:"",priv?"Privatfahrt":f.zweck||"",f.offen?"–":String(nn(f.km)),`${f._start}–${f._ende??"unterwegs"}`];
    const wrapped=row.map((t,i)=>pdf.splitTextToSize(String(t),cols[i][1]-2)); const hh=Math.max(...wrapped.map(w=>w.length))*4.2;
    if(y+hh>196){ pdf.addPage(); y=16; head(); }
    let x=14; wrapped.forEach((w,i)=>{ pdf.text(w,x,y); x+=cols[i][1]; }); y+=hh+1.5; pdf.setDrawColor(220); pdf.line(14,y-2.5,284,y-2.5); pdf.setDrawColor(0); });
  if(list.length){ y+=3; pdf.setFont(undefined,"bold"); pdf.text(`Kilometerstand Monatsanfang: ${list[0]._start}   ·   Monatsende: ${list[list.length-1]._ende??list[list.length-1]._start}   ·   davon privat: ${list.filter(f=>f.art==="privat").reduce((a,f)=>a+nn(f.km),0)} km`,14,y); }
  return {blob:pdf.output("blob"),name:`Fahrtenbuch_${(fz.kennzeichen||"Auto").replace(/[^\w-]+/g,"_")}_${monat}.pdf`};
}

function viewWoche(){
  if(S.wochenNurMeine===null) S.wochenNurMeine = (S.role==="monteur" && !S.isOwner);

  let h=`<div class="row between" style="margin-bottom:6px"><h2 style="margin:0;font-size:20px">Wochenplan</h2>
    <div class="seg" id="wSeg" style="min-width:200px"><button data-w="0" class="${!S.wochenNurMeine?"on":""}">Alle</button><button data-w="1" class="${S.wochenNurMeine?"on":""}">Nur meine</button></div></div>`;
  weeks.forEach(w=>{
    let items=Object.values(S.orders).filter(o=>{ const p=planWeek(o); return p.kw===w.kw && p.jahr===w.jahr; });
    items=items.filter(sichtbar);
    if(S.wochenNurMeine) items=items.filter(o=>(o.monteure||[]).includes(myId()));

    if(!items.length){ h+=`<div class="small mute" style="padding:0 4px 6px">Nichts geplant.</div>`; return; }
    // nach Monteur gruppieren
    const by={}; items.forEach(o=>{ const ms=(o.monteure&&o.monteure.length)?o.monteure:["_"]; ms.forEach(mm=>(by[mm]=by[mm]||[]).push(o)); });
    Object.keys(by).sort((a,b)=>a==="_"?1:b==="_"?-1:nameOf(a).localeCompare(nameOf(b))).forEach(mm=>{
      if(S.wochenNurMeine && mm!==myId()) return;

/* ============ Zeiterfassung ============
   Eigene Umsetzung nach Arbeitszeitgesetz (ArbZG §§ 3, 4, 5, 9, 16), EuGH C-55/18 und BAG 1 ABR 22/21:
   Beginn, Ende, Pausen und Dauer je Tag, Abwesenheiten, Soll/Ist/Saldo, Prüfung der gesetzlichen Grenzen,
   jede nachträgliche Änderung mit Grund protokolliert, Monatsbestätigung durch Mitarbeiter und Freigabe durch den Chef,
   Export als PDF/CSV. Jeder sieht nur seine eigenen Zeiten (Chef: alle) – in der Datenbank abgesichert. */
const AZ_ABW={urlaub:["🏖","Urlaub",true],krank:["🤒","Krank",true],feiertag:["🎉","Feiertag",true],schule:["🎓","Berufsschule",true],abbau:["⏳","Überstundenabbau",false],unbezahlt:["⛔","Unbezahlt frei",null]};
const azId=(uid,tag)=>`${uid}_${tag}`, azMid=(uid,monat)=>`${uid}_M_${monat}`;
const azTag=(uid,tag)=>S.az[azId(uid,tag)]||null;
const fmtMin=m=>`${m<0?"−":""}${Math.floor(Math.abs(Math.round(m))/60)}:${String(Math.abs(Math.round(m))%60).padStart(2,"0")}`;
const fmtUhr=ms=>ms?new Date(ms).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"–";
const tagPlus=(tag,n)=>{ const d=new Date(tag+"T12:00"); d.setDate(d.getDate()+n); return tagKey(d); };

// Feiertage Rheinland-Pfalz (Firmensitz)
const _ftCache={};
function feiertage(j){
  if(_ftCache[j]) return _ftCache[j];
  const a=j%19,b=Math.floor(j/100),c=j%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const om=Math.floor((h+l-7*m+114)/31), od=((h+l-7*m+114)%31)+1, ostern=new Date(j,om-1,od,12);
  const o=n=>{ const x=new Date(ostern); x.setDate(x.getDate()+n); return tagKey(x); };
  const map={[`${j}-01-01`]:"Neujahr",[o(-2)]:"Karfreitag",[o(1)]:"Ostermontag",[`${j}-05-01`]:"Tag der Arbeit",[o(39)]:"Christi Himmelfahrt",[o(50)]:"Pfingstmontag",[o(60)]:"Fronleichnam",[`${j}-10-03`]:"Tag der Deutschen Einheit",[`${j}-11-01`]:"Allerheiligen",[`${j}-12-25`]:"1. Weihnachtstag",[`${j}-12-26`]:"2. Weihnachtstag"};
  return (_ftCache[j]=map);
}
const feiertagName=tag=>feiertage(+tag.slice(0,4))[tag]||"";
function azSoll(uid,tag){
  const cfg=(S.settings.zeitSoll||{})[uid]||{}, tage=cfg.tage||[1,2,3,4,5], wd=new Date(tag+"T12:00").getDay()||7;
  if(!tage.includes(wd) || feiertagName(tag)) return 0;
  return Math.round(nn(cfg.wochenStd??40)*60/tage.length);
}
function azRechnen(t){
  const bl=[...(t?.bloecke||[])].sort((a,b)=>a.von-b.von), now=Date.now();
  let arbeit=0, pause=0; bl.forEach((b,i)=>{ arbeit+=(b.bis||now)-b.von; if(i){ const g=b.von-(bl[i-1].bis||b.von); if(g>0) pause+=g; } });
  const auto=nn(t?.autoPause);
  return {bl,beginn:bl[0]?.von||null,ende:bl.length&&bl[bl.length-1].bis?bl[bl.length-1].bis:null,pauseMin:Math.round(pause/60000)+auto,netto:Math.max(0,Math.round(arbeit/60000)-auto),laeuft:bl.some(b=>!b.bis)};
}
function azPruefen(uid,tag){
  const r=azRechnen(azTag(uid,tag)), w=[];
  if(r.netto>360 && r.pauseMin<30) w.push("§ 4 ArbZG: ab 6 Std. Arbeit mind. 30 Min. Pause");
  if(r.netto>540 && r.pauseMin<45) w.push("§ 4 ArbZG: ab 9 Std. Arbeit mind. 45 Min. Pause");
  if(r.netto>600) w.push("§ 3 ArbZG: mehr als 10 Std. Arbeitszeit");
  const v=azRechnen(azTag(uid,tagPlus(tag,-1)));
  if(v.ende && r.beginn && r.beginn-v.ende<11*3600000) w.push(`§ 5 ArbZG: nur ${fmtMin((r.beginn-v.ende)/60000)} Std. Ruhezeit (mind. 11)`);
  if(r.netto && (new Date(tag+"T12:00").getDay()===0||feiertagName(tag))) w.push(`§ 9 ArbZG: Arbeit am ${feiertagName(tag)||"Sonntag"}`);
  return w;
}
function azIst(uid,tag){
  const t=azTag(uid,tag), soll=azSoll(uid,tag), a=AZ_ABW[t?.abw];
  if(a) return a[2]===true?{ist:soll,soll}:a[2]===false?{ist:0,soll}:{ist:0,soll:0};
  return {ist:azRechnen(t).netto,soll};
}
const azStart=uid=>{ const s0=(S.settings.zeitSoll||{})[uid]?.ab; if(s0) return s0; const t=Object.values(S.az).filter(x=>x.uid===uid&&x.tag&&x.art!=="urlaub").map(x=>x.tag).sort()[0]; return t||tagKey(new Date()); };
function azSumme(uid,von,bis){ let soll=0,ist=0; const heute=tagKey(new Date());
  for(let t=von;t<=bis;t=tagPlus(t,1)){ const x=azIst(uid,t), tg=azTag(uid,t); let so=x.soll; if(t===heute && !(tg?.feierabend||tg?.abw)) so=Math.min(so,x.ist); soll+=so; ist+=x.ist; }
  return {soll,ist,saldo:ist-soll}; }
function azMonat(uid,monat){
  const [j,m]=monat.split("-").map(Number), n=new Date(j,m,0).getDate(), heute=tagKey(new Date());

  const von=[tage[0],azStart(uid)].sort()[1]; // erst ab Beginn der Erfassung zählen

const azKonto=uid=>{ const h=tagKey(new Date()), a=azStart(uid); return a<=h?azSumme(uid,a,h).saldo:0; };

async function azSpeichern(uid,tag,neu,grund){

// Stempeluhr
async function azStempel(aktion){
  const uid=myId(), tag=tagKey(new Date()), t=azTag(uid,tag)||{bloecke:[]}, now=Date.now();
  const bl=(t.bloecke||[]).map(b=>({...b})), offen=bl.find(b=>!b.bis);
  if(aktion==="kommen"){
    if(azOffenAlt().length) return toast("Erst den offenen Tag abschließen (Ende nachtragen)",3500);
    if(offen) return; const auf=Object.values(S.orders).find(o=>sichtbar(o)&&!istFertig(o)&&(o.monteure||[]).includes(uid)&&terminTag(o)===tag);
    bl.push({von:now,bis:null,auftragId:auf?.id||null});
    if(bl.length===1){ const v=azRechnen(azTag(uid,tagPlus(tag,-1))); if(v.ende && now-v.ende<11*3600000) toast(`Achtung: erst ${fmtMin((now-v.ende)/60000)} Std. Ruhezeit seit gestern (gesetzlich 11)`,4500); }
    await azSpeichern(uid,tag,{bloecke:bl,feierabend:false},null); return toast("Eingestempelt ✓",2200);
  }
  if(aktion==="gehenNachPause"){ const r0=azRechnen(t); if(!r0.bl.length) return; const noetig=r0.netto>540?45:r0.netto>360?30:0, fehlt=Math.max(0,noetig-r0.pauseMin); let auto=nn(t.autoPause);
    if(fehlt>0 && await confirmBox("Gesetzliche Pause fehlt",`Heute ${fmtMin(r0.netto)} Std. gearbeitet, nur ${r0.pauseMin} Min. Pause (nötig: ${noetig} Min.). Fehlende <b>${fehlt} Min.</b> abziehen?`,"Ja, abziehen","warn")) auto+=fehlt;
    await azSpeichern(uid,tag,{autoPause:auto,feierabend:true},null); return toast(`Feierabend ✓ – heute ${fmtMin(azRechnen(azTag(uid,tag)).netto)} Std.`,3000); }
  if(!offen) return;
  offen.bis=now;
  if(aktion==="pause"){ await azSpeichern(uid,tag,{bloecke:bl},null); return toast("Pause ⏸",2000); }
  // Gehen: gesetzliche Pause prüfen
  const r=azRechnen({...t,bloecke:bl}), noetig=r.netto>540?45:r.netto>360?30:0, fehlt=Math.max(0,noetig-r.pauseMin);
  let auto=nn(t.autoPause);
  if(fehlt>0){
    const ok=await confirmBox("Gesetzliche Pause fehlt",`Heute ${fmtMin(r.netto)} Std. gearbeitet, aber nur ${r.pauseMin} Min. Pause (nötig: ${noetig} Min. nach § 4 ArbZG).<br><br>Fehlende <b>${fehlt} Min.</b> als Pause abziehen?`,"Ja, abziehen","warn");
    if(ok) auto+=fehlt;
  }
  await azSpeichern(uid,tag,{bloecke:bl,autoPause:auto,feierabend:true},null); toast(`Ausgestempelt ✓ – heute ${fmtMin(azRechnen(azTag(uid,tag)).netto)} Std.`,3000);
}

function bindSubAbrechnung(){
  const sel=$("#subMonat"); if(sel) sel.onchange=()=>{ S.subMonat=+sel.value; render(); };
  const k=()=>{ const ms=[...new Set(subPosten().map(x=>monatKey(x.am)))].sort((a,b)=>b-a); return ms.includes(S.subMonat)?S.subMonat:(ms[0]??monatKey(Date.now())); };
  const fertige=()=>subPosten().filter(x=>x.fertig&&monatKey(x.am)===k());
  $("#subKopie") && ($("#subKopie").onclick=async()=>{ const t=subAbrechnungText(fertige(),k()); try{ await navigator.clipboard.writeText(t); toast("Kopiert – in deine Rechnung einfügen"); }catch(e){ modal(`<h2>Abrechnung</h2><textarea class="i" style="min-height:300px">${esc(t)}</textarea><button class="btn block" data-close style="margin-top:10px">Schließen</button>`); } });
  $("#subPdf") && ($("#subPdf").onclick=async()=>{ try{ const jsPDF=await loadJsPDF(); const pdf=new jsPDF({unit:"mm",format:"a4"}); pdf.setFont("helvetica","normal"); pdf.setFontSize(10.5);
      let y=20; for(const l of pdf.splitTextToSize(subAbrechnungText(fertige(),k()),170)){ if(y>282){ pdf.addPage(); y=20; } pdf.text(l,20,y); y+=5.4; }
      const dl=await window.claude.use("downloads").catch(()=>null); const fn=`Abrechnung_${(S.preise?.name||"Sub").replace(/\W+/g,"_")}_${monatName(k()).replace(/\s+/g,"_")}.pdf`;
      if(dl) await dl.save({filename:fn,data:pdf.output("blob")}); }catch(e){ if(e?.code!=="cancelled") toast("PDF fehlgeschlagen: "+(e.message||e)); } });
}

async function zugangCode(email, rolle, extra={}){
  const ex=S.zugang[email]||{};
  const code=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
  const doc={...ex,...extra,email,code,rolle,codeAm:Date.now(),codeBis:Date.now()+7*864e5,versuche:0,von:myId()};
  await setDoc("zugang/"+email,doc); S.zugang={...S.zugang,[email]:{id:email,...doc}};
  const name=doc.name||email, rl=(ZUGANG_ROLLEN.find(r=>r[0]===rolle)||[,rolle])[1];
  modal(`<h2>Code für ${esc(name)}</h2>
    <div style="font-size:40px;font-weight:800;letter-spacing:6px;text-align:center;margin:14px 0;font-variant-numeric:tabular-nums">${esc(codeText(code))}</div>
    <div class="small">Bitte <b>persönlich</b> weitergeben (mündlich, SMS oder WhatsApp). ${esc(name)} öffnet den App-Link, gibt <b>${esc(email)}</b> ein und dann diesen Code.</div>
    <div class="small mute" style="margin-top:6px">Kommt rein als <b>${esc(rl)}</b> · gültig bis ${new Date(doc.codeBis).toLocaleDateString("de-DE")} · nur einmal nutzbar</div>
    <div class="grid2" style="margin-top:14px"><button class="btn" id="zCopy">📋 Kopieren</button><button class="btn pri" data-close>Fertig</button></div>`,(m)=>{
      m.querySelector("#zCopy").onclick=async()=>{ const t=`Dein Zugang zur JD Brüder Montage-App:\n${location.origin+location.pathname}\nE-Mail: ${email}\nCode: ${codeText(code)} (gültig bis ${new Date(doc.codeBis).toLocaleDateString("de-DE")})`;
        try{ await navigator.clipboard.writeText(t); toast("Kopiert ✓"); }catch(e){ toast("Kopieren ging nicht – bitte abschreiben"); } };
    });
  render();
}

function rechnungsText(o,f){
  const lines=[`Rechnung – Montageleistung Auftrag ${o.nr}`,`Bauvorhaben: ${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}`, o.vorgang?`meta-Vorgang: ${o.vorgang}`:"", `Leistungszeitraum: ${o.abschluss?new Date(o.abschluss.am).toLocaleDateString("de-DE"):"KW "+(o.kw||"")}`,"","Pos.\tArtikel\tMenge\tEP\tGP"];
  (f.positionen||[]).forEach((p,i)=>lines.push(`${i+1}\t${p.artikel}\t${p.menge}\t${Number(p.ep).toFixed(2)}\t${Number(p.gp).toFixed(2)}`));
  lines.push("",`Summe netto: ${Number(f.summe).toFixed(2)} €`);
  return lines.filter(l=>l!==null).join("\n");
}

async function savePreise(patch){
  const cur=S.preise?{...S.preise}:{preise:{},sichtbarFuer:[]};
  const chefs=Object.keys(S.roles).filter(k=>S.roles[k]==="chef");
  const alt=new Set(cur.sichtbarFuer||[]); patch={...patch,sichtbarFuer:chefs};
  const next={...cur,...patch,preise:{...(cur.preise||{}),...(patch.preise||{})}};
  if(patch.preise===null) next.preise={};
  S.preise=next;
  await setDoc("lohn/preise",next);
  // freigegebene Mitarbeiter bekommen eine Kopie
  const copy={preise:next.preise,stockSatz:next.stockSatz,kmSelbst:next.kmSelbst,kmMit:next.kmMit,listen:next.listen||{},zuordnung:next.zuordnung||{},sub:subEinst(next)};
  for(const id of (next.sichtbarFuer||[])) await setDoc("lohnsicht/"+id,copy);
  // Subunternehmer (in Setup → Team freigegeben) bekommen nur IHRE Preise: je Serie Chef-Preis minus Abschlag – nie die Chef-Preise
  const subs=Object.keys(S.roles).filter(k=>S.roles[k]==="sub");
  const mitListe=new Set();
  const serieListen=Object.entries(next.listen||{}).filter(([k,v])=>v.serie);
  for(const id of subs){ if(!next.zuordnung?.[id]) continue; mitListe.add(id);
    await setDoc("lohnsicht/"+id,{...subListe(next,next),name:"Subunternehmer",fuerSub:true,listen:Object.fromEntries(serieListen.map(([k,v])=>[k,{...subListe(next,v),serie:true}]))}); }
  for(const id of (cur.subSicht||[])) if(!mitListe.has(id) && !chefs.includes(id)){ try{ await S.db.doc("lohnsicht/"+id).delete(); }catch(e){} }
  if(String(cur.subSicht||[])!==String([...mitListe])){ next.subSicht=[...mitListe]; S.preise=next; await setDoc("lohn/preise",next); }
  for(const id of alt) if(!chefs.includes(id)&&!mitListe.has(id)){ try{ await S.db.doc("lohnsicht/"+id).delete(); }catch(e){} }
}

async function abschluss(id,typ){
  const o=S.orders[id];
  const fk=k=>Object.values(S.fotos).filter(x=>x.kat===k);
  const f=fehlendeAngaben(o,fk), hart=f.filter(x=>!x.soft);
  const chef=can.planen();
  const ok=await confirmBox(chef?"Montage abschließen?":"Bericht abgeben?", (f.length?`<b>Bitte prüfen:</b>${missList(f)}${hart.length&&chef?`<div style="margin-top:6px">Du kannst die fehlenden Angaben auch danach noch ergänzen.</div>`:""}`:"")+(chef?`<div style="margin-top:8px">Danach ist der Bericht bereit für den Versand.</div>`:`<div style="margin-top:8px"><b>Danach kannst du nichts mehr ändern.</b> JD Brüder prüft den Bericht und bestätigt ihn – du bekommst eine Nachricht.</div>`), hart.length?(chef?"Trotzdem abschließen":"Trotzdem abgeben"):(chef?"Abschließen":"Bericht abgeben"), hart.length?"warn":"ok");
  if(!ok) return false;
  const now=Date.now(); const z=[...(o.zeiten||[])].map(x=>({...x})); if(z.length&&!z[z.length-1].e) z[z.length-1].e=now;
  const p={zeiten:z,abschluss:{typ,am:now,by:myId()},berichtStatus:chef?"bereit":"pruefung",berichtVonSub:can.sub()?myId():null,berichtVon:myId(),berichtTyp:typ};
  if(o.einsatz && !o.einsatz.fertigAm) p.einsatz={fertigAm:now};
  if(o.bericht?.arbeitszeitMin==null && z.length) p.bericht={arbeitszeitMin:Math.round(z.reduce((s,x)=>s+(x.e-x.s),0)/60000)};
  await upd(orderPath(id),p); S.orders[id]={...S.orders[id],...p,einsatz:{...(o.einsatz||{}),...(p.einsatz||{})},bericht:{...(o.bericht||{}),...(p.bericht||{})}}; render();
  if(!chef) S.sync?.run({subBericht:id}).catch(()=>{}); // Chefs: Bericht zu prüfen
  toast(chef?"Montage abgeschlossen ✓":"Bericht abgegeben ✓ – JD Brüder prüft ihn jetzt",3500);
  return true;
}

async function shrink(file,max=1600,q=.82){
  if(!/^image\//.test(file.type)||/svg/.test(file.type)) return file;
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  }catch(e){ return file; }
}

const DECK_PROMPT = `Du bekommst Fotos/Scans von Unterlagen eines Montageauftrags der Firma meta Trennwandanlagen (Aufmaß-Deckblatt, Produktdeckblatt, Zeichnungen).
Lies die Felder aus und antworte NUR mit einem JSON-Objekt mit diesen Schlüsseln (leerer String, wenn nicht vorhanden):
{"fertigungsNr":"Fertigungs-Auftrags-Nr. z.B. 17714/1","vorgang":"Auftrags-Vorgangs-Nr.","berater":"meta-Berater mit Telefon","adresse":"Baustellenanschrift: Straße Nr, PLZ Ort","bauvorhabenName":"z.B. Wohnquartier","bauleiterName":"","bauleiterTel":"","bauleiterMail":"","oeffnungszeiten":"","geschosse":"Montage in Geschoss","aufzug":"","montageHinweise":"","kaufmHinweise":"Kaufmännische Hinweise kurz","technHinweise":"Technische Hinweise vom Produktdeckblatt","aufbau":"Was aufgebaut wird: Modell/Design, Anzahl Kabinen, Anlagenhöhe, Farben, Bodenanschluss – kurz in einer Zeile","kabinen":"Anzahl Kabinen als Zahl","zahlungspflichtiger":"Firma, Ort","kw":"gewünschte Montage-KW als Zahl"}
Handschriftliche Werte mit lesen. Nichts erfinden.
Zusätzlich: "unsicher": Liste der Schlüssel, die du NICHT sicher lesen konntest (unleserlich, abgeschnitten, mehrdeutig) oder die im Dokument fehlen, aber wichtig wären – besonders "bauleiterTel" und "adresse". Beispiel: "unsicher":["bauleiterTel"].`;
async function readDeckblatt(id, blobs){
  if(!S.sample) throw new Error("Claude-Auslesen ist hier nicht verfügbar");
  let lim={}; try{ lim=await S.sample.limits(); }catch(e){}
  if(!lim.images) throw new Error("Bilder auslesen ist hier nicht verfügbar");
  const imgs=[]; for(const b of blobs.slice(0,4)) imgs.push(/pdf/i.test(b.type||"")?b:await shrink(b,1800,.85));
  const res=await S.sample.json(DECK_PROMPT,{images:imgs,modelTier:"default"});
  const o=S.orders[id]; const p={};
  const map={vorgang:"vorgang",berater:"berater",adresse:"adresse",bauleiterName:"bauleiterName",bauleiterTel:"bauleiterTel",bauleiterMail:"bauleiterMail",oeffnungszeiten:"oeffnungszeiten",geschosse:"geschosse",aufzug:"aufzug",montageHinweise:"montageHinweise",kaufmHinweise:"kaufmHinweise",technHinweise:"technHinweise",aufbau:"aufbau",kabinen:"kabinen",zahlungspflichtiger:"zahlungspflichtiger"};
  for(const [src,dst] of Object.entries(map)){ const v=String(res?.[src]??"").trim(); if(v && v!=="-" && !o[dst]) p[dst]=v; }
  if(!o.kw && parseInt(res?.kw,10)) p.kw=parseInt(res.kw,10);
  const n=Object.keys(p).length;
  const uns=(Array.isArray(res?.unsicher)?res.unsicher:[]).map(String).filter(k=>map[k]||k==="bauvorhabenName");
  ["bauleiterTel","adresse"].forEach(k=>{ if(!o[k]&&!p[k]&&!uns.includes(k)) uns.push(k); });
  p.deckUnsicher=uns; p.deckblattGelesenAm=Date.now();
  await upd(orderPath(id),p);
  return n;
}

async function importUnterlagen(id,progress=()=>{}){
  const o=S.orders[id]; const z=o?.zusageMail; if(!z?.att?.length) return 0;
  const have=new Set(Object.values(S.fotoFor===id?S.fotos:{}).map(f=>f.mailAtt).filter(Boolean));

    const bin=atob(img.data); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const blob=new Blob([u8],{type:img.mimeType||a.mimeType||"image/jpeg"});

  }

function b64uZuBytes(s){ const p="=".repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }

    <div class="row between" style="flex-wrap:nowrap;gap:10px"><div style="min-width:0"><div style="font-weight:700">${esc(S.me?.name||mail||"Angemeldet")}</div>${mail?`<div class="small mute" style="overflow:hidden;text-overflow:ellipsis">${esc(mail)}</div>`:""}</div><span class="chip">${esc(rolle)}</span></div>
    <div class="konto-k">
      ${S.echt.isOwner?`<button class="btn" id="kAnsicht">👁 Ansicht wechseln <span class="small mute" style="margin-left:auto">${ANSICHTEN.find(x=>x[0]===S.ansicht)[1]}</span></button>`:""}
      <button class="btn" id="kGeraet">📱 Mein Gerät <span class="small mute" style="margin-left:auto">${GERAETE[meinGeraet()]}</span></button>
      ${push?`<button class="btn" id="kPush">🔔 Benachrichtigungen <span class="small ${pushAktiv()?"":"mute"}" style="margin-left:auto;${pushAktiv()?"color:var(--ok)":""}">${pushAktiv()?"an":"aus"}</span></button>`:""}
      ${push&&!pushAktiv()?`<div class="small mute" style="margin:-2px 2px 2px">${meinGeraet()==="ios"&&!istInstalliertApp()?"Auf dem iPhone gehen Benachrichtigungen nur aus der App auf dem Home-Bildschirm – zuerst „App auf den Startbildschirm“ unten.":"Einschalten, damit du Termine, Nachrichten und Bestätigungen sofort aufs Handy bekommst."}</div>`:""}
      ${can.mails()?`<button class="btn" id="kMails">🔄 Mails von meta abrufen</button>`:""}
      ${window.jdInstallHilfe?`<button class="btn" id="kInst">📲 App auf den Startbildschirm</button>`:""}
      <button class="btn" id="kAus" style="color:var(--bad)">Abmelden</button>
    </div></div>`;
}

function pushDialog(){
