  if(!erl && terminOffenFuerMich(o)) h+=`<div class="card tbest"><div style="font-weight:750;font-size:16px">📅 ${esc(langDatum(o.termin))} – passt der Termin?</div>
     <div class="small mute" style="margin-top:2px">JD Brüder sieht deine Antwort sofort.</div>

const SCHRITTE=[["fahrzeug","Losfahren"],["ankunft","Angekommen"],["start","Montagestart"],["vorher","Vorher-Fotos"],["nmb","Montagebereit"],["montage","Montage"],["uebernachtung","Übernachtung"],["bericht","Montagebericht"],["rekla","Reklamation"],["abnahme","Sichtabnahme"],["fertig","Abgeschlossen"]];
const LEISTUNG={wc:"WC-Trennwände",schraenke:"Schränke",sonst:"Sonstiges"};
const leer=v=>v===undefined||v===null||String(v).trim()==="";
// Nach dem Montagebericht: Reklamation? (Ja/Nein) → Sichtabnahme? (Ja/Nein) → Unterschreiben oder Versenden
function schritt(o){
  const st=schrittBasis(o); if(st!=="bericht") return st;
  const b=o.bericht||{};
  if(!b.fertigAm) return "bericht";
  if(!b.reklaFertig && !istReklaAuftrag(o)) return "rekla";
  return "abnahme";
}
function schrittBasis(o){
  if(istFertig(o)) return "fertig";
  const e=o.einsatz;
  if(!e){ if(running(o)) return "montage"; if((o.zeiten||[]).length) return "bericht"; return "fahrzeug"; }
  if(!e.fahrzeug) return "fahrzeug";
  if(!e.ankunftAm) return "ankunft";
  if(!e.startAm) return "start";
  if(!e.bereit) return "vorher";
  if(e.bereit==="nein" && !e.nmb?.weiter) return "nmb";
  if(!e.fertigAm) return "montage";
  // ältere Berichte mit nur einer Zahl (ohne Ja/Nein) gelten als beantwortet
  if(!e.uebernachtungOk && !(o.bericht?.uebernachtungen!=null && !o.bericht?.uebernachtet)) return "uebernachtung";
  return "bericht";
}
// "6:30", "6h30", "6 Std 30" → Minuten; "6,5" oder "6" → Stunden; "90 min" → Minuten
function parseMin(v){
  v=String(v??"").trim(); if(!v) return null;
  const m=v.match(/^(\d+)\s*(?::|h|std\.?)\s*(\d{1,2})\s*(?:min\.?)?$/i); if(m) return (+m[1])*60+(+m[2]);
  const mm=v.match(/^(\d+)\s*min\.?$/i); if(mm) return +mm[1];
  const x=parseFloat(v.replace(",",".")); return isNaN(x)?null:Math.round(x*60);
}
const fmtHMin=min=>`${Math.floor(min/60)}:${String(Math.round(min%60)).padStart(2,"0")}`;
const fmtStd=min=>String(Math.round((nn(min)/60)*100)/100).replace(".",",");
// Arbeitszeit je Kalendertag (Zeitblöcke über Mitternacht werden aufgeteilt) – nur intern / Statistik
function tageZeiten(o){
  const m={}, pd=nn(o.einsatz?.personenVorOrt)||nn(o.bericht?.personen)||0;
  (o.zeiten||[]).forEach(z=>{ let t=z.s; const e=z.e||Date.now();
    while(t<e){ const d=new Date(t), mid=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(), bis=Math.min(e,mid), k=isoTag(t);
      const x=m[k]||(m[k]={tag:k,ms:0,p:0}); x.ms+=bis-t; x.p=Math.max(x.p,nn(z.p)||pd); t=bis; } });
  return Object.values(m).sort((a,c)=>a.tag.localeCompare(c.tag));
}

function fehlendeAngaben(o,fk){
  const b=o.bericht||{}, r=[];

  if(leer(b.geschosse) && !istReklaAuftrag(o)) r.push({t:"Geschosse fehlen"});
  if(sonderFertig(b).some(x=>!nn(x.personen)||!x.min)) r.push({t:"Sonderarbeit: Personen und Dauer angeben"});
  if(!uebernachtet(b)) r.push({t:"Übernachtung? (Ja/Nein) nicht angegeben",soft:true});
  else if(uebernachtet(b)==="ja" && (!(b.naechte||[]).length || b.naechte.some(x=>!x.datum||!nn(x.personen)))) r.push({t:"Übernachtung: Tag und Personen je Nacht angeben"});
  if(istReklaAuftrag(o)){
    if(leer(b.taetigkeit)) r.push({t:"Reklamationsbericht: Was wurde gemacht?"});
    if(!(arbeitszeitMin(o)>0)) r.push({t:"Arbeitszeit fehlt"});
  } else {
    if(SERIEN().length && !o.serie) r.push({t:"Serie fehlt (im Montagebericht wählen)"});
    if(S.lohnPos.length && !Object.keys(summeMengen(o)).length) r.push({t:"Keine Positionen im Montagebericht eingetragen"});
  }
  if(fk && !fk("vorher").length) r.push({t:"Vorher-Fotos fehlen",soft:true});
  if(fk && !fk("nachher").length) r.push({t:"Fotos nach der Montage fehlen"});
  if(!abnahmeOk(o)) r.push({t:"Sichtabnahme fehlt (Bericht kann trotzdem verschickt werden)",soft:true});
  return r;
}

async function makeBriefPdf(o,betreff,text){
  const jsPDF=await loadJsPDF(); const pdf=new jsPDF({unit:"mm",format:"a4"});
  const s=S.settings, firma=s.monteurName||"JD Brüder GbR";
  pdf.setTextColor(13,42,107); pdf.setFont("helvetica","bold"); pdf.setFontSize(16); pdf.text(firma,20,22);
  pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(90,90,90); pdf.text([s.firmenAdresse,s.antwortEmail||"jd.brueder.meta@gmail.com"].filter(Boolean).join(" · "),20,28);
  pdf.setTextColor(0,0,0); pdf.setFontSize(10.5);
  const empf=[...String(o.zahlungspflichtiger||"").split(",").map(x=>x.trim()).filter(Boolean).slice(0,3), o.bauleiterName?"z. Hd. "+o.bauleiterName:""].filter(Boolean);
  if(empf.length) pdf.text(empf,20,48);
  pdf.text(new Date().toLocaleDateString("de-DE"),190,48,{align:"right"});
  pdf.setFont("helvetica","bold"); pdf.setFontSize(11.5); const bt=pdf.splitTextToSize(betreff,170); pdf.text(bt,20,78);

  for(const l of pdf.splitTextToSize(text,170)){ if(y>280){ pdf.addPage(); y=20; } pdf.text(l,20,y); y+=5.4; }
  return pdf.output("blob");
}

/* ---------- Akkord / Montagebericht Mitarbeiter ---------- */
const nn = v => { const x=parseFloat(String(v??"").replace(",",".")); return isNaN(x)?0:x; };
const r2 = x => Math.round(x*100)/100;
function lohnDocId(oid,uid){ return oid+"__"+uid; }
// Subunternehmer mit eigener Preisliste sehen nur deren Positionen; Chef und Mitarbeiter sehen alle
const posFuer=(P)=>!can.planen() && can.sub() && P && Object.keys(P.preise||{}).length ? S.lohnPos.filter(x=>nn(P.preise[x.k])>0) : S.lohnPos;
// Serien (Anlagentypen) mit eigener Preisliste: einstellungen/allgemein.serien = [{id,name,typen,pos:[…]}]; Preise: „std“ = lohn/preise, sonst lohn/preise.listen[id]
const SERIEN=()=>Array.isArray(S.settings?.serien)&&S.settings.serien.length?S.settings.serien:[];
const serieVon=o=>SERIEN().find(x=>x.id===o?.serie)||null;
const serieName=o=>{ const x=serieVon(o); return x?`${x.name}${x.typen?` (${x.typen})`:""}`:""; };
// Sub-Preise erst anzeigen, wenn JD Brüder sie freigibt (Setup → Preislisten)
const subPreiseAn=()=>!!S.settings?.subPreiseAktiv;
const istSubUid=u=>S.roles?.[u]==="sub";
function preisFuer(uid,P=S.preise,serie){ if(!P) return null; const lid=P.zuordnung?.[uid];
  if(lid&&P.listen?.[lid]&&!P.listen[lid].serie) return P.listen[lid];
  if(serie&&serie!=="std"&&P.listen?.[serie]) return P.listen[serie];
  return P; }
// Positionen, die im Auftrag stehen: die der gewählten Serie (alle, solange keine gewählt ist)
const posListe=o=>{ const x=serieVon(o); return x?.pos?.length?S.lohnPos.filter(p=>x.pos.includes(p.k)):S.lohnPos.filter(p=>!SERIEN().length||SERIEN().some(z=>(z.pos||[]).includes(p.k))); };
function calcLohn(d,P){
  if(!P||!d) return null;
  if(P===S.preise) P=preisFuer(d.uid,P,S.orders[d.auftragId]?.serie);
  const lines=[]; const pr=P.preise||{};
  S.lohnPos.forEach(p=>{ const q=nn(d.mengen?.[p.k]); if(q) lines.push({label:p.label,menge:q,ep:nn(pr[p.k]),gp:r2(q*nn(pr[p.k]))}); });
  const pers=nn(d.personen)||1;
  const et=r2(nn(P.stockSatz)*nn(d.stockwerke)*nn(d.etagenAnzahl)/pers);
  if(et) lines.push({label:`Etagengeld (${nn(d.stockwerke)} Stock × ${nn(d.etagenAnzahl)} ÷ ${pers} Pers.)`,menge:"",ep:"",gp:et});
  const ks=r2(nn(d.kmSelbst)*nn(P.kmSelbst)); if(ks) lines.push({label:"km selbst gefahren",menge:nn(d.kmSelbst),ep:nn(P.kmSelbst),gp:ks});
  const km=r2(nn(d.kmMit)*nn(P.kmMit)); if(km) lines.push({label:"km mitgefahren",menge:nn(d.kmMit),ep:nn(P.kmMit),gp:km});
  return {lines,total:r2(lines.reduce((s,l)=>s+l.gp,0))};
}
// Preisliste lernt mit: oft genutzte Positionen (in anderen Aufträgen) stehen oben – stabil, solange man in diesem Auftrag tippt
function nachNutzung(list,o){
  const n=posNutzung(o?.id), idx=new Map(S.lohnPos.map((p,i)=>[p.k,i]));
  return [...list].sort((a,b)=>(n[b.k]||0)-(n[a.k]||0)||(b.haeufig?1:0)-(a.haeufig?1:0)||(idx.get(a.k)??999)-(idx.get(b.k)??999));
}
// Zeilen mit Überschrift „Oft verwendet“ / „Weitere Positionen“
function posBloecke(list,o,zeileFn){
  const n=posNutzung(o?.id), sortiert=nachNutzung(list,o), oft=sortiert.filter(p=>(n[p.k]||0)>=2);
  if(!oft.length || oft.length===sortiert.length) return sortiert.map(zeileFn).join("");
  return `<div class="pl-kopf">⭐ Oft verwendet</div>${oft.map(zeileFn).join("")}<div class="pl-kopf">Weitere Positionen</div>${sortiert.filter(p=>!oft.includes(p)).map(zeileFn).join("")}`;
}
function posNutzung(ohneAuftrag){
  const n={};
  Object.values(S.lohn).forEach(l=>{ if(l.auftragId===ohneAuftrag) return; Object.entries(l.mengen||{}).forEach(([k,v])=>{ if(nn(v)) n[k]=(n[k]||0)+1; }); });
  return n;
}
function lohnPersonen(o){
  const ids=new Set(o.monteure||[]);
  Object.values(S.lohn).forEach(l=>{ if(l.auftragId===o.id) ids.add(l.uid); });

}

  if(opts.montagebericht) return `<div class="card" id="berichtCard"><div class="row between" style="flex-wrap:nowrap;gap:8px"><h3 style="margin:0">📋 Montagebericht</h3><span class="small mute">${anz?`${anz} Position${anz>1?"en":""}`:""}</span></div>

   ${darfAndere&&pers.length>1?`<div class="seg" id="lohnWho" style="margin-bottom:8px">${pers.map(p=>`<button data-lw="${esc(p)}" class="${p===uid?"on":""}">${esc(nameOf(p))}</button>`).join("")}</div>`:""}

async function saveLohn(o,uid,patch){

function abnahmeOk(o){ return !!(o.unterschrift||o.abnahmeDatei||o.abnahmePapier); }
const TAG=86400000;
function abnahmeStatus(o){
  if(abnahmeOk(o)) return "ok";

  return "offen";
}
function abnahmeFaellig(o){ // Erinnerung an die zuständige Person

  const st=abnahmeStatus(o);
  if(st==="versendet") return Date.now()>o.abnahmeAnfrage.frist;
  if(o.abschluss && o.berichtGesendetAm && Date.now()-o.berichtGesendetAm>7*TAG && st!=="verzicht") return true; // eine Woche nach Berichtsversand (nicht bei Leerfahrten)

const ARTEN={lieferung:"Lieferung",fertigmontage:"Fertigmontage",teilmontage:"Teilmontage",restmontage:"Restmontage",rekla:"Rekl. Behebung"};
function tageText(o){
  const ds=(o.zeiten||[]).map(z=>new Date(z.s)).sort((a,b)=>a-b);
  if(!ds.length) return new Date().toLocaleDateString("de-DE");
  const a=ds[0], b=ds[ds.length-1];
  if(a.toDateString()===b.toDateString()) return a.toLocaleDateString("de-DE");
  if(a.getMonth()===b.getMonth()) return `${a.getDate()}.–${b.toLocaleDateString("de-DE")}`;
  return `${a.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}–${b.toLocaleDateString("de-DE")}`;
}
function summeMengen(o){
  const tot={};
  Object.values(S.lohn).filter(l=>l.auftragId===o.id && !(o.gemeinsam && (S.roles[l.uid]==="sub" || o.subAnteil?.[l.uid]))).forEach(l=>Object.entries(l.mengen||{}).forEach(([k,v])=>{ const q=nn(v); if(q) tot[k]=(tot[k]||0)+q; }));

}
const fmtZahl=v=>String(v).replace(".",",");
function vdDefaults(o){

  const sonder=sonderFertig(b);
  const bem=[];
  // Positionen stehen im Vordruck einzeln untereinander (eigene Liste), nicht im Fließtext
  d.positionen=S.lohnPos.filter(p=>p.k!=="stunden"&&tot[p.k]).map(p=>({m:fmtZahl(tot[p.k]),l:p.label,e:p.einheit||""}));
  Object.keys(tot).filter(k=>k!=="stunden"&&!S.lohnPos.some(p=>p.k===k)).forEach(k=>d.positionen.push({m:fmtZahl(tot[k]),l:lbl(k),e:""}));
  if(b.taetigkeit) bem.push(b.taetigkeit);

  d.monteurAbn=`${S.settings.monteurName||"JD Brüder GbR"} ${S.settings.monteurNr||"286"}`;
  return d;

/* ---------- Fahrtenbuch ---------- */
function meineFahrzeuge(){
  return Object.values(S.fahrzeuge).filter(f=>{
    if(can.planen()) return true;
    if(can.sub()) return f.zugeordnet===myId();
    return !f.zugeordnet || f.zugeordnet===myId() || S.roles[f.zugeordnet]!=="sub";
  }).sort((a,b)=>(a.kennzeichen||"").localeCompare(b.kennzeichen||""));
}
function fahrtenVon(fzId){
  const fz=S.fahrzeuge[fzId]; if(!fz) return [];
  const list=Object.values(S.fahrten).filter(f=>f.fahrzeugId===fzId).sort((a,b)=>(a.datum||"").localeCompare(b.datum||"")||(a.am||0)-(b.am||0));
  let stand=nn(fz.startKm);
  list.forEach(f=>{
    if(f.startKm!=null && f.startKm!==""){ f._start=nn(f.startKm); f._ende=f.offen?null:(f.endKm!=null&&f.endKm!==""?nn(f.endKm):f._start+nn(f.km)); }
    else { f._start=stand; f._ende=stand+nn(f.km); }
    stand=f._ende??f._start;
  });
  return list;
}
function kmStand(fzId){ const l=fahrtenVon(fzId); if(!l.length) return nn(S.fahrzeuge[fzId]?.startKm); const x=l[l.length-1]; return x._ende??x._start; }

// Losfahren: offene Fahrt dieses Autos abschließen, Lücke klären (privat / vergessen), neue Fahrt öffnen
async function fahrtStarten({fzId,startKm,auftragId=null,zweck="",von="",nach="",art="dienst",ziel=null,vonZiel,vonAuftragId}){
  if(!S.fahrzeuge[fzId]) return null;
  startKm=nn(startKm);
  const offen=offeneFahrtFz(fzId);
  if(offen){
    if(startKm<nn(offen.startKm)){ toast(`Kleiner als bei der letzten Abfahrt (${kmFmt(offen.startKm)} km) – bitte prüfen`,3500); return null; }
    const g={...ohneTemp(offen),offen:false,endKm:startKm,km:Math.round((startKm-nn(offen.startKm))*10)/10,endAm:Date.now(),autoGeschlossen:true};
    await setDoc("fahrten/"+offen.id,g); S.fahrten[offen.id]={id:offen.id,...g};
  } else {
    const stand=kmStand(fzId);
    if(startKm<stand){ toast(`Kleiner als der letzte Stand (${kmFmt(stand)} km) – bitte prüfen`,3500); return null; }
    if(startKm>stand){
      const diff=Math.round((startKm-stand)*10)/10;
      const w=await waehleBox(`${kmFmt(diff)} km ohne Eintrag`,`Seit dem letzten Eintrag (${kmFmt(stand)} km) ist das Auto <b>${kmFmt(diff)} km</b> gefahren. Was war das?`,[["privat","🏠 Privatfahrt"],["dienst","💼 Dienstfahrt (vergessen einzutragen)"]]);
      if(!w) return null;
      const lid=neueFahrtId(), l={fahrzeugId:fzId,datum:isoTag(Date.now()),von:"",nach:"",km:diff,startKm:stand,endKm:startKm,art:w,zweck:w==="privat"?"Privatfahrt":"Dienstfahrt (nachgetragen)",fahrer:myId(),am:Date.now()-1,nachtrag:true};
      await setDoc("fahrten/"+lid,l); S.fahrten[lid]={id:lid,...l};
    }
  }
  // Tour: direkt im Anschluss an die vorige Fahrt (z. B. Baustelle → nächste Baustelle) → Fahrten werden verkettet
  const an=anschlussAn(fzId,startKm,vonZiel);
  if(vonZiel===undefined) vonZiel=an?an.ziel||null:null;
  if(vonAuftragId===undefined) vonAuftragId=an&&an.ziel==="baustelle"?an.auftragId||null:null;
  const kette=an?(an.kette||an.id):null;
  if(an&&!an.kette){ await upd("fahrten/"+an.id,{kette:an.id}).catch(()=>{}); S.fahrten[an.id]={...S.fahrten[an.id],kette:an.id}; }
  const vo=S.orders[vonAuftragId];
  if(vo && vonAuftragId!==auftragId && art!=="privat") zweck=(zweck?zweck+" · ":"")+`weiter von Auftrag ${vo.nr}`;
  if(vo && !von) von=adresseOf(vo);
  const id=neueFahrtId(), f={fahrzeugId:fzId,datum:isoTag(Date.now()),von,nach,km:0,startKm,offen:true,startAm:Date.now(),am:Date.now(),auftragId,zweck,art,ziel,fahrer:myId(),vonZiel:vonZiel||null,vonAuftragId:vonAuftragId||null,kette};
  await setDoc("fahrten/"+id,f); S.fahrten[id]={id,...f};
  return id;
}

const VON=[["baustelle","🏗 Baustelle"],["hotel","🏨 Hotel"],["firma","🏢 Firma"],["zuhause","🏠 Zuhause"],["sonst","Sonstiges"]];
// vorige Fahrt dieses Autos, an die eine neue Fahrt direkt anschließt (gleicher km-Stand, nicht zu Hause/Firma beendet)
function anschlussAn(fzId,startKm,vonZiel){
  const v=fahrtenVon(fzId).filter(f=>!f.offen&&!f.nachtrag&&f.art!=="privat").slice(-1)[0]; if(!v) return null;
  if(Math.abs(nn(v._ende??v.endKm)-nn(startKm))>=0.5) return null;
  if(["zuhause","firma"].includes(v.ziel) && !["baustelle","hotel"].includes(vonZiel)) return null;
  const alt=Date.now()-(v.endAm||v.am||0);
  if(alt>16*3600000 && !["baustelle","hotel"].includes(vonZiel)) return null;
  if(vonZiel && v.ziel && vonZiel!==v.ziel && vonZiel!=="sonst") return null;
  return v;
}

  const l=fahrtenVon(f.fahrzeugId), i=l.findIndex(x=>x.id===fid), v=l.slice(0,i).filter(x=>x.art!=="privat"&&!x.nachtrag).slice(-1)[0];
  if(!v) return toast("Keine vorige Fahrt gefunden");

  if(!v.kette) await upd("fahrten/"+v.id,{kette:k});

const geoAbst=(a,b)=>{ const R=6371000,r=x=>x*Math.PI/180, dl=r(b.lat-a.lat), dn=r(b.lon-a.lon); const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
async function geoErlaubt(){ try{ const p=await navigator.permissions?.query({name:"geolocation"}); return p?p.state:"unbekannt"; }catch(e){ return "unbekannt"; } }
function geoPos(ms=6000){
  return new Promise(res=>{ if(!navigator.geolocation) return res(null); let fertig=false; const t=setTimeout(()=>{ if(!fertig){ fertig=true; res(null); } },ms+500);
    navigator.geolocation.getCurrentPosition(p=>{ if(fertig) return; fertig=true; clearTimeout(t); res({lat:p.coords.latitude,lon:p.coords.longitude}); },()=>{ if(!fertig){ fertig=true; clearTimeout(t); res(null); } },{enableHighAccuracy:false,maximumAge:120000,timeout:ms}); });
}
// Adresse → Koordinaten (OpenStreetMap), im Gerät gemerkt
async function geoAdresse(adr){
  adr=String(adr||"").trim(); if(adr.length<6||!/\d/.test(adr)) return null;
  const k="jdGeo:"+adr.toLowerCase(); try{ const c=JSON.parse(localStorage.getItem(k)||"null"); if(c) return c; }catch(e){}
  try{ const r=await (await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&q=${encodeURIComponent(adr)}`)).json();
    if(!r?.[0]) return null; const g={lat:+r[0].lat,lon:+r[0].lon}; try{ localStorage.setItem(k,JSON.stringify(g)); }catch(e){} return g; }catch(e){ return null; }
}
// Strecken-km mit dem Auto (wie die Route in Google Maps)
async function strasseKm(a,b){
  try{ const r=await (await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`)).json();

}

async function routeErmitteln(f){
  if(f.routeKm||f._routeVersucht) return f.routeKm||null; S.fahrten[f.id]._routeVersucht=true;
  const zA=fahrtZielAdr(f); if(!zA) return null;

async function fahrtenbuchPdf(fzId,monat){
  const fz=S.fahrzeuge[fzId]; const all=fahrtenVon(fzId); const list=all.filter(f=>(f.datum||"").startsWith(monat));
  const jsPDF=await loadJsPDF(); const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"landscape"});
  const mName=new Date(monat+"-01").toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  pdf.setFontSize(16); pdf.text(`Fahrtenbuch – ${fz.kennzeichen}${fz.name?" ("+fz.name+")":""}`,14,16);
  pdf.setFontSize(10); pdf.text(`${S.settings.monteurName||"JD Brüder GbR"} · ${mName} · ${list.length} Fahrten · ${list.reduce((a,f)=>a+nn(f.km),0)} km`,14,23);
  const cols=[["Datum",22],["Fahrer",32],["Von",58],["Nach",58],["Auftrag",22],["Zweck",42],["km",14],["km-Stand",22]];
  let y=32; const head=()=>{ pdf.setFont(undefined,"bold"); let x=14; cols.forEach(([t,w])=>{ pdf.text(t,x,y); x+=w; }); pdf.setFont(undefined,"normal"); pdf.line(14,y+1.5,284,y+1.5); y+=6; };
  head();
  list.forEach(f=>{ const o=S.orders[f.auftragId]; const priv=f.art==="privat"; const row=[new Date(f.datum).toLocaleDateString("de-DE"),nameOf(f.fahrer)==="Ich"?(S.me?.name||""):nameOf(f.fahrer),priv?"":f.von||"",priv?"":f.nach||"",o?o.nr:"",priv?"Privatfahrt":f.zweck||"",f.offen?"–":String(nn(f.km)),`${f._start}–${f._ende??"unterwegs"}`];
    const wrapped=row.map((t,i)=>pdf.splitTextToSize(String(t),cols[i][1]-2)); const hh=Math.max(...wrapped.map(w=>w.length))*4.2;
    if(y+hh>196){ pdf.addPage(); y=16; head(); }
    let x=14; wrapped.forEach((w,i)=>{ pdf.text(w,x,y); x+=cols[i][1]; }); y+=hh+1.5; pdf.setDrawColor(220); pdf.line(14,y-2.5,284,y-2.5); pdf.setDrawColor(0); });
  if(list.length){ y+=3; pdf.setFont(undefined,"bold"); pdf.text(`Kilometerstand Monatsanfang: ${list[0]._start}   ·   Monatsende: ${list[list.length-1]._ende??list[list.length-1]._start}   ·   davon privat: ${list.filter(f=>f.art==="privat").reduce((a,f)=>a+nn(f.km),0)} km`,14,y); }
  return {blob:pdf.output("blob"),name:`Fahrtenbuch_${(fz.kennzeichen||"Auto").replace(/[^\w-]+/g,"_")}_${monat}.pdf`};
}

function viewWoche(){
  if(S.wochenNurMeine===null) S.wochenNurMeine = (S.role==="monteur" && !S.isOwner);
  const weeks=[]; for(let i=-1;i<5;i++){ const d=new Date(); d.setDate(d.getDate()+i*7); weeks.push(isoWeek(d)); }
  let h=`<div class="row between" style="margin-bottom:6px"><h2 style="margin:0;font-size:20px">Wochenplan</h2>
    <div class="seg" id="wSeg" style="min-width:200px"><button data-w="0" class="${!S.wochenNurMeine?"on":""}">Alle</button><button data-w="1" class="${S.wochenNurMeine?"on":""}">Nur meine</button></div></div>`;
  weeks.forEach(w=>{
    let items=Object.values(S.orders).filter(o=>{ const p=planWeek(o); return p.kw===w.kw && p.jahr===w.jahr; });
    items=items.filter(sichtbar);
    if(S.wochenNurMeine) items=items.filter(o=>(o.monteure||[]).includes(myId()));
    const m=mondayOf(w.jahr,w.kw); const f=new Date(m); f.setDate(f.getDate()+4);
    h+=`<div class="kw"><b>KW ${w.kw}</b><span class="small mute">${m.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}–${f.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}</span>${w.kw===NOW.kw?`<span class="now">diese Woche</span>`:""}</div>`;
    if(!items.length){ h+=`<div class="small mute" style="padding:0 4px 6px">Nichts geplant.</div>`; return; }
    // nach Monteur gruppieren
    const by={}; items.forEach(o=>{ const ms=(o.monteure&&o.monteure.length)?o.monteure:["_"]; ms.forEach(mm=>(by[mm]=by[mm]||[]).push(o)); });
    Object.keys(by).sort((a,b)=>a==="_"?1:b==="_"?-1:nameOf(a).localeCompare(nameOf(b))).forEach(mm=>{
      if(S.wochenNurMeine && mm!==myId()) return;
      h+=`<div class="card" style="padding:10px 12px"><div class="row" style="margin-bottom:6px">${mm==="_"?`<span class="chip warn">Noch niemand eingeteilt</span>`:`<span class="av">${esc(initials(mm))}</span><b>${esc(nameOf(mm))}</b>`}</div>
      ${by[mm].sort((a,b)=>(a.termin||9e15)-(b.termin||9e15)).map(o=>`<a href="#a-${esc(o.id)}" class="row between" style="text-decoration:none;color:inherit;padding:7px 0;border-top:1px solid var(--line)">
        <div><b>${esc(o.nr)}</b> · ${esc(o.bauvorhaben||"")}<div class="small mute">${esc(o.plzOrt||"")}</div></div>
        <div style="text-align:right">${o.terminStatus==="fest"?`<span class="chip ok">${esc(o.termin?fmtDate(o.termin):"fest")}</span>`:`<span class="chip warn">offen</span>`}${istFertig(o)?`<div class="small" style="color:var(--ok)">✓ erledigt</div>`:""}</div></a>`).join("")}</div>`;
    });
  });
  return h;
}

  h+=statistikCard();

// Der Subunternehmer sieht nur seine eigenen Preise (Liste vom Chef festgelegt) – nie, was meta an JD Brüder zahlt.
const monatKey=ts=>{ const d=new Date(ts||0); return d.getFullYear()*100+d.getMonth(); };
const monatName=k=>new Date(Math.floor(k/100),k%100,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
function subPosten(){
  return Object.values(S.lohn).filter(l=>l.uid===myId()).map(l=>{ const o=S.orders[l.auftragId]||{nr:l.nr,id:l.auftragId}; const c=calcLohn(l,S.preise)||{lines:[],total:0};
    const an=o.gemeinsam?o.subAnteil?.[myId()]:null;
    const frei=o.gemeinsam?!!an?.bestaetigtAm:(!!o.subGeprueftAm && o.berichtStatus!=="pruefung");
    const am=(o.gemeinsam?an?.bestaetigtAm||an?.abgegebenAm:o.subGeprueftAm)||o.abschluss?.am||l.am||0; return {l,o,c,am,fertig:frei}; }).filter(x=>x.c.total>0||x.c.lines.length).sort((a,b)=>b.am-a.am);
}
function subAbrechnungText(liste,k){
  const name=S.preise?.name||nameOf(myId());
  const L=[`Abrechnung ${name} an JD Brüder – ${monatName(k)}`,""];
  liste.forEach(x=>{ L.push(`Auftrag ${x.o.nr||""}${x.o.bauvorhaben?" – "+x.o.bauvorhaben:""}${x.o.abschluss?" (montiert am "+new Date(x.o.abschluss.am).toLocaleDateString("de-DE")+")":""}`);
    x.c.lines.forEach(z=>L.push(`  ${z.menge!==""?String(z.menge).replace(".",",")+" × ":""}${z.label}${z.ep!==""?" à "+fmtEUR(z.ep):""} = ${fmtEUR(z.gp)}`));
    L.push(`  Summe Auftrag: ${fmtEUR(x.c.total)}`,""); });
  L.push(`Gesamtsumme netto: ${fmtEUR(r2(liste.reduce((a,x)=>a+x.c.total,0)))}`);
  return L.join("\n");
}

  if(!S.preise) return `<h2 style="margin:0 0 10px;font-size:20px">Meine Abrechnung</h2><div class="banner info">Für dich ist noch keine Preisliste hinterlegt. JD Brüder richtet sie ein – danach siehst du hier deine Beträge.</div>`;

   <div class="sum"><div class="card"><b>${fmtEUR(summe(fertig))}</b><span>freigegeben – Rechnung schreiben</span></div><div class="card"><b>${fmtEUR(summe(offen))}</b><span>offen / in Prüfung</span></div><div class="card"><b>${liste.length}</b><span>Aufträge</span></div></div>
   <div class="banner info small">Ablauf: Du schreibst den Montagebericht → JD Brüder prüft ihn → nach der Freigabe kannst du deine Rechnung über die freigegebenen Aufträge schreiben.</div>`;
  if(!liste.length) h+=`<div class="empty">In ${monatName(k)} noch keine Positionen.</div>`;
  liste.forEach(x=>{ h+=`<a class="order" href="#a-${esc(x.o.id)}"><div class="row between"><span class="nr">${esc(x.o.nr||"")}</span><b>${fmtEUR(x.c.total)}</b></div>
     <div class="small mute">${esc(x.o.bauvorhaben||"")}${x.o.abschluss?` · montiert am ${new Date(x.o.abschluss.am).toLocaleDateString("de-DE")}`:""}</div>
     <div class="small" style="margin-top:6px">${x.c.lines.map(z=>`${z.menge!==""?String(z.menge).replace(".",",")+"× ":""}${esc(z.label)} <span class="mute">${fmtEUR(z.gp)}</span>`).join(" · ")}</div>
     <div class="chips">${x.fertig?`<span class="chip abh">✓ Freigegeben – Rechnung schreiben</span>${x.o.berichtStatus==="gesendet"?`<span class="chip ok">an meta gesendet</span>`:""}`:x.o.berichtStatus==="pruefung"?`<span class="chip warn">Offen – in Prüfung bei JD Brüder</span>`:`<span class="chip">Offen – Bericht noch nicht abgeschlossen</span>`}</div></a>`; });
  if(fertig.length) h+=`<div class="grid2" style="margin-top:8px"><button class="btn" id="subKopie">📋 Als Text kopieren</button><button class="btn pri" id="subPdf">📄 Als PDF</button></div>
   <div class="small mute" style="margin-top:6px">Enthält nur von JD Brüder freigegebene Aufträge aus ${monatName(k)} mit deinen Preisen.</div>`;

function bindSubAbrechnung(){
  const sel=$("#subMonat"); if(sel) sel.onchange=()=>{ S.subMonat=+sel.value; render(); };
  const k=()=>{ const ms=[...new Set(subPosten().map(x=>monatKey(x.am)))].sort((a,b)=>b-a); return ms.includes(S.subMonat)?S.subMonat:(ms[0]??monatKey(Date.now())); };
  const fertige=()=>subPosten().filter(x=>x.fertig&&monatKey(x.am)===k());
  $("#subKopie") && ($("#subKopie").onclick=async()=>{ const t=subAbrechnungText(fertige(),k()); try{ await navigator.clipboard.writeText(t); toast("Kopiert – in deine Rechnung einfügen"); }catch(e){ modal(`<h2>Abrechnung</h2><textarea class="i" style="min-height:300px">${esc(t)}</textarea><button class="btn block" data-close style="margin-top:10px">Schließen</button>`); } });

      let y=20; for(const l of pdf.splitTextToSize(subAbrechnungText(fertige(),k()),170)){ if(y>282){ pdf.addPage(); y=20; } pdf.text(l,20,y); y+=5.4; }
      const dl=await window.claude.use("downloads").catch(()=>null); const fn=`Abrechnung_${(S.preise?.name||"Sub").replace(/\W+/g,"_")}_${monatName(k()).replace(/\s+/g,"_")}.pdf`;
      if(dl) await dl.save({filename:fn,data:pdf.output("blob")}); }catch(e){ if(e?.code!=="cancelled") toast("PDF fehlgeschlagen: "+(e.message||e)); } });
}

function bindNachrichten(id){
  const o=S.orders[id]; if(!o) return;
  $("#msgAuf") && ($("#msgAuf").onclick=()=>{ (S.msgOffen=S.msgOffen||{})[id]=true; render(); setTimeout(()=>$("#msgText")?.focus(),50); });
  const ta=$("#msgText"), sb=$("#msgSend");
  const senden=async()=>{ if(!ta.value.trim()) return toast("Bitte erst etwas schreiben"); sb.disabled=true; const t=ta.value; ta.value=""; ta.blur(); if(!await nachrichtSenden(id,t)){ toast("Nicht gesendet – bitte nochmal"); } else toast("Gesendet ✓"); };
  sb && (sb.onclick=senden);
  ta && (ta.onkeydown=e=>{ if(e.key==="Enter" && !e.shiftKey && !/Android|iPhone|iPad/i.test(navigator.userAgent)){ e.preventDefault(); senden(); } });
  document.querySelectorAll("[data-schnell]").forEach(b=>b.onclick=()=>{ if(!ta) return; ta.value=b.dataset.schnell; ta.focus(); });
  const m=$("#msgKarte .msgs"); if(m) m.scrollTop=m.scrollHeight;
  $("#tOk") && ($("#tOk").onclick=async()=>{ $("#tOk").disabled=true; const k=terminKey(o);
    await upd(orderPath(id),{terminOk:{[myId()]:k}}); S.orders[id]={...S.orders[id],terminOk:{...(o.terminOk||{}),[myId()]:k}};
    nachrichtSenden(id,`👍 Termin ${kurzDatum(o.termin)} passt.`); toast("Danke – JD Brüder sieht: Termin passt ✓",3000); });
  $("#tNein") && ($("#tNein").onclick=()=>{ (S.msgOffen=S.msgOffen||{})[id]=true; render(); setTimeout(()=>{ const t=$("#msgText"); if(!t) return; t.value=`Termin ${kurzDatum(o.termin)} passt leider nicht, weil `; t.focus(); t.scrollIntoView({block:"center"}); },60); });
}

function rechnungsText(o,f){
  const lines=[`Rechnung – Montageleistung Auftrag ${o.nr}`,`Bauvorhaben: ${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}`, o.vorgang?`meta-Vorgang: ${o.vorgang}`:"", `Leistungszeitraum: ${o.abschluss?new Date(o.abschluss.am).toLocaleDateString("de-DE"):"KW "+(o.kw||"")}`,"","Pos.\tArtikel\tMenge\tEP\tGP"];
  (f.positionen||[]).forEach((p,i)=>lines.push(`${i+1}\t${p.artikel}\t${p.menge}\t${Number(p.ep).toFixed(2)}\t${Number(p.gp).toFixed(2)}`));
  lines.push("",`Summe netto: ${Number(f.summe).toFixed(2)} €`);
  return lines.filter(l=>l!==null).join("\n");
}

async function savePreise(patch){
  const cur=S.preise?{...S.preise}:{preise:{},sichtbarFuer:[]};
  const chefs=Object.keys(S.roles).filter(k=>S.roles[k]==="chef");
  const alt=new Set(cur.sichtbarFuer||[]); patch={...patch,sichtbarFuer:chefs};
  const next={...cur,...patch,preise:{...(cur.preise||{}),...(patch.preise||{})}};
  if(patch.preise===null) next.preise={};
  S.preise=next;
  await setDoc("lohn/preise",next);
  // freigegebene Mitarbeiter bekommen eine Kopie
  const copy={preise:next.preise,stockSatz:next.stockSatz,kmSelbst:next.kmSelbst,kmMit:next.kmMit,listen:next.listen||{},zuordnung:next.zuordnung||{}};
  for(const id of (next.sichtbarFuer||[])) await setDoc("lohnsicht/"+id,copy);
  // Subunternehmer mit eigener Preisliste (z. B. Zeltwald) sehen nur ihre eigene Liste – keine anderen Preise
  const subs=Object.keys(S.roles).filter(k=>S.roles[k]==="sub");
  const mitListe=new Set();
  for(const id of subs){ const L=next.listen?.[next.zuordnung?.[id]]; if(!L) continue; mitListe.add(id);
    await setDoc("lohnsicht/"+id,{name:L.name||"",preise:L.preise||{},stockSatz:L.stockSatz,kmSelbst:L.kmSelbst,kmMit:L.kmMit}); }
  for(const id of (cur.subSicht||[])) if(!mitListe.has(id) && !chefs.includes(id)){ try{ await S.db.doc("lohnsicht/"+id).delete(); }catch(e){} }
  if(String(cur.subSicht||[])!==String([...mitListe])){ next.subSicht=[...mitListe]; S.preise=next; await setDoc("lohn/preise",next); }
  for(const id of alt) if(!chefs.includes(id)&&!mitListe.has(id)){ try{ await S.db.doc("lohnsicht/"+id).delete(); }catch(e){} }
}

function signDialog(id){

   <label class="f">Unterschrift</label><canvas class="sig" id="cv"></canvas>
   <div class="row between" style="margin-top:4px"><span class="small mute" id="sh">Mit dem Finger unterschreiben</span><button class="btn sm ghost" id="clr">↺ Löschen</button></div>
   <label class="f">4. Fotos (bei Bedarf)</label><div class="thumbs" id="af"></div>
   <label class="btn sm ghost" style="margin-top:6px">＋ Fotos hinzufügen<input type="file" accept="image/*" multiple hidden id="afi"></label>
   <div class="grid2" style="margin-top:14px"><button class="btn" data-close>Abbrechen</button><button class="btn pri" id="ok">Speichern</button></div>`,(m,close)=>{
    let L=v0.leistung, MJ=v0.maengelJa==="ja"?"ja":"nein"; const fotos=[];
    m.querySelectorAll("#lst [data-l]").forEach(b=>b.onclick=()=>{ L=b.dataset.l; m.querySelectorAll("#lst button").forEach(x=>x.classList.toggle("on",x===b)); m.querySelector("#lso").style.display=L==="sonst"?"":"none"; });
    m.querySelectorAll("#mgl [data-m]").forEach(b=>b.onclick=()=>{ MJ=b.dataset.m; m.querySelectorAll("#mgl button").forEach(x=>x.classList.toggle("on",x===b)); m.querySelector("#mtx").style.display=MJ==="ja"?"":"none"; });
    // Unterschriftsfeld: wird beim Öffnen und nach „Löschen“ komplett neu eingerichtet,
    // damit danach wieder gezeichnet und gespeichert werden kann.
    const cv=m.querySelector("#cv"); let ctx=null, draw=false, any=false;
    const setup=()=>{
      const r=cv.getBoundingClientRect(); const dpr=window.devicePixelRatio||1;
      cv.width=Math.max(1,Math.round((r.width||300)*dpr)); cv.height=Math.max(1,Math.round((r.height||200)*dpr)); // setzt Inhalt und Zeichenzustand zurück
      ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0b1b33";
      draw=false; any=false; m.querySelector("#sh").textContent="Mit dem Finger unterschreiben";
    };
    requestAnimationFrame(()=>{ if(!ctx) setup(); });
    const pt=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
    const stop=e=>{ draw=false; try{ if(e&&cv.hasPointerCapture(e.pointerId)) cv.releasePointerCapture(e.pointerId); }catch(err){} };
    cv.onpointerdown=e=>{ if(!ctx) setup(); e.preventDefault(); draw=true; any=true; try{ cv.setPointerCapture(e.pointerId); }catch(err){} const [x,y]=pt(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); m.querySelector("#sh").textContent="✓ Unterschrift erfasst"; };

async function shrink(file,max=1600,q=.82){
  if(!/^image\//.test(file.type)||/svg/.test(file.type)) return file;
  try{
    const bmp=await createImageBitmap(file);
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  }catch(e){ return file; }
}

const DECK_PROMPT = `Du bekommst Fotos/Scans von Unterlagen eines Montageauftrags der Firma meta Trennwandanlagen (Aufmaß-Deckblatt, Produktdeckblatt, Zeichnungen).
Lies die Felder aus und antworte NUR mit einem JSON-Objekt mit diesen Schlüsseln (leerer String, wenn nicht vorhanden):
{"fertigungsNr":"Fertigungs-Auftrags-Nr. z.B. 17714/1","vorgang":"Auftrags-Vorgangs-Nr.","berater":"meta-Berater mit Telefon","adresse":"Baustellenanschrift: Straße Nr, PLZ Ort","bauvorhabenName":"z.B. Wohnquartier","bauleiterName":"","bauleiterTel":"","bauleiterMail":"","oeffnungszeiten":"","geschosse":"Montage in Geschoss","aufzug":"","montageHinweise":"","kaufmHinweise":"Kaufmännische Hinweise kurz","technHinweise":"Technische Hinweise vom Produktdeckblatt","aufbau":"Was aufgebaut wird: Modell/Design, Anzahl Kabinen, Anlagenhöhe, Farben, Bodenanschluss – kurz in einer Zeile","kabinen":"Anzahl Kabinen als Zahl","zahlungspflichtiger":"Firma, Ort","kw":"gewünschte Montage-KW als Zahl"}
Handschriftliche Werte mit lesen. Nichts erfinden.
Zusätzlich: "unsicher": Liste der Schlüssel, die du NICHT sicher lesen konntest (unleserlich, abgeschnitten, mehrdeutig) oder die im Dokument fehlen, aber wichtig wären – besonders "bauleiterTel" und "adresse". Beispiel: "unsicher":["bauleiterTel"].`;
async function readDeckblatt(id, blobs){
  if(!S.sample) throw new Error("Claude-Auslesen ist hier nicht verfügbar");
  let lim={}; try{ lim=await S.sample.limits(); }catch(e){}
  if(!lim.images) throw new Error("Bilder auslesen ist hier nicht verfügbar");
  const imgs=[]; for(const b of blobs.slice(0,4)) imgs.push(/pdf/i.test(b.type||"")?b:await shrink(b,1800,.85));
  const res=await S.sample.json(DECK_PROMPT,{images:imgs,modelTier:"default"});
  const o=S.orders[id]; const p={};
  const map={vorgang:"vorgang",berater:"berater",adresse:"adresse",bauleiterName:"bauleiterName",bauleiterTel:"bauleiterTel",bauleiterMail:"bauleiterMail",oeffnungszeiten:"oeffnungszeiten",geschosse:"geschosse",aufzug:"aufzug",montageHinweise:"montageHinweise",kaufmHinweise:"kaufmHinweise",technHinweise:"technHinweise",aufbau:"aufbau",kabinen:"kabinen",zahlungspflichtiger:"zahlungspflichtiger"};
  for(const [src,dst] of Object.entries(map)){ const v=String(res?.[src]??"").trim(); if(v && v!=="-" && !o[dst]) p[dst]=v; }
  if(!o.kw && parseInt(res?.kw,10)) p.kw=parseInt(res.kw,10);
  const n=Object.keys(p).length;
  const uns=(Array.isArray(res?.unsicher)?res.unsicher:[]).map(String).filter(k=>map[k]||k==="bauvorhabenName");
  ["bauleiterTel","adresse"].forEach(k=>{ if(!o[k]&&!p[k]&&!uns.includes(k)) uns.push(k); });
  p.deckUnsicher=uns; p.deckblattGelesenAm=Date.now();
  await upd(orderPath(id),p);
  return n;
}

async function importUnterlagen(id,progress=()=>{}){
  const o=S.orders[id]; const z=o?.zusageMail; if(!z?.att?.length) return 0;
  const have=new Set(Object.values(S.fotoFor===id?S.fotos:{}).map(f=>f.mailAtt).filter(Boolean));

    if(!img) continue;
    const bin=atob(img.data); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const blob=new Blob([u8],{type:img.mimeType||a.mimeType||"image/jpeg"});
    blobs.push(blob);
    if(S.assets){ const sb=/pdf/i.test(blob.type)?blob:await shrink(blob,2000,.85); const up=await S.assets.upload(sb); await S.db.collection("fotos").doc().set({auftragId:id,kat:"unterlagen",assetId:up.id,name:a.filename,typ:sb.type,mailAtt:key,am:Date.now(),von:myId()}); }

  }
  return n;
}

const pushUnterstuetzt=()=>"serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const pushAktiv=()=>{ try{ return pushUnterstuetzt() && Notification.permission==="granted" && !!localStorage.getItem("jdPushId"); }catch(e){ return false; } };
function b64uZuBytes(s){ const p="=".repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
async function pushEinschalten(){
  const reg=await navigator.serviceWorker.ready;
  const perm=await Notification.requestPermission();
  if(perm!=="granted") throw new Error("Benachrichtigungen wurden nicht erlaubt. Du kannst sie in den Einstellungen des Handys für diese App erlauben.");
  const sub=(await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uZuBytes(window.JD_CONFIG?.vapid||"")});
  let h=0; for(const ch of sub.endpoint) h=(h*31+ch.charCodeAt(0))>>>0;
  const id=myId()+"_"+h.toString(36);
  await setDoc("push/"+id,{uid:myId(),sub:sub.toJSON(),am:Date.now(),geraet:(navigator.userAgent.match(/\(([^)]+)\)/)||[])[1]||""});
  localStorage.setItem("jdPushId",id);
}
async function pushAusschalten(){
  const id=localStorage.getItem("jdPushId");
  try{ const sub=await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  if(id){ try{ await S.db.doc("push/"+id).delete(); }catch(e){} }
  localStorage.removeItem("jdPushId");
}

  L.push("Guten Tag,","");
  if(typ==="leerfahrt") L.push(`Auftrag ${o.nr} (${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}): Leerfahrt – die Baustelle war nicht montagefertig, eine Montage war nicht möglich.`);
  else if(typ==="rekla") L.push(`Auftrag ${o.nr} (${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}): Montage abgeschlossen, es gibt eine Reklamation (siehe unten).`);
  else L.push(`Auftrag ${o.nr} (${[o.bauvorhaben,o.plzOrt].filter(Boolean).join(", ")}): Baustelle erfolgreich abgeschlossen.`);
  L.push("","Montagebericht:");
  if(typ==="leerfahrt"&&lf){ L.push(`- Status: ${lf.status||"Leerfahrt"}`,`- Datum: ${new Date(lf.am).toLocaleDateString("de-DE")}`,lf.fahrzeug?`- Fahrzeug: ${fahrzeugText(lf)}${mitAnhaenger(lf)?" – Bitte beachten: Anhängerfahrt":""}`:null,`- Selbst gefahrene km: ${lf.km||"-"}`,`- Personen vor Ort: ${lf.personen||"-"}`,lf.personenMit?`- Mitgefahren: ${lf.personenMit}`:null,`- Zeit: ${Math.floor(lf.minuten/60)} Std ${lf.minuten%60} Min`,`- Grund: ${lf.grund}`,lf.schreibenAm?`- Schreiben an den Kunden gesendet am ${new Date(lf.schreibenAm).toLocaleDateString("de-DE")}${lf.schreibenAn?" an "+lf.schreibenAn:""}`:null); }
  else {
    const uebern=naechteText(b)||"-";
    if(istReklaAuftrag(o) && arbeitszeitMin(o)>0) L.push(`- Reklamation – Arbeitszeit: ${fmtHMin(arbeitszeitMin(o))} Std.${b.personen?` × ${b.personen} Personen`:""}`);
    L.push(`- Montagetag(e): ${tage||"-"}`,`- Personen vor Ort: ${b.personen||"-"}`,`- Selbst gefahrene km: ${leer(b.istKm)?"-":b.istKm}`,hotelKm(o)?`- Hotelfahrten (Baustelle ↔ Hotel): ${hotelText(o)}`:null,o.einsatz?.fahrzeug?`- Fahrzeug: ${fahrzeugText(o.einsatz)}${mitAnhaenger(o.einsatz)?" – Bitte beachten: Anhängerfahrt":""}`:null,(istReklaAuftrag(o)&&!b.geschosse?null:`- Geschosse (Material getragen): ${b.geschosse||"-"}`),`- Übernachtungen: ${uebern}`);
    const tot=summeMengen(o); const pos=Object.entries(tot).filter(([k])=>k!=="stunden").map(([k,v])=>`${fmtZahl(v)}× ${(S.lohnPos.find(p=>p.k===k)||{}).label||k}`);
    if(pos.length) L.push(`- Positionen:`,...pos.map(x=>`   • ${x.replace("× "," × ")}`));
    if(b.taetigkeit) L.push(`- Ausgeführt: ${b.taetigkeit}`);
    sonderFertig(b).forEach(s=>L.push(`- ${istReklaAuftrag(o)?"Zusatzarbeit":"Sonderarbeit"}: ${sonderZeile(s)}`));
    if(b.bemerkung) L.push(`- Bemerkungen: ${b.bemerkung}`);
    vorleistungZeilen(o).forEach(z=>L.push(`- ${z}`));
    if(o.unterschrift) L.push(`- Sichtabnahme unterschrieben von: ${o.unterschrift.name||vd(o).abnahmeName||"-"}${vd(o).firma?` (${vd(o).firma})`:""} am ${new Date(o.unterschrift.am).toLocaleDateString("de-DE")}`);
    else if(o.abnahmePapier) L.push(`- Sichtabnahme: auf Papier unterschrieben`);
    else L.push(`- Sichtabnahme: steht noch aus`);
  }
  if((typ==="rekla"||typ==="leerfahrt") && rk){ L.push("","Reklamation:",`- Ursache: ${URSACHEN[rk.ursache]||rk.ursache}`,`- Beschreibung: ${rk.text}`); }
  L.push("",typ==="leerfahrt"?"Montagebericht im Anhang.":abnahmeOk(o)?"Montagebericht und Sichtabnahmebescheinigung im Anhang.":"Montagebericht im Anhang. Die Sichtabnahme reichen wir nach.","","Mit freundlichen Grüßen","JD Brüder");
  return L.filter(x=>x!==null).join("\n");
}
async function blobToB64(blob){ return await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
function berichtDialog(id){
  const o=S.orders[id];
  const typ=o.berichtTyp||o.abschluss?.typ||"ok";
  const rk=Object.values(S.reklas).filter(r=>r.auftragId===id).sort((a,c)=>c.am-a.am)[0];
  const cands=[];
  Object.values(S.fotos).forEach(f=>{ if(/^image/.test(f.typ||"image") && f.kat!=="unterlagen") cands.push({assetId:f.assetId,label:{vorher:"Vorher",nachher:"Nachher",vordruck:"Berichtszettel",abnahme:"Sichtabnahme"}[f.kat]||(/^sonder:/.test(f.kat)?"Sonderarbeit":f.kat),def:f.kat!=="vorher"}); });
  if((typ==="rekla"||typ==="leerfahrt") && rk) (rk.fotos||[]).forEach(a=>cands.push({assetId:a,label:"Reklamation",def:true}));
  if(o.unterschrift) cands.push({assetId:o.unterschrift.assetId,label:"Unterschrift",def:true,png:true});
  const subject=`${o.nr} ${o.bauvorhaben||""}`.trim()+(typ==="leerfahrt"?" – Leerfahrt":typ==="rekla"?" – Reklamation":"");
  const to=istTest(o)?testAn():(S.settings.berichtEmail||"Montagebericht@meta.de");
  modal(`<h2>Bericht abschicken</h2>${testHinweis(o)}
   <label class="f">PDF-Vorschau Montagebericht</label>
   <div id="pv" style="min-height:60px"><span class="spin"></span> Vorschau wird erstellt …</div>
   <div class="small mute">Stimmt etwas nicht? Schließen und im Montagebericht oder unter „Montagebericht-PDF“ korrigieren.</div>
   <label class="f">An</label><input class="i" id="to" value="${esc(to)}">
   <label class="f">Betreff</label><input class="i" id="sj" value="${esc(subject)}">
   <label class="f">Text</label><textarea class="i" id="bd" style="min-height:240px">${esc(berichtText(o))}</textarea>
   <label class="row" style="margin-top:10px;gap:8px"><input type="checkbox" id="withPdf" checked style="width:20px;height:20px"><b>Montagebericht als PDF anhängen${abnahmeOk(o)?" (mit unterschriebener Sichtabnahme)":""}</b></label>
   ${abnahmeOk(o)?"":`<div class="small mute">Sichtabnahme noch nicht erfolgt – sie wird nicht mitgeschickt.</div>`}
   <label class="f">Fotos anhängen</label>
   <div class="thumbs">${cands.map((c,i)=>`<label class="t" style="cursor:pointer"><img src="/_blob/${esc(c.assetId)}" alt=""><input type="checkbox" data-ci="${i}" ${c.def?"checked":""} style="position:absolute;top:5px;left:5px;width:20px;height:20px"><span style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 4px">${esc(c.label)}</span></label>`).join("")||`<span class="small mute">Keine Fotos vorhanden.</span>`}</div>
   <div id="st" class="small mute" style="margin-top:8px"></div>
   <div class="grid2" style="margin-top:14px"><button class="btn" data-close>Abbrechen</button><button class="btn pri" id="ok">✉︎ Jetzt senden</button></div>`,(m,close)=>{
    renderVordruck(o).then(cs=>{ const show=o.unterschrift?cs:cs.slice(0,1); m.querySelector("#pv").innerHTML=show.map(c=>`<img src="${c.toDataURL("image/jpeg",.8)}" alt="Vorschau" style="width:100%;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:zoom-in" data-z>`).join(""); m.querySelectorAll("#pv [data-z]").forEach(im=>im.onclick=()=>vorschauZeigen(show,`Montagebericht ${o.nr}`)); }).catch(()=>{ m.querySelector("#pv").textContent="Vorschau nicht möglich."; });
    m.querySelector("#ok").onclick=async()=>{
      const btn=m.querySelector("#ok"), st=m.querySelector("#st");
      const toV=m.querySelector("#to").value.trim(); if(!/@/.test(toV)) return toast("Empfänger fehlt");
      if(!await confirmBox("Bericht wirklich senden?",`An ${esc(toV)} – Betreff „${esc(m.querySelector("#sj").value)}“`,"Senden","pri")) return;
      btn.disabled=true; st.innerHTML=`<span class="spin"></span> Fotos werden vorbereitet …`;
      const atts=[]; let size=0, skipped=0;
      if(m.querySelector("#withPdf").checked){
        try{ st.innerHTML=`<span class="spin"></span> PDF wird erstellt …`; let pdf=await makeVordruckPdf(o); if(pdf.size>520000) pdf=await makeVordruckPdf(o,.5); const b64=await blobToB64(pdf); size+=b64.length; atts.push({content:b64,filename:`Montagebericht_${idOf(o.nr)}.pdf`,mimeType:"application/pdf"}); }
        catch(e){ btn.disabled=false; st.textContent="PDF konnte nicht erstellt werden: "+(e.message||e); return; }
      }
      if(!o.unterschrift && o.abnahmeDatei && !/^image/.test(o.abnahmeDatei.typ||"")){ try{ const raw=await (await fetch("/_blob/"+o.abnahmeDatei.assetId)).blob(); const b64=await blobToB64(raw); size+=b64.length; atts.push({content:b64,filename:`Sichtabnahme_unterschrieben_${idOf(o.nr)}.pdf`,mimeType:raw.type||"application/pdf"}); }catch(e){} }
      const sel=[...m.querySelectorAll("[data-ci]:checked")].map(x=>cands[+x.dataset.ci]);
      for(const c of sel){
        try{
          const raw=await (await fetch("/_blob/"+c.assetId)).blob();
          const b=c.png?raw:await shrink(raw,1280,.72);
          const b64=await blobToB64(b);
          if(size+b64.length>850000){ skipped++; continue; }
          size+=b64.length; atts.push({content:b64,filename:`${idOf(o.nr)}_${c.label}_${atts.length+1}.${c.png?"png":"jpg"}`,mimeType:c.png?"image/png":"image/jpeg"});
        }catch(e){ skipped++; }
      }
      st.innerHTML=`<span class="spin"></span> wird gesendet …`;
      try{
        const r=await S.mcp.callTool(GM,"send_message",{to:[toV],subject:m.querySelector("#sj").value.trim(),body:m.querySelector("#bd").value,attachments:atts});
        await upd(orderPath(id),{berichtStatus:"gesendet",berichtGesendetAm:Date.now(),berichtAn:toV,berichtMailId:r.payload?.id||""});
        close(); toast("Bericht gesendet ✓"+(skipped?` (${skipped} Foto(s) zu groß, nicht angehängt)`:""),4000);
      }catch(e){
        btn.disabled=false;
        st.textContent = e.code==="approval_required" ? "Du darfst noch keine Mails über die App senden – der Bericht bleibt für den Chef zum Versand bereit." : (e.code==="server_unavailable"||e.code==="upstream_error") ? "Unklar, ob die Mail raus ist – bitte im Gmail-Postausgang nachsehen, bevor du nochmal sendest." : "Nicht gesendet: "+mcpMsg(e);
      }
    };
  });
}

/* ============ Aktualisieren: neuesten Stand laden ============ */
async function jetztAktualisieren(){
  const b=$("#aktualisieren"); if(b){ b.classList.add("dreht"); b.disabled=true; }
  try{ const reg=await navigator.serviceWorker?.getRegistration(); await reg?.update(); }catch(e){}
  try{ await Promise.all(["index.html","claude-shim.js","config.js","sw.js"].map(u=>fetch(u,{cache:"reload"}).catch(()=>{}))); }catch(e){}
  location.reload();
}
// Gibt es eine neuere Version? (version.json wird beim Bauen geschrieben) → roter Punkt am Knopf
async function versionPruefen(){
  if(!window.JD_BUILD) return;
  try{ const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok) return; const v=(await r.json()).build;
    if(v && v!==window.JD_BUILD){ $("#aktualisieren")?.classList.add("neu"); if(!S.versionGemeldet){ S.versionGemeldet=true; toast("Neue Version da – oben rechts auf ↻ tippen",4500); } } }catch(e){}
}
$("#aktualisieren").onclick=jetztAktualisieren;
// Fußleiste („Insel“): beim Runterscrollen und beim Tippen in Felder ausblenden, beim Hochscrollen wieder zeigen
{ let letzt=window.scrollY;
  const setze=weg=>document.body.classList.toggle("nav-weg",weg);
  window.addEventListener("scroll",()=>{ const y=window.scrollY, d=y-letzt;
    if(Math.abs(d)>6){ setze(d>0 && y>80); letzt=y; }
    if(y<40 || window.innerHeight+y>=document.body.scrollHeight-4) setze(false); },{passive:true});
  document.addEventListener("focusin",e=>{ if(e.target.matches?.("input,textarea,select")) setze(true); });
  document.addEventListener("focusout",()=>setTimeout(()=>{ if(!document.activeElement?.matches?.("input,textarea,select")) setze(false); },120));
  window.addEventListener("hashchange",()=>setze(false)); }
setTimeout(versionPruefen,8000); setInterval(versionPruefen,10*60000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ versionPruefen(); setTimeout(ankunftPruefen,800); } });
setInterval(()=>{ if(S.user&&document.visibilityState==="visible") ankunftPruefen(); },45000);

boot();
