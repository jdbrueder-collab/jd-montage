<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JD Brüder Montage</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#14171c;--mute:#667085;--line:#e4e7ec;
  --brand:#1d3a5f;--brand2:#2d5a8e;--accent:#e8a33d;
  --ok:#1f8a4c;--okbg:#e6f4ec;--warn:#b26b00;--warnbg:#fdf1dc;--bad:#c4302b;--badbg:#fbe9e8;--info:#2758a8;--infobg:#e7eefb;--grey:#5b6472;--greybg:#eef0f3;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .logo{font-weight:800;letter-spacing:.3px;font-size:17px}
header.top .logo small{display:block;font-weight:500;font-size:11.5px;opacity:.75;letter-spacing:0}
header.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--greybg);color:var(--grey)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.info{background:var(--infobg);color:var(--info)}.chip.dark{background:rgba(255,255,255,.16);color:#fff}.chip.gold{background:#fff4dc;color:#8a5a00}
main{max-width:860px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;max-width:150px;text-align:center;padding:8px 2px 9px;font-size:11.5px;color:var(--mute);text-decoration:none;font-weight:600}
nav.bottom a .ic{display:block;font-size:20px;line-height:1.2}
nav.bottom a.on{color:var(--brand)}
nav.bottom a .dot{display:inline-block;min-width:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;margin-left:2px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.mute{color:var(--mute)}.small{font-size:12.5px}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:650;cursor:pointer;background:var(--greybg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;min-height:44px}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}.btn.warn{background:var(--accent);color:#2b1a00}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:block;font-size:12px;font-weight:650;color:var(--mute);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;min-height:44px}
textarea.i{min-height:84px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--brand2);outline-offset:-1px;border-color:transparent}
.seg{display:flex;background:var(--greybg);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:650;font-size:13px;cursor:pointer;color:var(--grey);min-height:38px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.phasen button{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;min-width:70px}
.seg.phasen{flex-wrap:nowrap}
@media(max-width:560px){.seg.phasen button{min-width:0;flex:1 1 0;padding:7px 2px;font-size:12px;hyphens:manual;overflow-wrap:normal}}
.seg.phasen .n{font-size:11px;font-weight:700;background:var(--line);color:var(--grey);border-radius:9px;padding:0 7px}
.seg.phasen button.on .n{background:var(--brand);color:#fff}
.seg.phasen button.st.on .n{background:var(--bad)}
.seg.laender button{font-size:12.5px;min-height:34px;padding:5px 6px}
.seg.laender .n{font-size:11px;font-weight:700;color:var(--grey);margin-left:2px}
.metacard.fertig{border-color:#bfe3cc;background:#f6fbf8}
.order.storno{opacity:.75}.order.storno .bv{text-decoration:line-through}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input{flex:1}
.kw{margin:18px 2px 8px;display:flex;align-items:baseline;gap:8px}
.kw b{font-size:16px}
.kw .now{color:var(--accent);font-weight:700;font-size:12px}
.order{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.order:active{background:#fafafa}
.order .nr{font-weight:800;font-size:17px;letter-spacing:.2px}
.order .bv{font-weight:600}
.order .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.order.done{opacity:.72}
.order.hl{border-color:var(--accent);box-shadow:0 0 0 2px #f6dcae}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
@media(max-width:420px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.big{font-size:22px;font-weight:800}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:800;letter-spacing:.5px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.thumbs .t{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;background:var(--greybg);border:1px solid var(--line);cursor:zoom-in}
.thumbs .t img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .t.pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);cursor:pointer;padding:4px;text-align:center}
.thumbs .t.pdf span{font-size:30px}.thumbs .t.pdf small{font-size:10.5px;word-break:break-all;line-height:1.2;max-height:2.4em;overflow:hidden}
.thumbs .t .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:7px;width:24px;height:24px;cursor:pointer;font-size:13px}
.thumbs .add{display:flex;align-items:center;justify-content:center;flex-direction:column;border:2px dashed var(--line);border-radius:9px;aspect-ratio:1;color:var(--mute);font-size:12px;cursor:pointer;text-align:center;padding:4px}
.thumbs .add span{font-size:22px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--brand2);font-weight:650;margin-bottom:10px;cursor:pointer;background:none;border:0;padding:6px 0}
.banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.banner.warn{background:var(--warnbg);color:#6b4100}.banner.bad{background:var(--badbg);color:#7a1d19}.banner.info{background:var(--infobg);color:#1b3d78}.banner.ok{background:var(--okbg);color:#14532d}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
table.pos{width:100%;border-collapse:collapse;font-size:13.5px}
table.pos td,table.pos th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
table.pos td:first-child,table.pos th:first-child{text-align:left}
table.pos tfoot td{font-weight:800;border-bottom:0}
.steps{display:flex;gap:4px;margin:6px 0 12px}
.steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--ok)}
.steps div.cur{background:var(--accent)}
.q{font-size:18px;font-weight:750;margin:4px 0 10px}
.choice{display:grid;gap:8px}
.choice .btn{min-height:56px;font-size:16px;justify-content:flex-start;padding-left:16px}
.choice .btn.on{background:var(--brand);color:#fff}
.miss{margin:8px 0 0;padding:0;list-style:none}
.miss li{color:var(--bad);font-size:13.5px;padding:2px 0}
.miss li.soft{color:var(--warn)}
.sonder{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.letter{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;font-size:13px;line-height:1.5;white-space:pre-wrap;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.modalbg{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modalbg{align-items:center}.modal{border-radius:18px}}
.modal h2{margin:0 0 6px;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14171c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.kal-nav{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.kal-nav .t{flex:1;text-align:center;font-weight:750;font-size:16px}
.kal-nav .btn{min-width:44px;font-size:20px;line-height:1}
.kal-woche{display:grid;gap:8px}
@media(min-width:720px){.kal-woche{grid-template-columns:repeat(var(--tage),minmax(0,1fr));align-items:start}.kal-tag{min-height:140px}}
.kal-tag{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.kal-tag.heute{border:2px solid var(--brand2)}
.kal-tag.frei{padding:6px 8px}
@media(max-width:719px){.kal-tag.frei{display:flex;justify-content:space-between;align-items:center}.kal-tag.frei .kal-kopf{margin:0}}
.kal-kopf{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:750;color:var(--mute);margin-bottom:2px}
.kal-tag.heute .kal-kopf{color:var(--brand2)}
.kal-leer{font-size:12px;color:var(--mute)}
.kal-o{display:block;text-decoration:none;color:var(--ink);background:var(--greybg);border-radius:9px;padding:7px 8px;margin-top:6px;border-left:4px solid var(--brand2);font-size:13px}
.kal-o:hover{filter:brightness(.97)}
.kal-o.fertig{border-left-color:var(--ok);opacity:.75}.kal-o.laeuft{border-left-color:var(--accent);background:var(--warnbg)}.kal-o.ueber{border-left-color:var(--bad);background:var(--badbg)}
.kal-bv{font-weight:600;line-height:1.25;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kal-ort{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal-av{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--brand2);color:#fff;font-size:10px;font-weight:700}
.kal-st{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--infobg);color:var(--info)}
.kal-st.ok{background:var(--okbg);color:var(--ok)}.kal-st.bad{background:var(--badbg);color:var(--bad)}.kal-st.warn{background:var(--warnbg);color:var(--warn)}
/* schlichte Listen (gleicher Stil wie der Kalender) */
.toolbar .btn{min-height:46px}
.tun{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tun-p{flex:none;border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--greybg);color:var(--grey);white-space:nowrap}
.tun-p.warn{background:var(--warnbg);color:var(--warn)}.tun-p.bad{background:var(--badbg);color:var(--bad)}.tun-p.info,.tun-p.msg{background:var(--infobg);color:var(--info)}.tun-p.ok{background:var(--okbg);color:var(--ok)}
.tun-p.on{box-shadow:inset 0 0 0 2px currentColor}
.fzeile{display:flex;gap:6px;margin-top:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.fzeile::-webkit-scrollbar{display:none}
.fp{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:650;color:var(--grey);cursor:pointer;white-space:nowrap;min-height:32px}
.fp .n{font-weight:700;opacity:.75;margin-left:2px}
.fp.on{background:var(--ink);border-color:var(--ink);color:#fff}
.spez-kopf{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:15px}
.spez-kopf .btn{margin-left:auto;min-width:40px}
.li-gr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.li-gr.heute{border:2px solid var(--brand2)}.li-gr.heute .kal-kopf{color:var(--brand2)}
.kal-kopf .rot{color:var(--bad)}.kal-kopf .jetzt{color:var(--accent)}
.li-grid{display:grid;gap:0 8px}
@media(min-width:720px){.li-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
.li-w{min-width:0}
.kal-o.li{font-size:13.5px}
.li-nr{font-size:14.5px;letter-spacing:.2px}
.kal-o.abh{border-left-color:var(--ok)}.kal-o.offen{border-left-color:#98a2b3}
.kal-o.storno{border-left-color:var(--bad);opacity:.7}.kal-o.storno .kal-bv{text-decoration:line-through}
.li-fuss{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;align-items:center}
.kal-st.gold{background:#fff4d6;color:#8a5a00}.kal-st.abh{background:var(--okbg);color:var(--ok)}.kal-st.msg{background:var(--info);color:#fff}
.kal-st:not(.ok):not(.bad):not(.warn):not(.info):not(.gold):not(.abh):not(.msg){background:var(--card);color:var(--grey)}
.kal-av.ok{background:var(--ok)}
.kal-av.wartet{background:var(--card);color:var(--brand2);box-shadow:inset 0 0 0 1.5px var(--brand2)}
.li-akt{display:block;margin:3px 0 0 auto;border:0;background:none;color:var(--grey);font-size:12px;font-weight:650;cursor:pointer;padding:2px 4px}
/* Nachrichten */
.msgs{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:10px}
.msg{align-self:flex-start;max-width:85%;background:var(--greybg);border-radius:12px 12px 12px 4px;padding:7px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.ich{align-self:flex-end;background:var(--infobg);border-radius:12px 12px 4px 12px}
.msg-k{font-size:11px;font-weight:700;color:var(--mute);margin-bottom:2px}
.msg-schnell{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.msg-schnell::-webkit-scrollbar{display:none}
.tbest{border:2px solid var(--accent)}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}
@media(min-width:720px){.setup-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.setup-grid>details.sk{margin:0;padding:12px}
.setup-grid>details.sk[open]{grid-column:1/-1;padding:14px 16px}
details.sk>summary{justify-content:flex-start;gap:8px;min-height:24px}
details.sk>summary .ic{width:18px;height:18px;flex:none;color:var(--brand2)}
details.sk>summary b{font-size:14px;white-space:normal;line-height:1.2;flex:1;min-width:0;overflow-wrap:anywhere}
details.sk>summary .chip{flex:none}
details.sk:not([open])>summary::after{display:none}
details.sk .foldin>h3{font-size:12.5px;color:var(--mute);font-weight:600;margin:0 0 6px}
.konto-k{display:grid;gap:8px;margin-top:12px}
/* Auftrag: kleine Knöpfe oben, Bereiche als aufklappbare Knöpfe */
.kopf-akt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kopf-akt .btn{min-height:36px;padding:6px 13px;font-size:13.5px;border-radius:999px;flex:0 1 auto;white-space:nowrap}
.det-grid{display:grid;gap:8px;align-items:start;margin-bottom:12px}
.det-grid>details.sk{margin:0;padding:10px 8px}
.det-grid>details.sk[open]{grid-column:1/-1;padding:14px 16px}
.det-grid>details.sk:not([open])>summary{flex-direction:column;align-items:center;gap:3px;text-align:center}
.det-grid>details.sk:not([open])>summary b{font-size:13px;text-align:center}
.det-grid>details.sk:not([open])>summary .small{font-size:11.5px;max-width:100%;text-align:center;flex:none}
.det-grid>details.sk[open]>summary b{font-size:15px;flex:none}
.det-grid>details.sk[open]>summary::after{display:block}
.los-k{display:grid;gap:8px;margin-top:12px}
.los-k .btn{min-height:56px;font-size:16px}
.konto-k .btn{display:flex;align-items:center;gap:8px;justify-content:flex-start;width:100%}
@media(min-width:720px){.konto-k{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}}
.kal-monat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.kal-wt{text-align:center;font-size:11.5px;font-weight:700;color:var(--mute);padding:2px 0}
.kal-zelle{min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;cursor:pointer;overflow:hidden}
.kal-zelle.aus{opacity:.45}.kal-zelle.heute{border:2px solid var(--brand2)}
.kal-zn{font-size:11.5px;font-weight:700;color:var(--mute)}
.kal-chip{display:block;background:var(--brand2);color:#fff;border-radius:4px;padding:0 3px;margin-top:2px;font-size:10px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal-chip.fertig{background:var(--ok)}
.kal-mehr{display:block;font-size:10px;color:var(--mute);margin-top:1px}
.kal-n{display:none;margin:4px auto 0;width:24px;height:24px;border-radius:50%;background:var(--brand2);color:#fff;font-size:12px;font-weight:750;align-items:center;justify-content:center}
.kal-n.fertig{background:var(--ok)}
@media(max-width:600px){.kal-chip,.kal-mehr{display:none}.kal-n{display:flex}.kal-zelle{min-height:56px;text-align:center}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.dv{position:fixed;inset:0;z-index:90;background:#1b1f24;display:flex;flex-direction:column;color:#fff}
.dvbar{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#111418}
.dvt{flex:1;min-width:0;font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dvb{min-width:42px;height:42px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.dvp{min-width:52px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;opacity:.85}
.dvstage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab}
.dvinhalt{position:absolute;left:0;top:0;transform-origin:0 0}
.dvinhalt img{display:block;user-select:none;-webkit-user-drag:none;max-width:none}
.dvseite{position:absolute;left:0;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.dvrot{position:absolute;left:0;top:0;transform-origin:0 0}
.dvrot.scan{filter:grayscale(1) contrast(1.8) brightness(1.08)}
.dvb.on{background:#fff;color:#111}
@media(max-width:480px){.dvb{min-width:36px;height:38px;font-size:17px}.dvp{display:none}}
.achtung{margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--badbg,#fef3f2);font-size:14px;font-weight:600;display:grid;gap:6px}
.achtung u,u.rot{text-decoration:underline;text-decoration-color:var(--bad,#d92d20);text-decoration-thickness:2px;text-underline-offset:3px}
details.bau-mehr{margin-top:4px}
details.bau-mehr>summary{cursor:pointer;list-style:none;font-size:13.5px;font-weight:650;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--brand2,#2563eb)}
details.bau-mehr>summary::-webkit-details-marker{display:none}
details.bau-mehr>summary::before{content:"▸ "}
details.bau-mehr[open]>summary::before{content:"▾ "}
details.bau-mehr[open]>summary{margin-bottom:8px}
.bau-top{background:var(--greybg);border-radius:12px;padding:4px 12px;margin-bottom:10px}
.dok-i{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.dok-i h4{margin:10px 0 6px;font-size:12.5px;color:var(--mute);font-weight:650;text-transform:uppercase;letter-spacing:.03em}
.dok-k{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.dok-k:last-child{border-bottom:0}
.dok-k .r{font-size:12px;color:var(--mute);min-width:100%}
.dok-a{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px;padding:7px 9px;background:var(--greybg);border-radius:9px;margin-bottom:6px}
.dok-a b{grid-column:1/-1;font-size:14px}
.dok-h{font-size:14px;padding:5px 0}
.dok-h b{display:block;font-size:12.5px;color:var(--mute)}
.dok-d{font-size:13px;padding:4px 0;color:var(--grey)}
.dvlade{position:fixed;left:0;right:0;top:45%;text-align:center;color:#ddd}
.dvhint{font-size:12px;text-align:center;opacity:.6;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.lightbox img{max-width:96vw;max-height:92vh}
canvas.sig{width:100%;height:200px;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum .card{margin:0;text-align:center;padding:12px 6px}
.sum .card b{display:block;font-size:19px}
.sum .card span{font-size:11.5px;color:var(--mute)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.log{font-size:12.5px;color:var(--mute);max-height:180px;overflow:auto;background:var(--greybg);border-radius:9px;padding:8px;margin-top:8px;white-space:pre-wrap}
.hide{display:none!important}
/* ===== Ruhiges, minimalistisches Design ===== */
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#101828;--mute:#667085;--line:#eaecf0;
  --brand:#1d3a5f;--brand2:#2e5b8f;--accent:#d9912b;
  --ok:#15803d;--okbg:#ecfdf3;--warn:#b54708;--warnbg:#fff6e5;--bad:#d92d20;--badbg:#fef3f2;--info:#1d4ed8;--infobg:#eff4ff;--grey:#475467;--greybg:#f2f4f7;
  --r:16px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
html,body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.005em}
svg.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
.cc{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;padding:1px 4px;border-radius:4px;background:currentColor;line-height:1.3;vertical-align:.1em}
.cc{background:none;border:1.5px solid currentColor}
.dotc{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);vertical-align:.05em}
.dotc.ok{background:var(--ok)}.dotc.warn{background:var(--accent)}.dotc.bad{background:var(--bad)}
/* Kopf: hell und ruhig */
header.top{background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header.top .logo{font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--brand)}
header.top .logo small{color:var(--mute);opacity:1;font-weight:600;font-size:11px;letter-spacing:.02em;text-transform:uppercase}
header.top .chip.dark,#roleChip{background:var(--greybg);color:var(--grey)}
header.top .btn{background:var(--greybg)!important;color:var(--ink)!important}
/* Karten ohne harte Ränder */
.card{border:0;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card h3{font-size:15px;text-transform:none;letter-spacing:-.005em;color:var(--ink);font-weight:700;margin:0 0 12px}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
/* Auftragskarten */
.order{border:0;box-shadow:var(--sh);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.order .nr{font-size:17px;font-weight:800;letter-spacing:-.01em}
.order .bv{font-weight:600;margin-top:2px}
.order .chips{gap:6px;margin-top:10px}
.order.hl{box-shadow:var(--sh),inset 3px 0 0 var(--accent)}
.order.done{opacity:.6}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;gap:4px;background:var(--greybg);color:var(--grey)}
.chip.gold{background:#fff6e5;color:var(--warn)}
.kw{margin:20px 2px 8px}
.kw b{font-size:14px;color:var(--grey);font-weight:700}
.kw .now{font-size:11.5px}
/* Bedienelemente */
.btn{border-radius:12px;font-weight:600;background:var(--greybg)}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.sm{border-radius:10px}
.btn.warn{background:#fff6e5;color:var(--warn);border:1px solid #fedf89}
input.i,select.i,textarea.i{border-color:var(--line);border-radius:12px;background:#fff}
label.f{font-weight:600;color:var(--grey)}
.seg{background:var(--greybg);border-radius:12px}
.seg button{border-radius:10px;font-weight:600;color:var(--mute)}
.seg button.on{box-shadow:0 1px 3px rgba(16,24,40,.1)}
.seg.phasen .n{background:#fff;color:var(--mute)}
.banner{border-radius:14px;font-size:13.5px;padding:12px 14px}
.banner.bad{background:var(--badbg);color:#912018}.banner.warn{background:var(--warnbg);color:#93370d}.banner.info{background:var(--infobg);color:#1e3a8a}.banner.ok{background:var(--okbg);color:#085d3a}
.toolbar input{background:#fff;box-shadow:var(--sh);border-color:transparent}
.back{color:var(--grey);font-weight:600}
.steps div{height:4px}
.steps div.on{background:var(--brand2)}
.q{font-size:19px;font-weight:700;letter-spacing:-.01em}
.choice .btn{background:#fff;border:1px solid var(--line);font-weight:600}
.choice .btn.on{background:var(--brand);border-color:var(--brand)}
.thumbs .t,.thumbs .add{border-radius:12px}
.thumbs .t.pdf svg.ic{width:28px;height:28px;color:var(--brand2)}
/* Untere Leiste: ruhige Symbole */
nav.bottom{background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--line)}
nav.bottom a{font-size:11px;font-weight:600;padding:9px 2px 10px;color:#98a2b3}
nav.bottom a .ic{display:block;margin:0 auto 3px;width:22px;height:22px;stroke-width:1.8}
nav.bottom a.on{color:var(--brand)}
nav.bottom a.on .ic{stroke-width:2.2}
.modal{border-radius:20px 20px 0 0}
@media(min-width:600px){.modal{border-radius:20px}}
.toast{border-radius:14px;font-weight:500}
details.fold>summary,.foldbtn{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after,.foldbtn::after{content:"›";font-size:20px;color:var(--mute);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(90deg)}
details.fold>summary b,.foldbtn b{font-size:15px;white-space:nowrap}
details.fold>summary .small,.foldbtn .small{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.fold .foldin{margin-top:12px}
.dokhinweis{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:999px;padding:1px 8px}
.order.abh{background:#f0fdf4;box-shadow:var(--sh),inset 4px 0 0 var(--ok)}
.chip.abh{background:var(--ok);color:#fff}
#pushBtn{padding:6px 9px}
.seg.phasen button.ab.on .n{background:var(--ok)}
.stlink{border:0;background:none;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:2px}
.stlink.on{color:var(--bad)}
#pushBtn.on{color:var(--ok)!important;background:var(--okbg)!important}
.seg.laender{background:none;padding:0;gap:6px;flex-wrap:nowrap;margin-top:10px!important}
.seg.laender button{flex:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;min-height:32px;font-size:12.5px;white-space:nowrap;color:var(--grey);box-shadow:none}
.seg.laender button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg.laender button.on .cc{color:#fff}
.seg.laender .n{color:inherit;opacity:.7;margin-left:3px}
.nvrow{display:flex;justify-content:flex-end;margin:-4px 0 10px}

/* ===== Gerät: Auswahl ===== */
.geraet-k{justify-content:flex-start;gap:12px;min-height:58px;padding:10px 14px;background:var(--card);border:1.5px solid var(--line)}
.geraet-k.on{border-color:var(--brand2);background:var(--infobg)}
.gk-sym{font-size:24px;width:30px;text-align:center}
/* ===== iPhone: wie iOS – 16px in Feldern (kein Hineinzoomen), Tab-Leiste mit Home-Balken, Blätter mit Griff ===== */
html[data-geraet=ios] body,html[data-geraet=ios] button,html[data-geraet=ios] input,html[data-geraet=ios] select,html[data-geraet=ios] textarea{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
html[data-geraet=ios] input.i,html[data-geraet=ios] select.i,html[data-geraet=ios] textarea.i{font-size:16px}
html[data-geraet=ios] *{-webkit-tap-highlight-color:transparent}
html[data-geraet=ios] .modal{border-radius:14px 14px 0 0;padding-top:22px;position:relative}
html[data-geraet=ios] .modal::before{content:"";position:absolute;top:7px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:#c7c7cc}
html[data-geraet=ios] .btn.pri{background:#007aff}
html[data-geraet=ios] .toast{border-radius:14px;background:rgba(30,30,32,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html[data-geraet=ios] header.top{border-bottom:.5px solid rgba(0,0,0,.15)}
/* ===== Android: wie Material 3 – runde Knöpfe, Leiste mit Pille hinter dem aktiven Symbol, Snackbar ===== */
html[data-geraet=android] body,html[data-geraet=android] button,html[data-geraet=android] input,html[data-geraet=android] select,html[data-geraet=android] textarea{font-family:Roboto,"Google Sans","Noto Sans",system-ui,sans-serif}
html[data-geraet=android] input.i,html[data-geraet=android] select.i,html[data-geraet=android] textarea.i{font-size:16px;border-radius:12px}
html[data-geraet=android] .btn{border-radius:999px}
html[data-geraet=android] .btn.sm{border-radius:999px}
html[data-geraet=android] .card,html[data-geraet=android] .li-gr{border-radius:16px}
html[data-geraet=android] .modal{border-radius:28px 28px 0 0;padding-top:24px;position:relative}
html[data-geraet=android] .modal::before{content:"";position:absolute;top:10px;left:50%;width:32px;height:4px;margin-left:-16px;border-radius:2px;background:#79747e;opacity:.4}
html[data-geraet=android] .toast{left:16px;right:16px;transform:none;border-radius:6px;text-align:left;background:#313033}
html[data-geraet=android] .fp,html[data-geraet=android] .tun-p{border-radius:8px}

/* ===== Abzeichen: überall gleich ===== */
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:0;box-sizing:border-box;vertical-align:middle;flex:none}
.tun-p .badge{margin-left:6px}
details.sk>summary .badge{margin-left:auto}
.foldin>h3 .badge,.card h3 .badge{margin-left:4px}
.msg-b{position:relative;display:inline-flex;align-items:center;gap:3px;font-size:13px;padding:0 2px}
.msg-b .badge{min-width:16px;height:16px;font-size:10px;padding:0 4px}
/* ===== Fußleiste: schwebend, rund, aktives Symbol hinterlegt ===== */
nav.bottom{left:0;right:0;bottom:0;background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav.bottom .nav-in{pointer-events:auto;display:flex;width:100%;max-width:520px;margin:0 auto;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border:1px solid rgba(16,24,40,.06);border-radius:24px;box-shadow:0 10px 30px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.06);padding:6px}
nav.bottom a{flex:1;max-width:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 5px;border-radius:18px;color:#8a94a6;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .12s}
nav.bottom a:active{transform:scale(.94)}
nav.bottom .nav-ic{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;transition:background .2s,color .2s}
nav.bottom .nav-ic .ic{width:22px;height:22px;margin:0;stroke-width:1.9;display:block}
nav.bottom .nav-ic .badge{position:absolute;top:-4px;left:30px;box-shadow:0 0 0 2px #fff}
nav.bottom .nav-l{font-size:11px;font-weight:600;line-height:1.1;white-space:nowrap}
nav.bottom a.on{color:var(--brand)}
nav.bottom a.on .nav-ic{background:var(--infobg);color:var(--brand)}
nav.bottom a.on .nav-ic .ic{stroke-width:2.3}
nav.bottom a.on .nav-l{font-weight:750}
main{padding-bottom:calc(112px + env(safe-area-inset-bottom))!important}
.toast{bottom:calc(100px + env(safe-area-inset-bottom))!important}
/* iPhone: Apple-Blau; Android: Material-Töne */
html[data-geraet=ios] nav.bottom a.on,html[data-geraet=ios] nav.bottom a.on .nav-ic{color:#007aff}
html[data-geraet=ios] nav.bottom a.on .nav-ic{background:#e6f0ff}
html[data-geraet=ios] nav.bottom .nav-l{font-size:10.5px}
html[data-geraet=android] nav.bottom .nav-in{background:rgba(243,244,249,.94);border-radius:28px}
html[data-geraet=android] nav.bottom a.on,html[data-geraet=android] nav.bottom a.on .nav-ic{color:#001a41}
html[data-geraet=android] nav.bottom a.on .nav-ic{background:#d9e2ff}
html[data-geraet=android] nav.bottom .nav-ic .badge{box-shadow:0 0 0 2px #f3f4f9}
@media(min-width:900px){nav.bottom .nav-in{max-width:560px}}

/* ===== „Zu tun“: schlicht – eine Zeile, Punkt in der Farbe, Zahl als Abzeichen ===== */
.tun{flex-wrap:nowrap;overflow-x:auto;gap:6px;margin:0 -16px 10px;padding:0 16px 2px;scrollbar-width:none}
.tun::-webkit-scrollbar{display:none}
.tun-p{display:inline-flex;align-items:center;gap:6px;background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line);font-weight:600;font-size:13px;padding:6px 8px 6px 10px;box-shadow:none}
.tun-p::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grey);flex:none}
.tun-p.warn::before{background:var(--accent)}.tun-p.bad::before{background:var(--bad)}.tun-p.info::before,.tun-p.msg::before{background:var(--info)}.tun-p.ok::before{background:var(--ok)}
.tun-p .badge{margin-left:2px}
.tun-p.on{border-color:var(--ink);box-shadow:none!important;background:var(--greybg)!important}

/* ===== Fahrtenbuch mit Kilometerstand ===== */
.fb-z.in-tour{border-left:4px solid var(--brand2,#2563eb);margin-left:6px}
.tour-k{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:650;color:var(--brand2,#2563eb);margin:10px 2px 4px}
.tour-k span{color:var(--mute);font-weight:500}
.fahrt-l{display:flex;align-items:center;gap:10px;background:var(--okbg);border:1px solid #b7e4c7;border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:12px}
.fahrt-l .btn{flex:none;white-space:nowrap}
.fb-box{background:var(--greybg);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.km-gross{font-size:20px!important;font-weight:700;text-align:center;letter-spacing:.5px}
.ziel-w{display:flex;gap:6px;flex-wrap:wrap}
.fb-z.privat{opacity:.7}.fb-z.offen{box-shadow:inset 3px 0 0 var(--ok),var(--sh)}

/* ===== Aktualisieren-Knopf oben rechts ===== */
.kopf-btn{position:relative;width:40px;height:40px;flex:none;border:0;border-radius:12px;background:var(--greybg);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.kopf-btn .ic{width:20px;height:20px}
.kopf-btn:active{transform:scale(.94)}
.kopf-btn.dreht .ic{animation:sp .8s linear infinite}
.kopf-btn.neu{background:var(--infobg);color:var(--info)}
.kopf-btn.neu::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px #fff}

/* ===== Vorschau (Ansicht wechseln) ===== */
.vorschau{background:#1d2939;color:#fff;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.vorschau-k{display:flex;gap:4px;margin-top:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.vorschau-k button{flex:1;border:0;background:transparent;color:#d0d5dd;font-weight:650;font-size:12.5px;padding:7px 2px;border-radius:8px;cursor:pointer}
.vorschau-k button.on{background:#fff;color:#1d2939}
/* ===== gemeinsamer Auftrag ===== */
.gem-k{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;background:var(--greybg);border-radius:12px;cursor:pointer}
.gem-k input{width:22px;height:22px;flex:none;margin-top:1px}
.anteil{padding:10px 0;border-bottom:1px solid var(--line)}.anteil:last-of-type{border-bottom:0}

/* ===== Preisliste des Subunternehmers ===== */
.pl-z{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pl-z.voll{background:linear-gradient(90deg,var(--okbg),transparent);border-radius:8px}
.pl-l{font-size:14px;font-weight:600;line-height:1.25;padding-left:4px}.pl-l span{display:block;font-size:12px;font-weight:500;color:var(--mute)}
.pl-q{min-height:40px!important;text-align:right;padding:6px 8px!important}
.pl-gp{text-align:right;font-size:13px;font-weight:650}
.pl-etage{grid-template-columns:1fr}
.pl-summe{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:10px;border-top:2px solid var(--ink)}.pl-summe span{font-size:22px;font-weight:800}
table.abr{width:100%;border-collapse:collapse;font-size:13.5px}
table.abr th{text-align:left;font-size:11.5px;color:var(--mute);font-weight:700;padding:4px 4px;border-bottom:1px solid var(--line)}
table.abr td{padding:5px 4px;border-bottom:1px solid var(--line)}
table.abr th:not(:first-child),table.abr td:not(:first-child){text-align:right;white-space:nowrap}
table.abr tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--ink)}

/* ===== Geschosse als Liste ===== */
.gesch-z{display:grid;grid-template-columns:1fr 92px auto;gap:6px;margin-bottom:6px;align-items:center}
.gesch-z .btn{min-width:38px}

.thumbs .t{position:relative}
.rk-x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;line-height:26px;padding:0}

nav.bottom{transition:transform .28s ease,opacity .28s ease}
body.nav-weg nav.bottom{transform:translateY(calc(100% + 20px));opacity:0;pointer-events:none}

/* ===== Serie wählen ===== */
.serie-w{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.serie-k{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink)}

function iconize(html){
  return String(html).split(/(<textarea[\s\S]*?<\/textarea>|<option[\s\S]*?<\/option>|<[^>]*>)/).map((part,i)=>{
    if(i%2) return part; // Tags, Textfelder und Auswahllisten unverändert lassen
    let p=part; for(const [e,r] of EMOJI_IC){ if(p.includes(e)) p=p.split(e).join(r.startsWith("<")?r:ic(r)); }
    return p.replace(/️/g,"");
  }).join("");
}

function fahrzeugText(x){ if(!x) return ""; if(x.fahrzeug==="sonst") return x.fahrzeugText||"Sonstiges"; return FAHRZEUGE[x.fahrzeug]||FAHRZEUG_ALT[x.fahrzeug]||x.fahrzeug||""; }

function mitAnhaenger(x){ if(!x) return false; return x.fahrzeug==="anhaenger"||x.fahrzeug==="zwei"||(x.fahrzeug==="sonst"&&/anh[äa]nger/i.test(x.fahrzeugText||"")); }
// Übernachtungen: je Nacht Datum + Personen (bericht.naechte); ältere Berichte haben nur eine Zahl (bericht.uebernachtungen)
function uebernachtet(b){ b=b||{}; if(b.uebernachtet) return b.uebernachtet; if((b.naechte||[]).length) return "ja"; if(b.hotel==="ja") return "ja"; if(!leer(b.uebernachtungen)) return nn(b.uebernachtungen)>0?"ja":"nein"; return ""; }
function naechteAnzahl(b){ b=b||{}; if(uebernachtet(b)!=="ja") return 0; if((b.naechte||[]).length) return b.naechte.length; return nn(b.uebernachtungen)||nn(b.hotelInfo)||(b.hotel==="ja"?1:0); }
function nachtTag(d){ if(!d) return "Datum ?"; const x=new Date(d+"T12:00:00"); return isNaN(x)?String(d):x.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}); }
function personenNaechte(b){ return (b?.naechte||[]).reduce((a,x)=>a+(nn(x.personen)||0),0); }
function naechteText(b){
  const u=uebernachtet(b); if(u==="nein") return "keine"; if(u!=="ja") return "";
  const n=b.naechte||[], z=naechteAnzahl(b);
  if(!n.length) return `${z} ${z===1?"Nacht":"Nächte"}`;
  const pn=personenNaechte(b);
  return `${z} ${z===1?"Nacht":"Nächte"} (${n.map(x=>`${nachtTag(x.datum)}: ${x.personen||"?"} Pers.`).join("; ")})${pn&&n.length>1?` = ${pn} Personen-Übernachtungen`:""}`;
}
const isoTag=t=>{ const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const naechsterTag=d=>{ const x=new Date((d||isoTag(Date.now()))+"T12:00:00"); x.setDate(x.getDate()+1); return isoTag(x); };
// erste Nacht: erster Montagetag (Zeiterfassung), sonst Termin, sonst heute
function ersteNacht(o){ const z=(o.zeiten||[]).map(x=>x.s).filter(Boolean).sort((a,c)=>a-c)[0]; return isoTag(z||o.termin||Date.now()); }
// Liste der Nächte bauen – aus genannten Nächten und/oder einer Anzahl
function naechteBauen(o,anzahl,liste){
  const pers=String((o.bericht||{}).personen??o.einsatz?.personenVorOrt??"");
  const out=[]; let d=null;
  (Array.isArray(liste)?liste:[]).forEach(x=>{ const dt=/^\d{4}-\d{2}-\d{2}$/.test(String(x?.datum||""))?x.datum:(d?naechsterTag(d):ersteNacht(o)); out.push({datum:dt,personen:String(x?.personen??pers)}); d=dt; });
  const soll=Math.max(out.length,parseInt(anzahl,10)||0);
  while(out.length<soll){ d=d?naechsterTag(d):ersteNacht(o); out.push({datum:d,personen:pers}); }
  return out;
}

/* ============ Modals ============ */
function modal(html, onMount, onClose){
  const root=$("#modalRoot");
  const bg=document.createElement("div"); bg.className="modalbg";
  bg.innerHTML=`<div class="modal">${iconize(html)}</div>`;
  root.appendChild(bg);
  const close=()=>{ if(!bg.isConnected) return; bg.remove(); try{ onClose&&onClose(); }catch(e){} };
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  onMount && onMount(bg.firstElementChild, close);
  return close;
}
function confirmBox(title, text, okLabel="Ja", cls="pri"){
  return new Promise(res=>{
    modal(`<h2>${esc(title)}</h2><div class="mute">${text}</div><div class="grid2" style="margin-top:14px"><button class="btn" data-no>Abbrechen</button><button class="btn ${cls}" data-yes>${esc(okLabel)}</button></div>`,(m,close)=>{
      m.querySelector("[data-no]").onclick=()=>{close();res(false)};
      m.querySelector("[data-yes]").onclick=()=>{close();res(true)};
    });
  });
}

// Vorschau Montagebericht / Sichtabnahme: alle Seiten untereinander im Zoom-Betrachter
function vorschauZeigen(cs,titel){
  const g=28, W=Math.max(...cs.map(c=>c.width)), H=cs.reduce((a,c)=>a+c.height,0)+g*(cs.length-1);
  const c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d"); x.fillStyle="#2b3038"; x.fillRect(0,0,W,H);
  let y=0; cs.forEach(pg=>{ x.drawImage(pg,0,y); y+=pg.height+g; });
  dokViewer(c.toDataURL("image/jpeg",.9),"seiten",titel);
}

let pdfjsP=null;
function loadPdfJs(){ if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib); if(!pdfjsP) pdfjsP=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); }; sc.onerror=()=>{ pdfjsP=null; rej(new Error("PDF-Anzeige konnte nicht geladen werden")); }; document.head.appendChild(sc); }); return pdfjsP; }
function dokViewer(src, art="bild", titel=""){
  const d=document.createElement("div"); d.className="dv";
  d.innerHTML=`<div class="dvbar"><button class="dvb" data-dv="zu" title="Schließen">✕</button><span class="dvt">${esc(titel||(art==="pdf"?"PDF":"Foto"))}</span>
    <button class="dvb" data-dv="minus" title="Kleiner">−</button><span class="dvp">100 %</span><button class="dvb" data-dv="plus" title="Größer">＋</button><button class="dvb" data-dv="fit" title="Einpassen">⤢</button><button class="dvb" data-dv="dreh" title="Drehen">⟳</button><button class="dvb" data-dv="scan" title="Kontrast verbessern (schlechte Scans)">◐</button>
    ${art==="pdf"?`<a class="dvb" href="${esc(src)}" target="_blank" rel="noopener" title="Im Browser öffnen">↗</a>`:""}</div>
    <div class="dvstage"><div class="dvinhalt"><div class="dvlade"><span class="spin"></span> wird geladen …</div></div></div>
    <div class="dvhint">Mit zwei Fingern zoomen · doppelt tippen · ⟳ drehen · ◐ schwache Scans deutlicher</div>`;
  document.body.appendChild(d); document.body.style.overflow="hidden";
  const stage=d.querySelector(".dvstage"), inh=d.querySelector(".dvinhalt"), pct=d.querySelector(".dvp");
  let W=0,H=0,s=1,x=0,y=0,fit=1,einpassenGanz=true,OW=0,OH=0,dreh=0;
  const rot=document.createElement("div"); rot.className="dvrot";
  let scanAn=false; try{ scanAn=localStorage.getItem("jdScan")==="1"; }catch(e){}
  const scanZeigen=()=>{ rot.classList.toggle("scan",scanAn); d.querySelector("[data-dv=scan]")?.classList.toggle("on",scanAn); };
  const zeigen=()=>{ inh.style.transform=`translate(${x}px,${y}px) scale(${s})`; pct.textContent=Math.round(s/fit*100)+" %"; };
  const begrenzen=()=>{ const vw=stage.clientWidth, vh=stage.clientHeight, cw=W*s, ch=H*s;
    x = cw<=vw ? (vw-cw)/2 : Math.min(0,Math.max(vw-cw,x));
    y = ch<=vh ? (einpassenGanz?(vh-ch)/2:Math.max(0,Math.min(y,(vh-ch)/2))) : Math.min(0,Math.max(vh-ch,y)); };
  const zoomUm=(ns,cx,cy)=>{ ns=Math.max(fit*.5,Math.min(fit*10,ns)); const r=ns/s; x=cx-(cx-x)*r; y=cy-(cy-y)*r; s=ns; begrenzen(); zeigen(); };
  const einpassen=()=>{ const vw=stage.clientWidth, vh=stage.clientHeight; fit=einpassenGanz?Math.min(vw/W,vh/H):vw/W; s=fit; x=0; y=0; begrenzen(); zeigen(); };
  // Fenstergröße ändert sich (Handy gedreht, Browserleiste): Zoom behalten, nur bei „eingepasst“ neu einpassen
  const groesse=()=>{ if(!W) return; const vw=stage.clientWidth, vh=stage.clientHeight, nf=einpassenGanz?Math.min(vw/W,vh/H):vw/W; if(Math.abs(s-fit)<fit*.02) einpassen(); else { fit=nf; begrenzen(); zeigen(); } };
  // Drehen: Inhalt bleibt gleich groß, nur die Box tauscht Breite/Höhe
  const drehen=()=>{ const r=dreh%360; rot.style.width=OW+"px"; rot.style.height=OH+"px";
    rot.style.transform=r===90?`translate(${OH}px,0) rotate(90deg)`:r===180?`translate(${OW}px,${OH}px) rotate(180deg)`:r===270?`translate(0,${OW}px) rotate(270deg)`:"";

  const zu=()=>{ d.remove(); document.body.style.overflow=""; window.removeEventListener("resize",groesse); document.removeEventListener("keydown",taste); };
  const taste=e=>{ if(e.key==="Escape") zu(); if(e.key==="+"||e.key==="=") zoomUm(s*1.4,stage.clientWidth/2,stage.clientHeight/2); if(e.key==="-") zoomUm(s/1.4,stage.clientWidth/2,stage.clientHeight/2); };

  d.querySelector("[data-dv=scan]").onclick=()=>{ scanAn=!scanAn; try{ localStorage.setItem("jdScan",scanAn?"1":"0"); }catch(e){} scanZeigen(); };
  // Finger und Maus
  const pts=new Map(); let start=null, tapZeit=0, tapX=0, tapY=0, bewegt=false;
  const pos=e=>{ const r=stage.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  stage.addEventListener("pointerdown",e=>{ try{ stage.setPointerCapture(e.pointerId); }catch(_){} pts.set(e.pointerId,pos(e)); bewegt=false;
    const a=[...pts.values()]; start=a.length>=2?{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),s,x,y,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2}:{px:a[0].x,py:a[0].y,x,y}; });
  stage.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,pos(e)); const a=[...pts.values()];
    if(a.length>=2 && start?.d){ const dd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), mx=(a[0].x+a[1].x)/2, my=(a[0].y+a[1].y)/2;
      const ns=Math.max(fit*.5,Math.min(fit*10,start.s*dd/start.d)), r=ns/start.s; s=ns; x=mx-(start.mx-start.x)*r; y=my-(start.my-start.y)*r; bewegt=true; begrenzen(); zeigen(); }
    else if(a.length===1 && start && start.px!=null){ const dx=a[0].x-start.px, dy=a[0].y-start.py; if(Math.abs(dx)+Math.abs(dy)>4) bewegt=true; x=start.x+dx; y=start.y+dy; begrenzen(); zeigen(); } });
  const los=e=>{ if(!pts.has(e.pointerId)) return; const p=pts.get(e.pointerId); pts.delete(e.pointerId);
    const a=[...pts.values()]; start=a.length===1?{px:a[0].x,py:a[0].y,x,y}:null;
    if(!a.length && !bewegt && e.type==="pointerup"){ const t=Date.now(); if(t-tapZeit<320 && Math.hypot(p.x-tapX,p.y-tapY)<30){ s>fit*1.3?einpassen():zoomUm(fit*2.5,p.x,p.y); tapZeit=0; } else { tapZeit=t; tapX=p.x; tapY=p.y; } } };
  stage.addEventListener("pointerup",los); stage.addEventListener("pointercancel",los);
  stage.addEventListener("wheel",e=>{ e.preventDefault(); const p=pos(e);
    if(e.ctrlKey || art!=="pdf") zoomUm(s*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),p.x,p.y);
    else { x-=e.deltaX; y-=e.deltaY; begrenzen(); zeigen(); } },{passive:false});
  const fehler=t=>{ inh.innerHTML=`<div class="dvlade">${esc(t)}${art==="pdf"?`<br><a href="${esc(src)}" target="_blank" rel="noopener" style="color:#fff">Im Browser öffnen</a>`:""}</div>`; };
  if(art!=="pdf"){
    const img=new Image(); img.alt=""; img.draggable=false;
    img.onload=()=>{ inh.innerHTML=""; inh.appendChild(rot); rot.appendChild(img); img.style.width=img.naturalWidth+"px"; img.style.height=img.naturalHeight+"px"; bereit(img.naturalWidth,img.naturalHeight,art!=="seiten"); };
    img.onerror=()=>fehler("Bild konnte nicht geladen werden."); img.src=src;
  } else {
    (async()=>{ try{
      const lib=await loadPdfJs(); const buf=await (await fetch(src)).arrayBuffer();
      const pdf=await lib.getDocument({data:buf}).promise; const n=Math.min(pdf.numPages,40);
      const seiten=[]; for(let i=1;i<=n;i++) seiten.push(await pdf.getPage(i));
      const breite=Math.max(...seiten.map(pg=>pg.getViewport({scale:1}).width)), GAP=12; let h=0;
      inh.innerHTML=""; inh.appendChild(rot);
      const dpr=Math.min(window.devicePixelRatio||1,2);

        const c=document.createElement("canvas"); c.className="dvseite"; c.style.top=h+"px"; c.style.width=breite+"px"; c.style.height=cssH+"px"; rot.appendChild(c); h+=cssH+GAP; c._pg=pg; c._k=k; }
      bereit(breite,h-GAP,n===1);
      // scharf zeichnen: Auflösung so wählen, dass auch starkes Hineinzoomen lesbar bleibt (begrenzt wegen Speicher)
      const malen=async(stufe)=>{ for(const c of inh.querySelectorAll("canvas")){ const v=c._pg.getViewport({scale:c._k*stufe}); if(c.width>=Math.floor(v.width)) continue;
        const tmp=document.createElement("canvas"); tmp.width=Math.floor(v.width); tmp.height=Math.floor(v.height);
        await c._pg.render({canvasContext:tmp.getContext("2d"),viewport:v}).promise; c.width=tmp.width; c.height=tmp.height; c.getContext("2d").drawImage(tmp,0,0); } };
      const maxPx=n>6?2600:4200;
      await malen(Math.min(fit*dpr*1.2, maxPx/breite));
      let t=null; const nachschaerfen=()=>{ clearTimeout(t); t=setTimeout(()=>{ if(d.isConnected) malen(Math.min(s*dpr, maxPx/breite)).catch(()=>{}); },250); };
      stage.addEventListener("pointerup",nachschaerfen); stage.addEventListener("wheel",nachschaerfen); d.querySelector(".dvbar").addEventListener("click",nachschaerfen);
      if(pdf.numPages>n) toast(`Es werden die ersten ${n} von ${pdf.numPages} Seiten gezeigt`);
    }catch(e){ fehler("PDF konnte nicht angezeigt werden."); } })();
  }
}

  // noch ohne Markierung von Claude: nur die Sätze, die nach „unbedingt beachten“ klingen
  const saetze=t=>String(t||"").split(/(?<=[a-zäöüß0-9)]{2}[.!?])\s+/).map(x=>x.trim()).filter(x=>x&&WICHTIG_RX.test(x)&&!/arbeitsschutz|gbu|gefährdungsbeurteilung|rechnung/i.test(x));
  const l=[], dazu=t=>{ const k=t.toLowerCase().slice(0,40); if(!l.some(x=>x.toLowerCase().includes(k)||k.includes(x.toLowerCase().slice(0,40))||t.toLowerCase().includes(x.toLowerCase()))) l.push(t.length>160?t.slice(0,157)+"…":t); };
  saetze(o.montageHinweise).forEach(dazu);
  (d.hinweise||[]).filter(h=>h.text&&!/arbeitsschutz|gbu/i.test(h.titel||"")).forEach(h=>saetze(h.text).slice(0,2).forEach(dazu));
  return l.slice(0,5);
}
const achtungTeil=o=>{ const l=achtungListe(o); return l.length?`<div class="achtung">${l.map(t=>`<div>⚠️ <u>${esc(t)}</u></div>`).join("")}</div>`:""; };
// Was Claude aus allen Unterlagen gelesen hat – für die Monteure übersichtlich, ohne die PDFs durchsuchen zu müssen
function dokInfoTeil(o){

   ${an.length?`<h4>Anlagen (${an.reduce((s,a)=>s+(parseInt(a.kabinen,10)||0),0)||an.length} ${an.some(a=>parseInt(a.kabinen,10))?"Kabinen":"Bereiche"})</h4>${an.map(a=>`<div class="dok-a"><b>${esc([a.raum,a.geschoss].filter(Boolean).join(" · ")||"Anlage")}${a.kabinen?` – ${esc(a.kabinen)} Kab.`:""}</b>
      ${[["Modell",a.modell],["Höhe",a.hoehe],["Farbe",a.farbe],["Besonderes",a.besonderes]].filter(([,v])=>v).map(([k,v])=>`<span class="mute">${k}</span><span>${esc(v)}</span>`).join("")}</div>`).join("")}`:""}
   ${hi.length?`<h4>Hinweise aus den Unterlagen</h4>${hi.map(h=>`<div class="dok-h">${h.titel?`<b>${esc(h.titel)}</b>`:""}${h.wichtig||(!/arbeitsschutz|gbu/i.test(h.titel||"")&&WICHTIG_RX.test((h.titel||"")+" "+h.text))?`<u class="rot">${esc(h.text)}</u>`:esc(h.text)}</div>`).join("")}`:""}</div>`;
}
const dokListe=o=>(o.dokInfo?.liste||[]).filter(x=>x.art||x.inhalt).map(x=>`<div class="dok-d">📄 <b>${esc(x.art||"Datei")}</b>${x.seiten?` · ${esc(x.seiten)} S.`:""}${x.inhalt?` – ${esc(x.inhalt)}`:""}${x.name?` <span class="mute small">(${esc(x.name)})</span>`:""}</div>`).join("");
const DOK_HINWEIS=`<span class="dokhinweis">⚠️ bitte im Dokument prüfen</span>`;
// Terminiert: fester Termin eingetragen oder Einsatz schon begonnen
const terminiert=o=>o.terminStatus==="fest" || !!o.einsatz || (o.zeiten||[]).length>0;
// Abholbereit, außer der Chef hat ihn von Hand zurück nach „Nicht verplant“ geschoben
const abhBereit=o=>o.prodStatus==="abholbereit" && !o.nichtVerplant;
function phase(o){
  if(o.storniert) return "storniert";
  if(o.gemeinsam && can.sub()) return o.subAnteil?.[myId()]?.abgegebenAm?(abgerechnet(o)?"erledigt":"fertig"):terminiert(o)?"arbeit":abhBereit(o)?"abholbereit":"offen"; // gemeinsamer Auftrag: Sub ist fertig, wenn sein Anteil abgegeben ist
  if(abgerechnet(o)) return "erledigt"; // Vergütung da (Montageabrechnung von meta) → komplett erledigt
  if(istFertig(o) || berichtVerschickt(o) || berichtAbgegeben(o)) return "fertig"; // Montagebericht geschrieben → Baustelle fertiggestellt, Vergütung steht noch aus
  if(terminiert(o)) return "arbeit";
  if(abhBereit(o)) return "abholbereit"; // Ware fertig – jetzt einplanen
  return "offen";
}
// Bereiche je Rolle: Subunternehmer nur Terminiert/Fertiggestellt/Erledigt, Mitarbeiter ohne „Nicht verplant“
const meinePhasen=()=>can.sub()?HAUPT_PHASEN.filter(([k])=>k==="arbeit"||k==="fertig"||k==="erledigt"):can.planen()?HAUPT_PHASEN:HAUPT_PHASEN.filter(([k])=>k!=="offen");

/* ---------- Nachrichten pro Auftrag (Chef ↔ Eingeteilte) ---------- */
// „gelesen“ merkt sich das Gerät; Nachrichten von vor dem ersten Öffnen gelten als gelesen
function gelesen(){
  if(!S._gel){ try{ S._gel=JSON.parse(localStorage.getItem("jdGelesen")||"null"); }catch(e){}
    if(!S._gel||typeof S._gel!=="object"){ S._gel={seit:Date.now()}; try{ localStorage.setItem("jdGelesen",JSON.stringify(S._gel)); }catch(e){} } }
  return S._gel;
}
function alsGelesen(id){ const g=gelesen(); if(!ungelesen(id)) return; g[id]=Date.now(); try{ localStorage.setItem("jdGelesen",JSON.stringify(g)); }catch(e){} }
const nachrichtenVon=id=>Object.values(S.nachrichten||{}).filter(n=>n.auftragId===id).sort((a,b)=>a.am-b.am);
function ungelesen(id){ const g=gelesen(), ab=Math.max(g[id]||0,g.seit||0); return nachrichtenVon(id).filter(n=>n.von!==myId()&&n.am>ab).length; }
const binBeteiligt=o=>can.planen()||(o.monteure||[]).includes(myId());
const ungelesenGesamt=()=>Object.values(S.orders).filter(o=>sichtbar(o)&&binBeteiligt(o)).reduce((n,o)=>n+ungelesen(o.id),0);
// Termin: hat der Eingeteilte ihn bestätigt? (gilt nur für genau dieses Datum)
const terminKey=o=>o.termin?String(o.termin):"";
const terminBestaetigt=(o,uid)=>!!o.termin && o.terminOk?.[uid]===terminKey(o);
const tagHeute=()=>tagKey(new Date());
const terminTag=o=>o.termin?tagKey(new Date(o.termin)):"";
const terminOffenFuer=(o,uid)=>o.terminStatus==="fest" && !!o.termin && (o.monteure||[]).includes(uid) && !terminBestaetigt(o,uid) && !istFertig(o) && !o.storniert && terminTag(o)>=tagHeute();
const terminOffenFuerMich=o=>terminOffenFuer(o,myId());
const ueberfaellig=o=>phase(o)==="arbeit" && !istFertig(o) && !running(o) && !!o.termin && terminTag(o)<tagHeute();
const kurzDatum=t=>new Date(t).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}).replace(".,",",");
const langDatum=t=>new Date(t).toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit"});

/* ---------- „Zu tun“: was jetzt ansteht, je Rolle ---------- */
const SPEZIAL={
  pruefung:{t:"Berichte und Anteile prüfen",cls:"warn",p:()=>`Prüfen`,f:o=>o.berichtStatus==="pruefung"||anteilOffen(o)},
  msg:{t:"Neue Nachrichten",cls:"msg",p:()=>`Nachrichten`,f:o=>binBeteiligt(o)&&ungelesen(o.id)>0},
  ueber:{t:"Überfällige Termine – Montage nicht abgeschlossen",cls:"bad",p:()=>`Überfällig`,f:o=>ueberfaellig(o)},
  ohneTeam:{t:"Termin, aber niemand eingeteilt",cls:"warn",p:()=>`Ohne Team`,f:o=>phase(o)==="arbeit"&&!istFertig(o)&&!(o.monteure||[]).length},
  unbest:{t:"Termin noch nicht bestätigt",cls:"info",p:()=>can.planen()?`Unbestätigt`:`Bestätigen`,
    f:o=>can.planen()?(o.monteure||[]).some(m=>terminOffenFuer(o,m)):terminOffenFuerMich(o)},
  abnahme:{t:"Sichtabnahme seit über einer Woche offen",cls:"bad",p:()=>`Sichtabnahme`,f:o=>meinAuftrag(o)&&abnahmeFaellig(o)},
  heute:{t:"Heute",cls:"ok",p:()=>`Heute`,f:o=>terminTag(o)===tagHeute()&&(o.monteure||[]).includes(myId())&&!istFertig(o)},
  berichtOffen:{t:"Montage vorbei – Bericht noch offen",cls:"warn",p:()=>`Bericht offen`,f:o=>(o.monteure||[]).includes(myId())&&ueberfaellig(o)}
};
function zuTun(){
  const alle=Object.values(S.orders).filter(o=>sichtbar(o)&&!o.storniert);
  const keys=can.planen()?["pruefung","msg","ueber","ohneTeam","unbest","abnahme"]:["heute","unbest","berichtOffen","msg"];
  // Nachrichten: Zahl der ungelesenen Nachrichten (wie an den Karten), sonst Zahl der Aufträge
  return keys.map(k=>[k,k==="msg"?alle.reduce((n,o)=>n+(binBeteiligt(o)?ungelesen(o.id):0),0):alle.filter(SPEZIAL[k].f).length]).filter(([,n])=>n);
}

/* ============ Boot ============ */
async function boot(){
  // App wieder öffnen (auch nach Hintergrund/Neustart): letzte Seite + Bereich + Scrollstand wiederherstellen
  try{ const l=JSON.parse(localStorage.getItem("jdLetzte")||"null");
    if(l){ if(!location.hash && l.h && l.h!=="#") history.replaceState(null,"",location.pathname+location.search+l.h); if(l.f) S.filter=l.f; if(l.k) S.kal=l.k; S._scrollZiel=l.h===location.hash?l.y:0; } }catch(e){}
  const merken=()=>{ try{ localStorage.setItem("jdLetzte",JSON.stringify({h:location.hash,f:S.filter,k:S.kal||null,y:Math.round(window.scrollY)})); }catch(e){} };
  window.addEventListener("pagehide",merken); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") merken(); });
  { let t=null; window.addEventListener("scroll",()=>{ clearTimeout(t); t=setTimeout(merken,400); },{passive:true}); }
  window.addEventListener("hashchange", ()=>{ S._scrollZiel=0; render(true); merken(); });
  document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(S.pendingRender && !editing()) { S.pendingRender=false; render(); } },50); });
  setInterval(tick, 1000);
  const claude = window.claude;
  if(!claude || !claude.use){ S.loadErr="Diese App läuft nur, wenn sie über claude.ai geöffnet wird."; render(); return; }
  const [db,user,mcp,sample,assets,sync] = await Promise.all(["db","user","mcp","sample","assets","sync"].map(n=>claude.use(n).catch(()=>null)));
  Object.assign(S,{db,user,mcp,sample,assets,sync});
  if(!db){ S.loadErr="Daten sind gerade nicht erreichbar. Bitte bei claude.ai angemeldet öffnen."; render(); return; }
  if(user){
    try{ S.isOwner = !!(await user.isOwner()); }catch(e){}
    try{ S.me = await user.me(); }catch(e){}
    S.echt={isOwner:S.isOwner,me:S.me,role:S.isOwner?"chef":"pending"}; // echte Rolle – die Ansicht kann der Inhaber wechseln
  }
  const timer=setTimeout(()=>{ if(!S.loaded){ S.loadErr="Daten konnten noch nicht geladen werden – bitte Internet prüfen."; render(); } },10000);
  const err = e => { clearTimeout(timer); S.loadErr = e.code==="revoked" ? "Kein Zugriff mehr auf die Daten." : "Datenverbindung unterbrochen ("+e.code+"). Seite neu öffnen."; render(); };
  db.collection("auftraege").onSnapshot(snap=>{
    clearTimeout(timer); S.loaded=true; S.loadErr="";
    const o={}; snap.docs.forEach(d=>o[d.id]={id:d.id,...d.data()});
    // gerade eingegebene Bericht-Listen (Sonderarbeiten, Nächte) gelten, bis der Server sie bestätigt hat
    Object.entries(S.lokal||{}).forEach(([k,l])=>{ if(Date.now()>l.bis||!o[k]){ delete S.lokal[k]; return; } o[k].bericht={...(o[k].bericht||{}),...l.patch}; });
    S.orders=o;
    loadProfiles(Object.values(o).flatMap(x=>[...(x.monteure||[]),x.abschluss?.by].filter(Boolean)));
    scheduleRender();
  }, err);
  db.collection("nachrichten").onSnapshot(snap=>{ const a={}; snap.docs.forEach(d=>a[d.id]={id:d.id,...d.data()}); S.nachrichten=a; loadProfiles(Object.values(a).map(x=>x.von)); scheduleRender(); },()=>{});
  db.collection("reklamationen").onSnapshot(snap=>{ const r={}; snap.docs.forEach(d=>r[d.id]={id:d.id,...d.data()}); S.reklas=r; loadProfiles(Object.values(r).map(x=>x.von)); scheduleRender(); }, ()=>{});
  db.doc("einstellungen/allgemein").onSnapshot(d=>{ S.settings=d.exists?d.data():{}; maybeStoreOwner(); scheduleRender(); }, ()=>{});
  db.doc("einstellungen/rollen").onSnapshot(d=>{
    S.roles=(d.exists?d.data().map:null)||{}; S.rolesInfo=(d.exists?d.data().info:null)||{};
    S.echt.role = S.echt.isOwner ? "chef" : (S.roles[S.echt.me?.id] || "pending"); ansichtAnwenden(); S.rolesLoaded=true;
    if(S.isOwner && S.preise){ const chefs=Object.keys(S.roles).filter(k=>S.roles[k]==="chef").sort().join(","); if(chefs!==[...(S.preise.sichtbarFuer||[])].sort().join(",")) savePreise({}).catch(()=>{}); }
    loadProfiles(Object.keys(S.roles)); scheduleRender();
  }, ()=>{});
  if(S.isOwner) db.collection("zugang").onSnapshot(snap=>{ const z={}; snap.docs.forEach(d=>z[d.id]={id:d.id,...d.data()}); S.zugang=z; scheduleRender(); },()=>{});
  if(S.isOwner) db.collection("anfragen").onSnapshot(snap=>{ const a={}; snap.docs.forEach(d=>a[d.id]={id:d.id,...d.data()}); S.anfragen=a; loadProfiles(Object.keys(a)); scheduleRender(); },()=>{});
  else if(myId()) db.doc("anfragen/"+myId()).onSnapshot(d=>{ S.meineAnfrage=d.exists?d.data():null; scheduleRender(); },()=>{});
  db.collection("fahrzeuge").onSnapshot(snap=>{ const a={}; snap.docs.forEach(d=>a[d.id]={id:d.id,...d.data()}); S.fahrzeuge=a; scheduleRender(); },()=>{});
  db.collection("fahrten").onSnapshot(snap=>{ const a={}; snap.docs.forEach(d=>a[d.id]={id:d.id,...d.data()}); S.fahrten=a; loadProfiles(Object.values(a).map(x=>x.fahrer)); scheduleRender(); },()=>{});
  db.doc("einstellungen/lohnpositionen").onSnapshot(d=>{ S.lohnPos=(d.exists?d.data().items:null)||[]; scheduleRender(); },()=>{});
  db.collection("lohnberichte").onSnapshot(snap=>{ const l={}; snap.docs.forEach(d=>l[d.id]={id:d.id,...d.data()}); S.lohn=l; loadProfiles(Object.values(l).map(x=>x.uid)); scheduleRender(); },()=>{});
  if(S.isOwner) db.doc("lohn/preise").onSnapshot(d=>{ S.preise=d.exists?d.data():null; scheduleRender(); },()=>{});
  else if(myId()) db.doc("lohnsicht/"+myId()).onSnapshot(d=>{ S.preise=d.exists?d.data():null; scheduleRender(); },()=>{});
  if(S.isOwner){
    db.collection("finanzen").onSnapshot(snap=>{ const f={}; snap.docs.forEach(d=>f[d.id]={id:d.id,...d.data()}); S.fin=f; scheduleRender(); }, ()=>{});
  }
  render(true);
}
let ownerStored=false;
async function maybeStoreOwner(){
  if(!S.isOwner||ownerStored||!myId()) return;
  ownerStored=true;
  if(S.settings.ownerId!==myId()){
    try{ await setDoc("einstellungen/allgemein",{...S.settings, ownerId:myId()}); }catch(e){}
  }
}
function editing(){ const a=document.activeElement; return a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !/^(checkbox|radio|file|button)$/i.test(a.type||"") && a.closest("#app"); }
let rq=false;
function scheduleRender(){ if(editing()){ S.pendingRender=true; return; } if(rq) return; rq=true; requestAnimationFrame(()=>{ rq=false; render(); }); }

function tick(){
  document.querySelectorAll("[data-timer]").forEach(el=>{ const o=S.orders[el.dataset.timer]; if(o) el.textContent=fmtDur(totalMs(o)); });
}

/* ============ Rendering ============ */
function route(){ const h=location.hash.replace(/^#/,""); if(h.startsWith("a-")) return {v:"detail",id:h.slice(2)}; return {v:h||"auftraege"}; }
function go(h){ if(location.hash==="#"+h) render(true); else location.hash=h; }

function renderNav(){
  const r=route().v;
  const offR=Object.values(S.reklas).filter(x=>x.offen).length;
  if(S.role==="hersteller" && !S.isOwner){ $("#nav").innerHTML=""; return; }
  if(S.role==="pending"){ $("#nav").innerHTML=""; return; }
  const meineR=can.sub()?Object.values(S.reklas).filter(x=>x.offen&&sichtbar(S.orders[x.auftragId]||{})).length:offR;
  const tunZahl=S.loaded?zuTun().filter(([k])=>k!=="abnahme").reduce((n,[,c])=>n+c,0):0;
  try{ if(S.loaded && navigator.setAppBadge){ (tunZahl?navigator.setAppBadge(tunZahl):navigator.clearAppBadge()).catch(()=>{}); } }catch(e){}
  const items=[["auftraege","📋","Aufträge",tunZahl]];
  if(can.fahrten()) items.push(["fahrten","🚗","Fahrten"]);
  items.push(["rekla","⚠️","Reklam.",meineR]);
  if(can.sub()) items.push(["meine","💶","Abrechnung"]);
  if(can.finanzen()) items.push(["geld","💶","Abrechnung", Object.values(S.fin).filter(f=>f.rechnungStatus==="offen").length]);
  items.push(["setup","⚙️","Setup",S.isOwner?Object.keys(S.anfragen).length+Object.values(S.zugang||{}).filter(z=>!z.code).length:0]); // Setup: Konto, Benachrichtigungen, Abmelden (Chef: alle Einstellungen)
  $("#nav").innerHTML=`<div class="nav-in">${iconize(items.map(([h,ic,l,n])=>`<a href="#${h}" class="${(r===h||(r==="detail"&&h==="auftraege"))?"on":""}" aria-label="${esc(l)}${n?`, ${n} offen`:""}"><span class="nav-ic">${ic}${n?badge(n):""}</span><span class="nav-l">${l}</span></a>`).join(""))}</div>`;
}

function render(scrollTop){
  { const r0=route(); if(r0.v==="detail" && S.orders[r0.id]) alsGelesen(r0.id); }
  renderNav();
  const app=$("#app");
  if(S.loadErr && !S.loaded){ app.innerHTML=`<div class="empty">${esc(S.loadErr)}</div>`; return; }
  if(!S.loaded){ app.innerHTML=`<div class="empty"><span class="spin"></span><br><br>Aufträge werden geladen …</div>`; return; }
  const r=route();
  if(r.v!=="detail" && S.fotoUnsub){ S.fotoUnsub(); S.fotoUnsub=null; S.fotoFor=null; }
  let html=vorschauLeiste();
  if(S.loadErr) html+=`<div class="banner bad">${esc(S.loadErr)}</div>`;
  if(S.role==="pending"){ app.innerHTML=S.rolesLoaded?viewPending()+`<div style="margin-top:16px">${kontoKarte()}</div>`:`<div class="empty"><span class="spin"></span></div>`; bindPending(); bindKonto(); return; }
  if(S.role==="hersteller" && !S.isOwner){ app.innerHTML=iconize(html+viewMeta()); bindMeta(); bind({v:"meta"}); if(scrollTop) window.scrollTo(0,0); return; }
  if(r.v==="detail") html+=viewDetail(r.id);
  else if(r.v==="fahrten" && can.fahrten()) html+=viewFahrten();
  else if(r.v==="woche") html+=viewWoche();
  else if(r.v==="rekla") html+=viewRekla();
  else if(r.v==="geld" && can.finanzen()) html+=viewGeld();
  else if(r.v==="meine" && can.sub()) html+=viewSubAbrechnung();
  else if(r.v==="setup") html+=`<h2 style="margin:0 0 10px;font-size:20px">Setup</h2><div class="setup-grid">${kontoKarte()}${can.setup()?viewSetup():""}</div>`;
  else html+=viewListe();
  app.innerHTML=iconize(html);
  if(S._scrollZiel && S.loaded){ const y=S._scrollZiel; S._scrollZiel=0; requestAnimationFrame(()=>window.scrollTo(0,y)); setTimeout(()=>window.scrollTo(0,y),120); }
  if(r.v==="setup") setupKnoepfe(app);
  bind(r);
  if(scrollTop) window.scrollTo(0,0);
}

/* ---------- Liste ---------- */
function orderChips(o){
  const c=[];

  if(landOf(o)==="lu") c.push(`<span class="chip info">🇱🇺 Luxemburg</span>`);

  else {
    if(o.quelle==="mail-dispo" && !o.zusage) p.push(["gold","📨 Anfrage"]);
    if(o.prodStatus==="abholbereit" && o.nichtVerplant) p.push(["","↩ von Hand verschoben"]);

  if(chef && o.gemeinsam) p.push(anteilOffen(o)?["warn","🤝 Abrechnung prüfen"]:["","🤝 mit Sub"]);

// Liste in Wochen-Kästen (wie die Tage im Kalender)

// meta sieht nur diese Liste: Auftragsnummern, jeder Auftrag steht auf „Offen“, meta tippt nur auf „Abholbereit“
// (mit Namensbestätigung). Kein Öffnen von Aufträgen, keine Navigation, keine Preise.
// Für meta zählt nur die eigene Bestätigung mit Namen – sonst steht der Auftrag auf „Offen“
const metaAbholbereit=o=>!!o.abholbereitBestaetigt;
const fuerMeta=o=>!o.storniert && !istFertig(o) && !abgerechnet(o);
function metaKarte(o){
  const fertig=metaAbholbereit(o), w=planWeek(o), ab=o.abholbereitBestaetigt;
  return `<div class="card metacard ${fertig?"fertig":""}" style="padding:12px 14px">
    <div class="row between" style="flex-wrap:nowrap;gap:10px"><div style="min-width:0"><div style="font-size:20px;font-weight:800;letter-spacing:.3px">${esc(o.nr)}</div>
      <div class="small mute">${[o.bauvorhaben,o.plzOrt].filter(Boolean).map(esc).join(", ")}${w.kw?` · KW ${w.kw}`:""}</div></div>
      ${fertig?`<span class="chip ok" style="font-size:13px;padding:6px 10px">✓ Abholbereit</span>`:`<button class="btn ok" data-mab="${esc(o.id)}" style="white-space:nowrap">Abholbereit</button>`}</div>
    ${fertig?`<div class="small" style="margin-top:6px;color:var(--ok)">${ab?`Bestätigt von <b>${esc(ab.name)}</b> am ${fmtDT(ab.am)}`:"Abholbereit"} · <a href="#" data-mzu="${esc(o.id)}" class="mute">rückgängig</a></div>`:`<div class="small mute" style="margin-top:4px">Offen</div>`}
  </div>`;
}
function viewMeta(){
  let list=Object.values(S.orders).filter(fuerMeta);
  const q=S.q.trim().toLowerCase();
  if(q) list=list.filter(o=>[o.nr,o.bauvorhaben,o.plzOrt].join(" ").toLowerCase().includes(q));
  const kw=o=>{ const w=planWeek(o); return wkKey(w.jahr,w.kw)||999999; };
  // offene zuerst, dann abholbereite; jeweils nach KW
  list.sort((a,b)=>(metaAbholbereit(a)-metaAbholbereit(b))||kw(a)-kw(b)||String(a.nr).localeCompare(String(b.nr),"de",{numeric:true}));
  const offen=list.filter(o=>!metaAbholbereit(o)).length;
  return `<h2 style="margin:4px 0 2px;font-size:20px">Auftragsliste für JD Brüder</h2>
  <div class="small mute" style="margin-bottom:10px">${offen} offen · ${list.length-offen} abholbereit</div>
  ${list.length>8||q?`<div class="toolbar"><input class="i" id="q" placeholder="Auftragsnummer suchen …" value="${esc(S.q)}" inputmode="search"></div>`:""}
  <div style="margin-top:10px">${list.length?list.map(metaKarte).join(""):`<div class="empty">Keine Aufträge.</div>`}</div>
  <div style="margin-top:20px">${kontoKarte()}</div>`;
}
function bindMeta(){
  document.querySelectorAll("[data-mab]").forEach(b=>b.onclick=()=>metaAbholbereitDialog(b.dataset.mab));
  document.querySelectorAll("[data-mzu]").forEach(a=>a.onclick=async e=>{ e.preventDefault(); const o=S.orders[a.dataset.mzu];
    if(!await confirmBox("Zurück auf offen?",`Auftrag ${esc(o.nr)} ist doch noch nicht abholbereit?`,"Ja, zurück auf offen")) return;
    await upd(orderPath(o.id),{prodStatus:o.prodVorMeta||"in_produktion",prodGeaendertAm:Date.now(),prodVon:myId(),abholbereitBestaetigt:null,prodVerlauf:[...(o.prodVerlauf||[]),{status:"offen",am:Date.now(),von:myId()}].slice(-20)}); });
}
function metaAbholbereitDialog(id){
  const o=S.orders[id]; if(!o) return;
  // Abholbereit: nur mit Namensbestätigung
  modal(`<h2>Auftrag ${esc(o.nr)} abholbereit?</h2>
   <div class="small mute">Bitte bestätige mit deinem Namen, dass der Auftrag fertig produziert ist und abgeholt werden kann. JD Brüder sieht das sofort.</div>
   <label class="f">Dein Name (Vor- und Nachname) *</label><input class="i" id="mn" autocomplete="name" value="${esc(S.metaName||"")}" placeholder="z. B. Marion Lülsdorf">
   <label class="row" style="margin-top:10px;gap:8px;flex-wrap:nowrap;cursor:pointer"><input type="checkbox" id="mc" style="width:22px;height:22px"><span>Ich bestätige: Auftrag ${esc(o.nr)} ist <b>fertig und abholbereit</b>.</span></label>
   <div class="grid2" style="margin-top:14px"><button class="btn" data-close>Abbrechen</button><button class="btn ok" id="ok" disabled>✓ Bestätigen</button></div>`,(m,close)=>{
    const nm=m.querySelector("#mn"), mc=m.querySelector("#mc"), ok=m.querySelector("#ok");
    const pruef=()=>{ ok.disabled=!(nm.value.trim().replace(/\s+/g,"").length>=3 && mc.checked); };
    nm.oninput=pruef; mc.onchange=pruef; setTimeout(()=>nm.focus(),100);
    ok.onclick=async()=>{
      const name=nm.value.trim(); if(name.replace(/\s+/g,"").length<3||!mc.checked) return toast("Bitte Namen eintragen und bestätigen");
      ok.disabled=true; S.metaName=name; const now=Date.now();
      try{ await upd(orderPath(id),{prodStatus:"abholbereit",prodVorMeta:o.prodStatus==="abholbereit"?(o.prodVorMeta||"produziert"):(o.prodStatus||"offen"),prodGeaendertAm:now,prodVon:myId(),abholbereitBestaetigt:{name,am:now,von:myId()},nichtVerplant:null,prodVerlauf:[...(o.prodVerlauf||[]),{status:"abholbereit",name,am:now,von:myId()}].slice(-20)}); close(); toast(`Auftrag ${o.nr} ist abholbereit ✓`); S.sync?.run({abholbereit:id}).catch(()=>{}); }
      catch(e){ ok.disabled=false; }
    };
  });
}

async function nachrichtSenden(id, text){
  text=String(text||"").trim(); if(!text) return false;
  const nid=`${id}~${Date.now()}~${Math.random().toString(36).slice(2,6)}`;
  const n={auftragId:id,von:myId(),am:Date.now(),text:text.slice(0,2000)};
  S.nachrichten[nid]={id:nid,...n}; render();
  try{ await setDoc("nachrichten/"+nid,n); S.sync?.run({nachricht:nid}).catch(()=>{}); return true; }
  catch(e){ delete S.nachrichten[nid]; render(); return false; }
}

/* ---------- Terminabstimmung mit dem Bauleiter (Mail mit Antwort-Link) ---------- */
const terminText=t=>t?new Date(t).toLocaleString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})+" Uhr":"";
const terminLinkBasis=()=>location.pathname.includes("/dev/")?location.origin+"/":location.href.split(/[?#]/)[0].replace(/[^/]*$/,"");
// Kalenderwochen für die Terminanfrage: Schlüssel „2026-49“
const kwSchl=(j,k)=>`${j}-${k}`;
function kwAusSchl(key){ const [j,k]=String(key).split("-").map(Number); if(!j||!k) return null; const mo=mondayOf(j,k), fr=new Date(mo); fr.setDate(mo.getDate()+4);
  return {key,kw:k,jahr:j,mo,fr,text:`KW ${k} (${mo.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}–${fr.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})})`}; }
function kwOptionen(n=12){ const out=[]; const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+7-((d.getDay()+6)%7));
  for(let i=0;i<n;i++){ const mo=new Date(d); mo.setDate(d.getDate()+i*7); const w=isoWeek(mo); out.push(kwAusSchl(kwSchl(w.jahr,w.kw))); } return out; }
function terminAnfrageText(o,vs,link,kws=null){
  const st=S.settings||{}, tel=st.firmenTelefon||"02684 9572269", firma=st.monteurName||"JD Brüder GbR";
  const adr=adresseOf(o);
  const L=[o.bauleiterName?`Guten Tag ${o.bauleiterName},`:"Sehr geehrte Damen und Herren,","",
    "wir sind von meta Trennwandanlagen mit der Montage der WC-Trennwände für Ihr Bauvorhaben beauftragt und möchten den Montagetermin direkt mit Ihnen abstimmen.","",
    `Bezug: meta-Auftrag ${o.nr}${o.vorgang?` (Vorgang ${o.vorgang})`:""} – laut den uns vorliegenden Unterlagen`,
    o.bauvorhaben?`Bauvorhaben: ${o.bauvorhaben}`:null, adr?`Baustelle: ${adr}`:null, o.kabinen&&o.kabinen!=="0"?`Umfang: ${o.kabinen} Kabinen`:null,"",
    "Für die Montage müssen die Räume fertiggestellt sein (Fliesen verlegt, Wände und Böden fertig, Räume frei zugänglich). Bitte geben Sie uns dafür kurz Ihre Freigabe.","",
    ...(kws?(kws.length?[kws.length>1?"Wir können in folgenden Kalenderwochen montieren:":"Wir können in dieser Kalenderwoche montieren:",...kws.map(k=>`• ${kwAusSchl(k)?.text||k}`)]
       :["Bitte teilen Sie uns mit, in welcher Kalenderwoche die Montage für Sie am besten passt."])
      :[vs.length>1?"Unsere Terminvorschläge:":"Unser Terminvorschlag:", ...vs.map(v=>`• ${terminText(v)}`)]),"",
    kws?"Bitte antworten Sie mit einem Klick – Kalenderwoche auswählen, Freigabe geben oder Ihren Wunsch nennen:":"Bitte antworten Sie mit einem Klick – Termin bestätigen, Freigabe geben oder Ihren Wunschtermin nennen:", link,"",
    `Sie können auch einfach auf diese Mail antworten oder uns anrufen: ${tel}`,"",
    "Mit freundlichen Grüßen", firma, `Tel. ${tel}`];
  return L.filter(x=>x!==null).join("\n");
}
function terminAnfrageKarte(o){
  const a=o.terminAnfrage; if(!a||!a.am) return "";
  const st={offen:["info","⏳ Antwort ausstehend"],zugesagt:["ok","✅ Termin bestätigt"],gegenvorschlag:["warn","📅 Anderer Terminwunsch"],nicht_bereit:["bad","⛔ Noch nicht montagebereit"],uebernommen:["ok","✅ Wunschtermin übernommen"],kw_zugesagt:["ok","🗓 KW bestätigt"],kw_wunsch:["warn","🗓 Andere KW gewünscht"]}[a.status]||["info",a.status||""];
  const an=a.antwort;
  return `<div class="card"><div class="row between" style="flex-wrap:nowrap;gap:8px"><h3 style="margin:0">📧 Terminabstimmung</h3><span class="chip ${st[0]}">${st[1]}</span></div>

   <div class="small" style="margin-top:6px">${a.art==="kw"?((a.kws||[]).length?`KW-Vorschläge: ${(a.kws||[]).map(k=>"KW "+esc(k.split("-")[1])).join(" · ")}`:"Kunde sucht sich die KW aus"):`${(a.vorschlaege||[]).length>1?"Vorschläge":"Vorschlag"}: ${(a.vorschlaege||[]).map(v=>esc(terminText(v))).join(" · ")}`}</div>
   ${an?`<div class="banner ${st[0]} small" style="margin:8px 0 0"><b>${esc(an.name||"")}</b> · ${fmtDT(an.am)}<br>${an.status==="nicht_bereit"?"Räume noch nicht fertig":an.kwKey?esc(kwAusSchl(an.kwKey)?.text||an.kwKey):esc(terminText(an.termin))}${an.nachricht?`<br>„${esc(an.nachricht)}“`:""}</div>`:""}
   ${can.planen()&&/^kw_/.test(a.status||"")&&o.terminStatus!=="fest"&&an?.kwKey?`<button class="btn ok block" id="taKwTag" style="margin-top:8px">📅 Montagetag in KW ${esc(an.kwKey.split("-")[1])} festlegen</button>`:""}
   ${can.planen()&&a.status==="gegenvorschlag"?`<button class="btn ok block" id="taUebernehmen" style="margin-top:8px">✓ Wunschtermin übernehmen</button>`:""}
   ${can.planen()&&a.status!=="zugesagt"&&a.status!=="uebernommen"?`<button class="btn ghost block sm" id="taNeu" style="margin-top:6px">Neue Anfrage senden</button>`:""}</div>`;
}

      ${a.abgegebenAm||a.bestaetigtAm?abrechnungTabelle(l?{...l,uid:u}:null,can.preise()&&subPreiseAn()?S.preise:null):`<div class="small mute">Der Subunternehmer trägt seine Positionen gerade ein.</div>`}
      ${a.abgegebenAm&&!a.bestaetigtAm?`<button class="btn ok block" data-anteil-ok="${esc(u)}" style="margin-top:8px">✓ Abrechnung bestätigen</button>`:""}</div>`; }).join("")}
    <div class="small mute" style="margin-top:6px">Nur für die Abrechnung mit dem Subunternehmer – geht nicht an meta.</div></div>`;
